# Daily data refresh: MLB pitcher correlation data + NBA, NFL and NHL correlations.
#
# Pulls new box scores from ESPN's public APIs, rebuilds the derived JSON in
# public/data/, and commits the result to the default branch. Dedupe against
# the xlsx feed lives in build_pitcher_data.py (merge by pitcher+date), so
# rerunning is always safe — no start is ever double-counted.
#
# 11:00 UTC = 6/7am ET, after even the latest West Coast games are final.
# If nothing changed (off-day, off-season), no commit is made.
name: Refresh MLB + NBA + NFL + NHL data

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl numpy requests

      - name: Fetch MLB starting-pitcher box scores from ESPN
        run: python scripts/fetch_espn_2026_pitchers.py

      - name: Rebuild pitcher JSONs (merges ESPN supplement, dedupes vs xlsx)
        run: python build_pitcher_data.py

      - name: Rebuild correlation aggregates
        run: python build_aggregates.py

      - name: Refresh NBA correlations
        run: python scripts/nba_fetch_correlations.py --workers 16

      - name: Refresh NBA quarter line scores
        continue-on-error: true
        run: python scripts/nba_fetch_quarters.py --workers 16

      # Game logs + play-by-play assist links for the NBA TEAMMATES tab (last
      # season + this one, current rosters). Exits non-zero and leaves the file
      # alone if ESPN returns nothing.
      - name: Refresh NBA teammate logs
        continue-on-error: true
        run: python scripts/nba_teammate_logs.py --workers 16

      # New NBA finals with their closing spread and total and their box
      # scores (ESPN), then the game-line correlations behind the Novig
      # Scan's NBA Team board rebuilt. A day ESPN doesn't answer for is asked
      # again on the next run.
      - name: Refresh NBA game-line correlations
        continue-on-error: true
        run: python scripts/nba_line_correlations.py --fetch

      # The script exits non-zero rather than overwrite the data file when ESPN
      # returns nothing; that shouldn't block the MLB/NBA commit below.
      - name: Refresh NFL receiving correlations
        continue-on-error: true
        run: python scripts/nfl_fetch_correlations.py --workers 16

      # League-wide QB + receiver and prop + game-line correlations from
      # nflverse (halftime scores from ESPN, for the first-half lines). Leaves
      # the file alone if nflverse returns too little or ESPN nothing.
      - name: Refresh NFL stack and game-line correlations
        continue-on-error: true
        run: python scripts/nfl_stack_correlations.py

      # New NHL games from ESPN box scores, appended to the skater history
      # (public/data/nhl_game_logs.json, seeded from MoneyPuck.com), then the
      # milestone correlations rebuilt (each skater's own pairs, teammates', and points with game lines). A game is one row per skater per date,
      # so a rerun never counts one twice; with ESPN down the history is left
      # as it is and the correlations rebuilt from it.
      - name: Refresh NHL skater logs and correlations
        continue-on-error: true
        run: python scripts/nhl_fetch_correlations.py

      - name: Commit and push if data changed
        run: |
          git add espn-2026-pitcher-supplement.json public/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily data refresh: MLB pitchers + NBA/NFL/NHL correlations [skip ci]"
          # The run takes ~25 min, and a commit landing on main in the
          # meantime rejects a plain push. Rebase onto it (this run's fresh
          # data wins a conflict) and retry.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 15
          done
          exit 1
