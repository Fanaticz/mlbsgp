<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Novig SGP Scanner</title>
<style>
  :root {
    --bg:#0f1419; --panel:#1a2129; --line:#2a333d; --txt:#e6edf3;
    --muted:#8b98a5; --accent:#f5a623; --pos:#3fb950; --neg:#f85149;
  }
  * { box-sizing:border-box; }
  /* iOS enlarges text it thinks is body copy, which made rows change size. */
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--txt);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:14px 22px 10px; display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 14px; }
  h1 { margin:0; font-size:18px; }
  .sub { color:var(--muted); font-size:12.5px; }
  .sub.err { color:var(--neg); }
  .sub b { color:var(--txt); font-weight:600; }
  a { color:var(--accent); text-decoration:none; }
  .controls { display:flex; flex-wrap:wrap; gap:10px 12px; align-items:center; padding:10px 22px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line); position:sticky; top:0;
    background:var(--bg); z-index:5; }
  .toggle { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .toggle button { background:transparent; color:var(--muted); border:0; padding:7px 13px; font-size:13px; cursor:pointer; }
  .toggle button.on { background:var(--accent); color:#1a1a1a; font-weight:600; }
  input[type=search], input[type=number] { background:var(--panel); border:1px solid var(--line);
    color:var(--txt); border-radius:8px; padding:7px 10px; font-size:13px; }
  input[type=search] { width:170px; }
  input[type=number] { width:62px; margin-left:4px; }
  label.muted { color:var(--muted); font-size:13px; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
  .muted { color:var(--muted); }
  .back { margin-left:auto; font-size:13px; white-space:nowrap; }
  .bar { height:2px; background:var(--line); }
  .bar i { display:block; height:2px; width:0; background:var(--accent); transition:width .4s; }

  .board { padding:0 12px 24px; }
  .row, .head { display:grid; align-items:center; gap:0 12px; padding:9px 10px;
    grid-template-columns:minmax(190px,1.5fr) minmax(170px,1.3fr) repeat(6, minmax(58px,.5fr)) 46px; }
  .head { position:sticky; top:53px; background:var(--panel); color:var(--muted); font-weight:600; font-size:11px;
    text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line); z-index:4; }
  .head .num, .row .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .row { border-bottom:1px solid var(--line); cursor:pointer; }
  .row:hover { background:#161d25; }
  .row.old { opacity:.55; }
  .kept { padding:14px 12px 6px; color:var(--muted); font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; border-top:1px solid var(--line); }
  .who b { font-weight:600; }
  /* Name, then team and tip (which give way first), then the chip, always whole. */
  .who { display:flex; align-items:baseline; min-width:0; }
  .who b { flex:none; }
  .who small { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .re { margin-left:6px; background:none; border:1px solid var(--line); color:var(--muted); border-radius:999px; width:24px; height:24px;
        padding:0; font-size:13px; line-height:1; cursor:pointer; vertical-align:middle; }
  .re:hover { color:var(--txt); border-color:var(--muted); }
  a.nv { color:inherit; text-decoration:underline; text-decoration-color:var(--muted); text-underline-offset:3px; white-space:nowrap; }
  a.nv:hover { text-decoration-color:var(--txt); }
  .re.spin { animation:respin 0.9s linear infinite; opacity:.6; }
  @keyframes respin { to { transform:rotate(360deg); } }
  .more { flex:none; margin-left:8px; background:none; border:1px solid var(--line); color:var(--muted); border-radius:999px;
    padding:1px 9px; font-size:11.5px; cursor:pointer; white-space:nowrap; }
  .row.sub { background:#12181f; }
  .row { touch-action:pan-y; }   /* a sideways drag is ours (swipe right to hide); up and down still scrolls */
  .row.drag { transition:none; user-select:none; -webkit-user-select:none; }
  #unhide { background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer; }
  .row.sub .legs { padding-left:14px; }
  .who small, .legs small { color:var(--muted); font-size:11.5px; margin-left:6px; white-space:nowrap; }
  .legs { overflow:hidden; text-overflow:ellipsis; }
  .rough { color:var(--accent); cursor:help; margin-left:4px; }
  .fair { color:var(--accent); font-weight:600; }
  .ev { font-weight:700; }
  .ev.pos { color:var(--pos); }
  .ev.neg { color:var(--neg); font-weight:500; }
  .lab { display:none; }
  .det { grid-column:1 / -1; padding:8px 0 2px; cursor:default; }
  .lgs { display:flex; flex-wrap:wrap; gap:6px; }
  .lg { border:1px solid var(--line); border-radius:7px; padding:3px 9px; font-size:13px; color:var(--muted); white-space:nowrap; }
  .lg b { color:var(--txt); font-weight:600; margin-left:4px; }
  .lg small { font-size:11px; }
  .tech { color:var(--muted); font-size:11.5px; margin-top:7px; }
  /* My bets: the strip above the board, the badges on rows and the form in an
     open row. body.nobets hides all of it (for a screenshot). */
  /* A chip is never wider than the screen: a long slip's text is cut short, not the page pushed sideways. */
  .chip { border:1px solid var(--line); border-radius:999px; padding:2px 10px; white-space:nowrap; background:var(--panel);
    display:inline-flex; align-items:baseline; max-width:100%; box-sizing:border-box; }
  .chip b { color:var(--pos); margin-left:5px; font-variant-numeric:tabular-nums; flex:none; }
  .chip small { color:var(--muted); margin-left:6px; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .chip .cx { flex:none; background:none; border:0; color:var(--muted); cursor:pointer; font-size:14px; padding:0 0 0 8px; }
  .bet { flex:none; margin-left:8px; color:var(--pos); border:1px solid var(--pos); border-radius:999px; padding:0 8px;
    font-size:11.5px; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .betform { margin-top:9px; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; font-size:12.5px; color:var(--muted); }
  .betform input { width:78px; margin:0; }
  .betform button { background:none; border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:6px 11px; font-size:12.5px; cursor:pointer; }
  .betform .mine { color:var(--pos); }
  .betform .kbet { border-color:var(--pos); color:var(--pos); font-weight:600; }
  .betform .kmsg { color:var(--txt); }
  .betform .x { padding:1px 7px; color:var(--muted); margin-left:2px; }
  #top10 { background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer; white-space:nowrap; }
  #top10.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  #hidebets { background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer; }
  .betline { grid-column:1 / -1; padding-top:5px; font-size:12.5px; color:var(--pos); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .betline b { font-variant-numeric:tabular-nums; }
  .betline.also { color:var(--muted); white-space:normal; }
  .betline.also b { color:var(--pos); }
  .row.has { box-shadow:inset 3px 0 0 var(--pos); }
  body.nobets .bet, body.nobets .betline, body.nobets .betform:not(.kbetrow) { display:none; }
  body.nobets .row.has { box-shadow:none; }
  body.nobets #hidebets { border-color:var(--accent); color:var(--accent); font-weight:600; }
  /* The Ladder tab: both books' prices in the price cell, the better one bright; the row's action under it. */
  .bk { display:block; color:var(--muted); font-size:inherit; font-weight:400; white-space:nowrap; }
  .bk.best { color:var(--pos); font-weight:700; }
  .bk a.nv { color:inherit; }
  .evbk { display:block; font-size:10.5px; font-weight:400; color:var(--muted); letter-spacing:.02em; }
  .betform a.nbtn { border:1px solid var(--accent); color:var(--accent); border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:600; text-decoration:none; white-space:nowrap; }
  .betform .kother { color:var(--muted); }
  /* On a phone the two prices take two of the row's four columns; the QK in units gives way (QK $ stays). */
  @media (max-width:760px) { .row .num.both { grid-column:span 2; } .row:has(.num.both) .qk { display:none; } }
  .tag.q { margin:0 0 0 7px; border-color:#b8860b; color:#e0a82e; font-weight:700; }   /* questionable on the injury report */
  .tag { flex:none; margin-right:7px; border:1px solid var(--line); border-radius:5px; padding:0 5px; font-size:10.5px;
    font-weight:600; color:var(--accent); white-space:nowrap; letter-spacing:.02em; }
  #auto { background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer; white-space:nowrap; }
  #auto.on { border-color:var(--pos); color:var(--pos); font-weight:600; }
  /* The All tab gathers every board: no pass of its own, no pair or game filter. */
  body.all #mode, body.all #game, body.all #now, body.all #pair { display:none !important; }
  /* The Kalshi NBA tab gathers the four NBA boards the same way, and its Fetch prices all four. */
  body.all.grp #now { display:inline-block !important; }
  .empty { padding:28px 14px; color:var(--muted); text-align:center; line-height:1.7; }
  .foot { padding:4px 22px 60px; color:var(--muted); font-size:12px; line-height:1.7; max-width:900px; }

  @media (max-width:760px) {
    header { padding:12px 14px 8px; }
    .controls { padding:8px 14px; gap:8px 10px; }
    .toggle { flex:1 1 40%; }
    .toggle button { flex:1; padding:9px 8px; }
    #league { flex:1 1 100%; }
    #league button { padding:9px 3px; font-size:12px; }
    input[type=search] { flex:1 1 40%; width:auto; min-width:0; }
    input[type=search], input[type=number] { font-size:16px; }
    .board { padding:0 6px 24px; }
    .head { display:none; }
    .row { grid-template-columns:repeat(4, minmax(0,1fr)) auto; gap:5px 8px; padding:11px 8px; }
    .who { grid-column:1 / span 4; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ev { grid-column:5; grid-row:1; font-size:17px; }
    .legs { grid-column:1 / -1; font-size:15px; }
    .row.sub { padding-left:20px; }
    .row.sub .who { display:none; }
    .row.sub .legs { grid-column:1 / span 4; grid-row:1; padding-left:0; }
    .row .num:not(.ev) { font-size:14px; }
    .foot { font-size:11.5px; }
    .row .num:not(.ev) { text-align:left; }
    .re { width:32px; height:32px; font-size:16px; margin-left:8px; }
    .lab { display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; font-weight:400; }
    .rr { display:none; }
    .foot { padding:4px 14px 60px; }
    .betform input { font-size:16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Novig SGP scanner</h1>
  <div class="sub" id="status">Starting…</div>
</header>
<div class="controls">
  <div class="toggle" id="league">
    <button data-league="all" title="Every board's plays in one list, best first">All</button>
    <button data-league="nba" class="on">NBA</button>
    <button data-league="ladder" title="NBA shooters' higher lines, one-way lines included, priced on Novig and on Kalshi">NBA Ladder</button>
    <button data-league="nbateam" title="NBA: a player's prop with his game's spread, total or a team total, and slips across a game's own lines">NBA Team</button>
    <button data-league="nfl">NFL</button>
    <button data-league="nflladder" title="NFL: higher yards lines with a touchdown, receptions or passing TDs, priced on Novig and on Kalshi">NFL Ladder</button>
    <button data-league="nhl" hidden title="NHL: a skater's goals with his shots on goal, and two teammates' points">NHL</button>
    <button data-league="nhllines" hidden title="NHL: a skater's points with the moneyline, puck line, game total or his team's total">NHL Lines</button>
    <button data-league="soccer">Soccer</button>
    <button data-league="cfb" title="College football: slips across one game's lines (moneyline, spread, total, team total)">CFB</button>
    <button data-league="cbb" title="College basketball: a game's spread with its total">CBB</button>
    <button data-league="kalshinbaall" hidden title="NBA: the four NBA boards in one list, best first. Fetch prices all four in one pass, player by player. The dropdown below shows one board alone.">Kalshi NBA</button>
    <button data-league="kalshinflall" hidden title="NFL: the three NFL boards in one list, best first. Fetch prices all three in one pass, player by player. The dropdown below shows one board alone.">Kalshi NFL</button>
    <button data-league="kalshinba3" hidden title="NBA: one player's Points + Threes, asked as Kalshi combos. Fetch only: Auto-scan leaves it out.">Kalshi Pts + 3s</button>
    <button data-league="kalshinba" hidden title="NBA: a player's other pairs and each team's top two scorers, asked as Kalshi combos. Fetch only: Auto-scan leaves it out.">Kalshi NBA Pairs</button>
    <button data-league="kalshinbatri" hidden title="NBA: three legs on one high scorer (points with two of rebounds, assists and threes), asked as Kalshi combos. Fetch only: Auto-scan leaves it out.">Kalshi NBA 3-Leg</button>
    <button data-league="kalshinbaline" hidden title="NBA: a player's prop with a game line (spread, totals, first half), asked as Kalshi combos. Fetch only: Auto-scan leaves it out.">Kalshi NBA Lines</button>
    <button data-league="kalshinfl" hidden title="NFL: one player's own props, and a quarterback's with his teammate's, Overs and Unders, asked as Kalshi combos. Fetch only: Auto-scan leaves it out.">Kalshi NFL</button>
    <button data-league="kalshinflline" hidden title="NFL: a player's prop with a game line (total, spread, moneyline, team total, first half), asked as Kalshi combos. Fetch only: Auto-scan leaves it out.">Kalshi NFL Lines</button>
    <button data-league="kalshinfltri" hidden title="NFL: three legs in one game (a player's own props, a quarterback's with his receiver's, or two props with a game line), asked as Kalshi combos. Fetch only: Auto-scan leaves it out.">Kalshi NFL 3-Leg</button>
    <button data-league="kalshicbb" hidden title="College basketball: a game's spread with its total, asked as Kalshi combos. Fetch only: Auto-scan leaves it out.">Kalshi CBB</button>
    <button data-league="kalshicfb" hidden title="College football: slips across one game's lines (moneyline, spread, total, team total, first half), asked as Kalshi combos. Fetch only: Auto-scan leaves it out.">Kalshi CFB</button>
  </div>
  <div class="toggle" id="mode">
    <button data-mode="plays" class="on">Plays</button>
    <button data-mode="all">All combos</button>
  </div>
  <select id="kboard" title="All of this sport's Kalshi boards together, or one board alone (its own Fetch, and its slips under Min EV)" style="display:none;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px"></select>
  <input type="search" id="search" placeholder="Filter by name…" />
  <select id="pair" title="Show one kind of combo" style="background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px">
  </select>
  <label class="muted" title="Plays shows combos at this EV or better.">Min EV %
    <input type="number" id="minev" value="0" step="1" /></label>
  <label class="muted" title="Also price legs on Novig books up to 8¢ wide (10¢ for the second threes milestone). Their fair values are rough: marked ~.">
    <input type="checkbox" id="wide" /> Wide books</label>
  <select id="game" title="Fetch one game or one slate instead of the whole board" style="background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px;max-width:230px">
    <option value="">All games</option>
  </select>
  <button type="button" id="now" title="Run one pass. Nothing is asked of Novig until you press this: each pass sends every combo to its pricers as a live auction. While a pass runs, this button stops it." style="background:var(--accent);border:0;color:#1a1a1a;font-weight:600;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;white-space:nowrap">Fetch</button>
  <button type="button" id="auto" title="Auto-scan: the server prices every board (NBA, NBA Team, NFL, CBB, CFB, soccer) one after another, over and over, with this page open or closed. Each board's next day of games only; the NFL and soccer through Sunday and CFB through Saturday. It runs until you press this again; with it off the server prices nothing by itself. Each pass sends every combo to Novig's pricers.">Auto-scan</button>
  <button type="button" id="top10" title="Price the ten best rows on screen again, one after another: today’s leg prices and a new Novig quote for each. Press again to stop.">Rescan top 10</button>
  <button type="button" id="unhide" style="display:none" title="Bring back the rows you swiped away."></button>
  <button type="button" id="hidebets" title="Hide or show your own bets on this page, for a screenshot.">Hide my bets</button>
  <a class="back" id="corr" href="nba.html">Correlations →</a>
</div>
<div class="bar"><i id="bar"></i></div>
<form class="empty" id="lock" style="display:none">
  <div id="lockmsg">Private. Enter the passcode.</div>
  <input type="password" id="pass" autocomplete="current-password" style="margin-top:10px;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 12px;font-size:16px;width:220px" />
  <button type="submit" style="margin-left:6px;background:var(--accent);border:0;border-radius:8px;padding:10px 16px;font-weight:600;font-size:14px">Open</button>
</form>
<div class="board">
  <div class="head">
    <div>Player</div><div>Legs</div><div class="num">Fair</div><div class="num" id="bookhead">Novig</div>
    <div class="num">EV</div><div class="num">QK</div><div class="num" title="Quarter Kelly in dollars, at $200 a unit">QK $</div><div class="num">r</div><div class="num">Age</div>
  </div>
  <div id="rows"></div>
</div>
<div class="foot" id="foot"></div>

<script>
// The board comes from the server: /api/nba/novig-scan runs
// .claude/skills/nba-sgp-fv/scan.py (one pass at a time) and returns what it
// has priced so far. Polling is what keeps it scanning, so this page only
// polls while it is actually on screen.
let S = null;              // last response
let NOW = false;           // Fetch was pressed: ask for a pass on the next poll
let STOP = false;          // Stop was pressed: end the running pass on the next poll
let GOT = 0;               // when it arrived (ms, this clock)
let MODE = "plays", WIDE = false, MINEV = 0, LEAGUE = new URLSearchParams(location.search).has("kalshi") ? "kalshinbaall" : new URLSearchParams(location.search).has("ladders") ? "ladder" : "nba";
const PAIR_OPTS = {
  all: [],   // every board's plays together
  nba: [],   // one slip a player now: main-line Points + Threes
  ladder: [],   // NBA shooters' higher lines
  nflladder: [["yds,td", "REC YDS + TD"], ["yds,rec", "REC YDS + REC"], ["ryds,td", "RUSH YDS + TD"], ["pyds,ptd", "PASS YDS + PASS TD"]],
  nfl: [["rec,yds", "REC + YDS"], ["rec,td", "REC + TD"], ["yds,td", "YDS + TD"],
        ["pyds,ptd", "QB: PASS YDS + PASS TD"], ["cmp,pyds", "QB: CMP + PASS YDS"], ["att,cmp", "QB: ATT + CMP"],
        ["att,pyds", "QB: ATT + PASS YDS"], ["cmp,ptd", "QB: CMP + PASS TD"],
        ["ryds,td", "RUSH YDS + TD"], ["rry,td", "RUSH+REC YDS + TD"], ["car,td", "CAR + TD"],
        ["mix", "Unders: any slip with a prop Under"], ["k:stack", "QB + his teammate"], ["k:over", "Prop + game total"], ["k:cover", "Prop + spread"], ["k:win", "Prop + moneyline"], ["k:tt", "Prop + team total"],
        ["k:h1over", "Prop + 1H total"], ["k:h1cover", "Prop + 1H spread"], ["k:h1win", "Prop + 1H moneyline"],
        ["3", "Three legs: all"], ["k:own3", "3: his own props"], ["k:pairline", "3: two props + a game line"], ["k:stackline", "3: QB + receiver + a game line"], ["k:stack3", "3: QB + receiver, three props"],
        ["l:over", "3: with the game total"], ["l:cover", "3: with the spread"], ["l:win", "3: with the moneyline"], ["l:tt", "3: with a team total"],
        ["l:h1over", "3: with the 1H total"], ["l:h1cover", "3: with the 1H spread"], ["l:h1win", "3: with the 1H moneyline"]],
  nbateam: [["k:cover", "Prop + spread"], ["k:game", "Game lines only"]],
  nhl: [["g,sog", "Own: GOALS + SOG"], ["k:mate", "Teammates"]],
  nhllines: [["k:win", "Points + moneyline"], ["k:cover", "Points + puck line"], ["k:over", "Points + game total"], ["k:tt", "Points + team total"]],
  soccer: [["n3", "Win + corners"], ["n4", "With a goals leg"]],
  cfb: [["k:dogml", "Underdog ML + Under"], ["k:cover", "Spread + total"], ["k:tt", "With a team total"], ["k:half", "First half + game"]],
  cbb: [["k:cover", "Spread + total"], ["k:tt", "With a team total"], ["k:half", "First half + game"]],
  kalshinbaall: [],   // the four Kalshi NBA boards together
  kalshinflall: [],   // the three Kalshi NFL boards together
  kalshinba3: [],
  kalshinba: [],
  kalshinbatri: [],
  kalshinbaline: [["l:cover", "With the spread"], ["l:tt", "With his team's total"], ["l:opp_tt", "With the other team's total"], ["l:over", "With the game total"], ["l:h1cover", "With the 1H spread"], ["l:h1over", "With the 1H total"]],
  kalshinfl: [["mix", "Unders: any slip with a prop Under"], ["k:stack", "QB + his teammate"]],

const liveBets = () => BETS.filter(b => (b.starts ? b.starts + 5 * 3600000 : b.at + 86400000) > Date.now());
const total = list => list.reduce((s, b) => s + b.stake, 0);
// A row's own line for what I have down: on this slip (green, with a green
// edge on the row), or, on a player's first row, on his other slips (grey).
// A Kalshi row above fair carries its Bet button on the row, open or not: one press buys it.
function kbetLine(c) {
  const msg = KMSG.get(rk(c)) || "";
  if (c.book !== "kalshi" || c.ghost || !(c.ev > 0 || msg)) return "";
  return `<div class="betform kbetrow" style="grid-column:1 / -1">` + (c.ev > 0 ? `<button type="button" class="kbet" data-kbet="${esc(rk(c))}"` +
    ` title="Buys this combo on Kalshi now: the row's QK $ less what is already on this slip, or the stake typed in the opened row. Not placed if the price is more than 1% worse than shown or the slip is no longer above fair.">` +
    kbetText(c) + ` at ${c.slip_x.toFixed(2)}x</button>` : "") + `<span class="kmsg">${esc(msg)}</span></div>`;
}
// group: every row of his card. A row with nothing on it says what is on his other slips (Max, 11-25: a
// row under a bet of his looked like nothing was down on him), in grey so it can't pass for this row's bet.
function alsoLine(c, group) {
  const on = (group || []).filter(o => o !== c).map(o => [o, kbetOn(o)]).filter(x => x[1] > 0);
  if (!on.length) return "";
  return `<div class="betline also">Already on ${esc(c.player.split(" ").slice(-1)[0])}: ` + on.map(([o, v]) => `<b>${usd(v)}</b> on ${esc(o.label)}`).join("; ") + `</div>`;
}
function betLine(c, group) {
  const onK = heldLine(c);
  if (onK) return onK;   // what Kalshi says is held beats this device's own note of it
  const mine = liveBets().filter(b => b.key === c.key);
  if (mine.length) return `<div class="betline">✓ You bet <b>${usd(total(mine))}</b>` +
    (mine.length === 1 ? (mine[0].x ? ` at ${mine[0].x.toFixed(2)}x` : "") : ` in ${mine.length} bets: ${mine.map(b => usd(b.stake) + (b.x ? ` at ${b.x.toFixed(2)}x` : "")).join(", ")}`) +
    (c.ghost ? ` <span style="color:var(--muted)" title="This slip is not on the board now (the board was emptied, or its last pass did not ask it). The numbers are from when it was last priced.">· not on the board now</span>` : "") + `</div>`;
  return alsoLine(c, group);
}
// The strip of my bets above the board is gone (Max, 11-18: not needed). A
// bet shows on its own row, and is removed with the × in the opened row.
function betStrip() {
  document.body.classList.toggle("nobets", HIDEBETS);
  document.getElementById("hidebets").textContent = HIDEBETS ? "Bets hidden · show" : "Hide my bets";
}

// Shown on screen: the tab is visible and, inside the site's tab frame, that
// frame is the one displayed.
function shown() {
  if (document.visibilityState !== "visible") return false;
  try { return !window.frameElement || window.frameElement.offsetParent !== null; } catch (_) { return true; }
}

function age(row) {
  // The server's clock stamps both `now` and each row, so the phone's clock doesn't matter.
  const s = Math.max(0, (S.now + (Date.now() - GOT)) / 1000 - row.at);
  return s < 90 ? `${Math.round(s)}s` : s < 5400 ? `${Math.round(s / 60)}m` : s < 172800 ? `${Math.round(s / 3600)}h` : `${Math.round(s / 86400)}d`;
}
// While a pass runs, rows it hasn't re-priced yet are from the pass before: dimmed.
// On the All tab: the same for the row's own board, and any row over an hour old.
const isOld = row => {
  if (!ALL()) return S.scanning && row.at * 1000 < S.started;
  const b = (S.boards || []).find(b => b.league === row.board);
  return b && b.scanning ? row.at * 1000 < b.started : (S.now + (Date.now() - GOT)) / 1000 - row.at > 3600;
};
// A row's Novig price as a link into Novig with its legs on the slip. On a
// phone it opens the Novig app itself (novigapp://events/<outcome ids>), so
// this page stays where it is to come back to (Max, 11-16: the home-screen
// app has no back button to leave a page it was sent to). On a computer it
// is /n/<outcome ids> on this server, which goes to novig.com, in a new tab.
const PHONE = /iphone|ipad|ipod|android/i.test(navigator.userAgent);
const nvLink = (c, text) => {
  if (c.book === "kalshi" && /^https:\/\/kalshi\.com\//.test(c.url || "")) return `<a class="nv" href="${esc(c.url)}" target="_blank" rel="noopener" title="Open this game on Kalshi (build the combo there)">${text} ↗</a>`;
  const ids = (c.legs || []).map(L => L.id);
  if (!ids.length || !ids.every(i => /^[0-9a-f-]{36}$/i.test(i))) return text;
  return PHONE ? `<a class="nv" data-app="1" href="novigapp://events/${ids.join(",")}">${text} ↗</a>`
    : `<a class="nv" href="/n/${ids.join(",")}" target="_blank" rel="noopener" title="Open Novig with these legs on the slip">${text} ↗</a>`;
};

// A Ladder row's second price: what Kalshi pays for the same slip after its fee (the server's
// kalshi_x; kalshi_why where it has none). Green when it is more than Novig's.
const kalBetter = c => c.book !== "kalshi" && c.kalshi_x > 0 && c.kalshi_x > c.slip_x + 0.005;
// The Ladder tab is neither a Novig board nor a Kalshi one (Max, 11-27: make ladders adaptive): each
// row stands at whichever of the two pays more for the slip. adapt() sets, on a row from the server,
// best ("kalshi" | "novig") and puts that book's EV and quarter Kelly in ev and qk, so the list's order,
// Plays, Min EV, the QK $ and the row's button all follow the better price. Novig's own stay in nv_ev, nv_qk.
function adapt(c) {
  if (!LPAGE || !c || c.book === "kalshi" || c.stub) return c;
  if (c.nv_ev === undefined) { c.nv_ev = c.ev; c.nv_qk = c.qk; }
  const k = kalBetter(c);
  c.best = k ? "kalshi" : "novig";
  c.ev = k ? c.kalshi_ev : c.nv_ev;
  c.qk = k ? (c.kalshi_qk || 0) : c.nv_qk;
  return c;
}
const kwhy = c => (/^Kalshi/.test(c.kalshi_why) ? "" : "Kalshi: ") + c.kalshi_why;
// The price cell on the Ladder tab: both books' prices for the slip, the better one first in weight.
const kalLine = c => {
  if (c.book === "kalshi" || c.stub || !(c.kalshi_x || c.kalshi_why)) return "";
  if (!c.kalshi_x) return `<small class="bk" title="${esc(kwhy(c))}">KAL —</small>`;
  return `<small class="bk${kalBetter(c) ? " best" : ""}" title="What Kalshi pays for the same slip after its fee (${pct(c.kalshi_ev)} at this fair value)">KAL ${c.kalshi_x.toFixed(2)}x</small>`;
};
const priceCell = c => !LPAGE || c.book === "kalshi" || c.stub ? null :
  `<span class="lab">Novig · Kalshi</span><span class="bk${c.best === "kalshi" ? "" : " best"}">NV ${nvLink(c, c.slip_x.toFixed(2) + "x")}</span>${kalLine(c)}`;
// The row's one action (Max, 11-27): the Bet button for Kalshi where Kalshi pays more, the link into
// Novig where Novig does. Shown on a row above fair at its better price.
function lbetLine(c) {
  if (!LPAGE || c.book === "kalshi" || c.stub || c.ghost) return "";
  const msg = KMSG.get(rk(c)) || "";
  if (!(c.ev > 0 || msg)) return "";
  const other = c.best === "kalshi" ? `Novig pays ${c.slip_x.toFixed(2)}x (${pct(c.nv_ev)})` :
    c.kalshi_x ? `Kalshi pays ${c.kalshi_x.toFixed(2)}x (${pct(c.kalshi_ev)})` : c.kalshi_why ? kwhy(c) : "";
  const btn = !(c.ev > 0) ? "" : c.best === "kalshi" ?
    `<button type="button" class="kbet" data-kbet="${esc(rk(c))}" title="Buys this combo on Kalshi now: the row's QK $ at Kalshi's price less what is already on this slip, or the stake typed in the opened row. Not placed if Kalshi's price is more than 1% worse than shown, the slip is no longer above fair, or the row is over 10 minutes old.">` +
      kbetText(c) + ` at ${c.kalshi_x.toFixed(2)}x on Kalshi</button>` :
    nvLink(c, `Open on Novig at ${c.slip_x.toFixed(2)}x`).replace('class="nv"', 'class="nv nbtn"');
  return `<div class="betform kbetrow" style="grid-column:1 / -1">${btn}<span class="kother">${esc(other)}</span><span class="kmsg">${esc(msg)}</span></div>`;
}
// The same, spelt out in the opened row.
const kalTech = c => {
  if (c.book === "kalshi" || !(c.kalshi_x || c.kalshi_why)) return null;
  const link = /^https:\/\/kalshi\.com\//.test(c.kalshi_url || "") ? ` · <a href="${esc(c.kalshi_url)}" target="_blank" rel="noopener" style="color:inherit">its game on Kalshi ↗</a>` : "";
  if (!c.kalshi_x) return `${esc(kwhy(c))}${link}`;
  const d = c.kalshi_x / c.slip_x - 1;
  return `Kalshi pays ${c.kalshi_x.toFixed(2)}x for the same slip (Yes at ${(c.kalshi_quote * 100).toFixed(1)}¢ before its fee; ${pct(c.kalshi_ev)} at this fair value): ` +
    (kalBetter(c) ? `<b style="color:var(--pos)">${(100 * d).toFixed(1)}% more than Novig</b>` : d < -0.0005 ? `${(-100 * d).toFixed(1)}% less than Novig` : "the same as Novig") + link;
};

// What auto-scan is doing, for the status line.
function autoLine() {
  const c = S.cycle;
  if (!c || !c.on) return "";
  const run = S.scanning ? LEAGUE : S.busy;
  return `Auto-scan is on, each board’s next day of games, the NFL and soccer through Sunday and CFB through Saturday (${c.boards.map(b => BOARD[b]).join(" → ")})` +
    (run ? "" : ` · resting (no board more often than every ten minutes) · next: ${BOARD[c.next]}${c.wait > 20000 ? ` in ${c.wait < 90000 ? "about a minute" : Math.round(c.wait / 60000) + " min"}` : " now"}`) + (c.wide !== WIDE ? ` · on ${c.wide ? "wide" : "tight"} books: ${c.wide ? "tick" : "untick"} Wide books to see its rows` : "");
}
const ago = ms => { const m = Math.round(ms / 60000); return m < 1 ? "just now" : m < 90 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };

function tip(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  return d.toLocaleDateString([], { weekday:"short" }) + " " + clock(ms);
}

// Expanded row: just what the row doesn't already say. Each leg's own fair
// odds, then one quiet line of the working numbers.
function detail(c) {
  if (c.stub) {   // a bet's row made from the bet alone (stubRow): its bets, each with its ×, and nothing to price
    return `<div class="det"><div class="tech">Saved before rows were kept with bets: this is the bet as you saved it. Its legs and today’s price come back when a pass prices the slip.</div><div class="betform">` +
      liveBets().filter(b => b.key === c.key).map(b => `<span class="mine">${usd(b.stake)}${b.x ? ` at ${b.x.toFixed(2)}x` : ""}<button type="button" class="x" data-del="${b.id}" title="Remove this bet">×</button></span>`).join("") + `</div></div>`;
  }
  const legs = c.legs.map(L =>
    `<span class="lg">${L.text ? esc(L.text) : `${LABEL[L.stat]} ${L.side === "over" ? "o" : "u"}${L.line}`} <b>${am(L.fair)}</b>${L.from != null ? ` <small>from ${L.src ? esc(L.src) : L.from}</small>` : ""}${L.books ? ` <small>· ${esc(L.books)}</small>` : ""}</span>`).join("");
  const sg = v => `${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(2)}`;
  const tech = [
    c.model ? `r ${sg(c.r)} · modelled from the main line${c.fix > 1 ? `, ×${c.fix.toFixed(2)} for fat tails` : ""}` :
    c.r === null ? `unrelated legs ${c.unrelated_x.toFixed(2)}x, hits ×${c.lift.toFixed(2)} as often` : c.rs ? `pair r’s ${c.rs.map(sg).join(" / ")}` : c.legs.length === 3 ? `lowest pair r ${sg(c.r)}` : `r ${sg(c.r)} · devig r ${sg(c.devig_r)}`,
    c.games != null ? (LEAGUE === "nbateam" ? (c.role ? `league-wide r for a player with that line${c.spread ? ` on a team ${c.spread < 0 ? "favoured by" : "getting"} ${Math.abs(c.spread)}` : " in an even game"} (${c.games.toLocaleString()} player-games)${c.fit_r ? `, fitted ${c.fit_r.toFixed(2)} less one standard error` : ""}` : `${c.games.toLocaleString()} games`) :
      c.games ? `${c.games} games${c.kind === "mate" ? " together" : ""}` : c.role ? "league-wide r for his position and ice time" : "position average r") : null,
    `books ${c.legs.map(L => L.width == null ? "none" : (100 * L.width).toFixed(1)).join(" / ")}¢`,
    c.book === "dk" ? `DraftKings’ parlay price; its two legs multiplied would pay ${c.legs_x.toFixed(2)}x` :
    c.book === "kalshi" ? `Kalshi’s best answer: Yes at ${(c.quote * 100).toFixed(1)}¢ a contract (${c.raw_x.toFixed(2)}x) before its fee` + (c.novig_x ? ` · Novig pays ${c.novig_x.toFixed(2)}x for the same slip (${c.novig_ev >= 0 ? "+" : ""}${(100 * c.novig_ev).toFixed(1)}%)` : ` · Novig has no price for this slip`) : `quote ${c.raw_x.toFixed(2)}x before fee`,
    c.qk > 0 ? `${c.qk.toFixed(2)}u` : null,
    c.forced ? "threes alone clear the points line" : null,
  ].filter(Boolean).join(" · ") + (kalTech(c) ? `<div>${kalTech(c)}</div>` : "");
  const mine = liveBets().filter(b => b.key === c.key);
  const form = `<div class="betform">` +
    mine.map(b => `<span class="mine">${usd(b.stake)}${b.x ? ` at ${b.x.toFixed(2)}x` : ""}<button type="button" class="x" data-del="${b.id}" title="Remove this bet">×</button></span>`).join("") +
    `<span>${mine.length ? "Add" : "I bet this"}: $</span><input type="number" class="stake" min="0" step="1" placeholder="stake" />` +
    `<span>at</span><input type="number" class="px" min="1" step="0.01" value="${(c.best === "kalshi" ? c.kalshi_x : c.slip_x).toFixed(2)}" /><span>x</span>` +
    `<button type="button" data-add="${esc(rk(c))}">Save</button></div>`;
  // Kalshi rows: one press buys the slip, the row's QK $ unless a stake is typed in the box above; the server refuses a price more than 1% worse.
  const kbet = "";   // the Bet button is on the row itself (kbetLine); a stake typed here is what it bets
  return `<div class="det"><div class="lgs">${legs}</div><div class="tech">${tech}</div>${form}${kbet}</div>`;
}

function render() {
  if (SWIPE && SWIPE.on) return;   // a row is being dragged: it is drawn again when the drag ends
  if (!S) return;
  betStrip();
  // Typing a stake: leave the rows alone until it is saved or left.
  const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest(".betform");
  const st = document.getElementById("status"), rowsEl = document.getElementById("rows");
  // A game that has started can't be bet pregame: its rows drop off the board
  // as it tips, and the next Fetch prices whatever is still to come (tomorrow's
  // slate once tonight's last game is under way).
  const nowMs = S.now + (Date.now() - GOT);
  const started = S.rows.filter(c => c.starts && c.starts <= nowMs).length;
  GHOSTS = [];
  for (const b of liveBets()) {
    if (pageOf(b.board) !== PAGE || !(GROUP() ? GROUP().boards.includes(b.board) : ALL() || b.board === LEAGUE)) continue;
    const k = ALL() ? b.board + "|" + b.key : b.key;
    if (S.rows.some(r => rk(r) === k) || GHOSTS.some(r => rk(r) === k)) continue;
    GHOSTS.push(adapt(Object.assign({}, b.row && b.row.legs ? b.row : stubRow(b), { ghost: true }, ALL() ? { board: b.board } : {})));
  }
  const open = S.rows.concat(GHOSTS).filter(c => !c.starts || c.starts > nowMs);
  const all = open.filter(c => !HIDDEN.has(c.key)).sort((a, b) => b.ev - a.ev);
  const gone = open.length - all.length, un = document.getElementById("unhide");
  un.style.display = gone ? "" : "none";
  un.textContent = `Unhide ${gone}`;
  const plays = all.filter(c => !c.ghost && c.ev * 100 >= MINEV);
  const q = document.getElementById("search").value.trim().toLowerCase();
  let rows = all;
  if (q) rows = rows.filter(c => c.player.toLowerCase().includes(q));
  const pair = document.getElementById("pair").value;
  if (pair) rows = rows.filter(c => pair.startsWith("k:") ? c.kind === pair.slice(2) : pair.startsWith("l:") ? c.line === pair.slice(2) : pair === "td" ? !!c.td : pair === "dd" ? !!c.dd : pair === "ladder" ? !!c.model && !c.dd && !c.td : pair === "n3" ? c.legs.length === 3 : pair === "n4" ? c.legs.length === 4 : pair === "3" ? c.legs.length === 3 : pair === "mix" ? c.legs.some(L => L.side === "under" && LABEL[L.stat])
    : !c.kind && c.legs.length === 2 && c.legs.every(L => L.side === "over") && c.legs.map(L => L.stat).join() === pair);
  // One card per player (or match). Its head is his main-line Points + Threes
  // row, the price everything else hangs off; his other rows fold under a
  // chip. A player with no such row, or any view filtered to one kind of
  // combo, is headed by his best row. Plays keeps a card when any of his rows
  // clears Min EV, and folds only the rows that do.
  const pass = c => c.ghost || (MODE !== "plays" && !ALL()) || c.ev * 100 >= MINEV;
  const byId = new Map();
  // NFL shows every row on its own (a player's props, stacks and game-line
  // slips are different bets, not versions of one).
  // All: a slip and the same slip at other lines (XAV Under 96.5 + CLEV Under
  // 62.5, then Under 97.5 + Under 62.5) are one card, headed by the best of them.
  const shape = c => [c.board, c.id, c.kind || "", ...c.legs.map(L => [L.stat, L.team || "", L.name || L.player || "", L.side || "", L.half ? 1 : 0].join(":"))].join("|");
  // Kalshi NBA (Max, 11-27: group one player, even if different lines; rank by recommended QK): every
  // slip of his on the four boards is one card, headed by the slip with the largest QK, cards largest QK first.
  // Ranked by what the slip is expected to make at its QK $ (Max, 11-27: QK or EV? whatever is best):
  // QK $ x EV. EV alone puts longshots with small stakes on top, QK alone large stakes at thin edges.
  const worth = c => Math.max(0, c.qk) * UNIT * Math.max(0, c.ev);
  const cardOf = c => KNBA() && !c.stub ? "p|" + c.id : ALL() ? shape(c) : LEAGUE === "nfl" || LEAGUE === "nbateam" || LEAGUE.startsWith("nhl") ? c.key : c.id;
  for (const c of rows) (byId.get(cardOf(c)) || byId.set(cardOf(c), []).get(cardOf(c))).push(c);
  const mainOf = g => g.find(c => c.main) ||
    g.filter(c => c.tier === 1).sort((a, b) => Math.abs(a.legs[1].p - 0.5) - Math.abs(b.legs[1].p - 0.5))[0];
  const cards = [];
  for (const g of byId.values()) {
    const shown = g.filter(pass);
    if (!shown.length) continue;
    // Plays: a Points + Threes row under Min EV does not head the card (it
    // would sort his Points + Rebounds play by a price that is not a play).
    // The Kalshi boards other than the two NBA props ones have no such row (every row is
    // tier 1), so the card is headed by its best row, not the one nearest 50%.
    const m = !ALL() && !pair && !(KALSHI(LEAGUE) && LEAGUE !== "kalshinba" && LEAGUE !== "kalshinba3") && mainOf(g);
    // A kept bet row (the board has no such row now) heads a card only when the card has no priced row.
    const byQk = (a, b) => !!a.ghost - !!b.ghost || worth(b) - worth(a) || b.ev - a.ev;
    // Every tab (Max, 11-27: rank all tabs like that). A Novig NBA card is still headed by his main-line row.
    shown.sort(byQk);
    const head = KNBA() ? shown[0] : (m && shown.includes(m) && m) || shown[0];
    cards.push({ head, others: shown.filter(c => c !== head), g });   // g: his rows under Min EV too, for alsoLine
  }
  // Kept bet rows go under the priced ones, below a line of their own (Max, 11-27: after a Fetch
  // his bets from 13 hours before sat among the new plays, ranked by their old EV).
  cards.sort((a, b) => !!a.head.ghost - !!b.head.ghost || worth(b.head) - worth(a.head) || b.head.ev - a.head.ev);
  if (!TOPRUN) TOP = cards.filter(c => !c.head.ghost).map(c => rk(c.head));

  // Status line.
  // "Nothing listed yet": the book has not opened the next games' props. Said plainly, not as a failed scan.
  const idle = !!S.error && S.error.startsWith("Nothing listed yet");
  st.classList.toggle("err", !!S.error && !S.scanning && !idle);
  const n = `<b>${plays.length}</b> at ${MINEV > 0 ? "+" : ""}${MINEV}% or better of ${ALL() ? S.boards.reduce((t, b) => t + b.priced, 0) : all.filter(c => !c.ghost).length} priced`;
  if (ALL()) {
    // Where each board's last pass stands, in the order they'd be worth a look.
    const at = b => b.scanning ? (b.total ? `scanning ${b.done} / ${b.total}` : "reading lines") :
      b.queued ? "next" :
      // the book has not opened the next games' props: nothing is broken, so not a red "failed" (Max, 11-27)
      b.error && b.error.startsWith("Nothing listed yet") ? `<span title="${esc(b.error)}">no props listed yet</span>` :
      b.error ? `<span style="color:var(--neg)" title="${esc(b.error)}">failed</span>` :
      Math.max(b.finished, b.stopped) ? ago(nowMs - Math.max(b.finished, b.stopped)) : "";
    st.classList.remove("err");
    st.innerHTML = `${n} on ${GROUP() ? `the ${GROUP().n} ${GROUP().sport} boards` : "all boards"}${S.out ? ` · ${S.out} hidden, player out` : ""}<div>` + S.boards.filter(b => at(b)).map(b => `${BOARD[b.league]} <b>${at(b)}</b>`).join(" · ") + `</div>` +
      (GROUP() && S.busy ? `<div>A ${BOARD[S.busy] || (KGROUPS[S.busy] ? `Kalshi ${KGROUPS[S.busy].sport}` : S.busy)} pass is running. Wait for it, or stop it and fetch these.</div>` : "") +
      (GROUP() && !S.scanning && !S.busy && !S.boards.some(b => at(b)) ? `<div>Press Fetch to price all ${GROUP().n} boards.</div>` : "");
  } else if (S.scanning) {
    st.innerHTML = S.total ? `Scanning ${S.done} / ${S.total} combos on ${S.players} players · ${n}` : "Reading Novig’s lines…";
  } else if (S.error) {
    st.textContent = idle ? S.error : `Scan failed: ${S.error}`;
  } else if (S.stopped) {

    (LEAGUE === "kalshinba" || LEAGUE === "kalshinba3" ? (LEAGUE === "kalshinba3" ? `Kalshi Pts + 3s: one player’s Points + Threes, asked as Kalshi combos, for every player with open Kalshi props tonight; his other pairs and the teammates slips are on Kalshi NBA Pairs. Every leg is a Yes on a milestone (25+ points is Over 24.5).` : `Kalshi NBA Pairs: the NBA slips asked as Kalshi combos, other than Points + Threes (its own board, Kalshi Pts + 3s). Per player with open Kalshi props tonight: his pairs where the correlation is 0.25 or better (points + rebounds, points + assists, rebounds + assists, rebounds + threes, assists + threes), and each team’s two highest points lines together (priced at r -0.05: measured unrelated across the league, with a margin because one pair can differ), every leg a Yes on a milestone (25+ points is Over 24.5).`) + ` Every leg has a fair value of 30% or better, teammates slips included: a slip with a longer leg is not asked or shown. The price is the best answer Kalshi’s makers gave to a $100 request, after Kalshi’s fee (7% × price × (1 − price) a contract). Fair value: each leg is priced off the tighter of two books on its line, Novig’s or Kalshi’s own bid and ask, or the average of the two where they are about as tight as each other (a row with a leg on a book wider than 4¢ is marked ~). A leg sits on the milestone just under or just over his main line on Novig. Where neither has a tight book but Novig’s main line does, the nearer milestone’s fair value is shifted from that main line (the Ladder’s model) and held inside Kalshi’s and Novig’s own bid and ask on the milestone: the row is marked *, and the opened row says which line it came from. Each pair is also asked on the milestone on the other side of his main line (25+ and 20+ points with 2+ and 3+ threes: up to four slips a pair), after every pair’s first slip. Fetch only, at most 400 slips a pass on Kalshi Pts + 3s, 300 on Kalshi NBA and 200 on the other Kalshi boards, about 15 min     (LEAGUE === "cbb" ? `CBB: Novig lists no college player props, so these are slips across one game’s own lines, up to six a game: the favourite’s spread with the Over; the underdog’s spread with the Under; the underdog’s spread with the underdog’s team total Under; the favourite’s team total Under with the game Under; both team totals Under; and the favourite’s first-half spread with his full-game spread. Each slip with a team total or first-half leg is asked again with one leg moved a line either way (Under 76 for Under 74), and a spread + total slip is when it prices within 8% of fair: Novig’s price does not follow the line the way the fair value does, so the line beside can be the better play. Novig’s own books on team totals and the first half are too wide to price from, so those legs take Pinnacle’s no-vig price on the same line (open a row to see it); the game’s spread and total are Novig’s own book. A game Pinnacle doesn’t list gets the first two slips only. The correlation for each kind of slip is measured on 17,319 games of the last three seasons against closing spreads and totals, by size of spread: an underdog covering with its own total Under is −0.60 (both hit in 14.4% of games), a team total Under with the game Under +0.83, both team totals Under +0.37 in a close game falling to +0.33 at a 20-point spread, +0.25 at 30 and +0.20 at 35 (the two scores move together less in a lopsided game), a first-half spread with the game’s spread +0.63, a spread with the total about zero (+0.12 at a 30-point spread). Team-total and first-half lines in that history are derived from the closing spread and total, not posted ones, so the Pinnacle leg is the softest input: check it before sizing a play. ` : "") +

assing Over, his own Over and a game line; or three props across him and his quarterback. The game line is the total, spread, moneyline or team total, or the first half’s total, spread or moneyline, on the side that goes with both props. Each player leads up to three three-leg slips: the ones that hit most often compared with unrelated legs, at most two of one shape and one of each kind of line. Fair value is a three-way joint from the three pair correlations (open a row to see them); the ones across two players or with a game line are league-wide for the role and each carries about ±0.05, so a three-leg fair value is rougher than a two-leg one, by roughly ±5%. ` : "") +
    (LEAGUE === "ladder" ? `NBA Ladder: higher lines only, for shooters whose Points and Threes move together (r 0.70 or better): his points lines above the main line (to main + 15) with threes at main to + 3, one-way lines included, where the slip’s fair value is between +500 and +800. The main-line slips are on the NBA tab and are not asked again here. Every row has a leg whose fair value is shifted from his main line with a count model, held under Novig’s own ask and under FanDuel’s one-way price on that line. Check a play against another book before sizing it. ` : "") +
    `` + (LADDER(LEAGUE) ? `<b>Two books:</b> each slip Novig prices is then asked of Kalshi as the same combo (a request for quote for $100, nothing bought), the best first, up to 150 a pass, where Kalshi lists every leg on the same line (its milestones are 5 points or 10 yards apart, so many ladder lines have no Kalshi market: the row shows KAL — and its line says which leg is missing). The price column shows both, NV and KAL, each after its own fee, the better one in green. The row stands at the better one: its EV (the book is named under it), QK and QK $, its place in the list, Plays and Min EV. A row above fair carries one button. Where Kalshi pays more: <b>Bet $… on Kalshi</b>, which buys the combo there for the row’s QK $ (or a stake typed in the opened row), refused if Kalshi’s price is more than 1% worse than shown, the slip is no longer above fair, or the row is over 10 minutes old (press ↻ first). Where Novig pays more, or Kalshi has no price: <b>Open on Novig</b>, which opens Novig with the legs on the slip; the bet is placed there. The fair value is the same for both books (the Novig scanner’s). Press ↻ to ask both again. This tab is behind the Kalshi passcode. The Kalshi asks count toward Kalshi’s 5,000 new combos a week. ` : "") + `` +
    (LEAGUE === "nflladder" ? `NFL Ladder: each player’s yards lines above his main line (receiving, rushing, passing; one-way lines included), with his anytime touchdown, receptions or passing touchdowns at its own main line, where the slip’s fair value is between +500 and +800. Rows marked * have a yards leg shifted from the main line (Novig’s when it has a tight one, else FanDuel’s) with a curve fitted to FanDuel’s own ladder, held under Novig’s ask and under FanDuel’s one-way price on that line. ` : "") +
    (LEAGUE === "nhl" ? `NHL: a skater’s goals with his shots on goal, each at its main line as “N+ · Yes” legs (1+ goal goes with 2+ shots, since a goal is a shot). Goals with assists and assists with shots are not asked: those legs are close to unrelated. Novig refuses any slip with a skater’s points and another of his stats, and lists no blocked shots. Then teammates: one skater’s points with a teammate’s points, or his goal with a teammate’s assist or points, in the same game, where their correlation is 0.20 or better, up to three slips led by one skater. It comes from the games the two both played for the same team (40 needed, else the average for their positions and ice time): about 0.15 for any two teammates, 0.3 to 0.4 for linemates. A skater’s shots with a teammate’s points is about zero (0.05 for linemates), so those slips are not asked. Points with game lines are on the NHL Lines tab. Skaters need 40 games of 10+ minutes. The correlation is fitted to the two legs’ hit-or-miss record at those exact lines and shrunk toward the skater’s position: goals with shots runs 0.3 to 0.6. Units are $200. Data: <a href="https://moneypuck.com" target="_blank" rel="noopener" style="color:inherit">MoneyPuck.com</a>, new games from ESPN box scores. ` : "") +
    (LEAGUE === "nhllines" ? `NHL Lines: a skater’s points at his main line with his team’s moneyline, the puck line (−1.5 or +1.5, whichever his team has), the game total and his team’s total, on the side that goes with his points, where the correlation is 0.25 or better. The correlation is league-wide for his position and ice time, not his own: a top forward’s point runs about 0.5 with his team’s total over, 0.38 with a win and 0.32 with the game over, measured on the raw result (won, won by two, over 5.5) across 1,600 games. Skaters need 40 games of 10+ minutes. Units are $200. Data: <a href="https://moneypuck.com" target="_blank" rel="noopener" style="color:inherit">MoneyPuck.com</a>, scores from ESPN. ` : "") +
    (LEAGUE === "nbateam" ? `NBA Team: slips with a game line in them. A player’s main-line Over (points, rebounds, assists, threes, or points + rebounds + assists) with his game’s spread on the side that goes with it, and his Under with the other side; players at 20+ minutes a game, each one’s three strongest pairings, where the correlation is 0.42 or better. The correlation is league-wide, not his own: for a player with that line on a team with tonight’s spread, from four seasons of box scores against closing lines, and the fair value uses it less one standard error (open a row for both numbers). It turns on who is favoured: a 20-to-25-point scorer’s Over goes with his team covering at +0.42 as an 8-point underdog, +0.19 in a pick’em and −0.08 as a 10-point favourite. A 25-point scorer on a favourite of 11 or more goes against his own team covering (about −0.26: starters sit the end of a blowout), so his Over is asked with the other team covering, and his Under with his own; that is not asked under 11 points, where the history shows nothing. Novig’s price for these barely moves with who is favoured, which is where the plays are: on 11-13, the underdog slips were above fair on 33 of 42 quotes (median +2.0%) and the big-favourite ones on 5 of 6 (median +5.3%). Tested on seasons the numbers were not fitted to, slips hit as often as the fit said, within 1% (the strongest group 3% less often, which the standard error covers). Then six slips across each game’s own lines (team totals with each other and with the game total, the underdog’s moneyline with the Under, the favourite’s first-half moneyline with his moneyline) at each one’s measured correlation on 4,115 games: Novig prices those right before its fee, so they sit about 5% under fair unless a quote is off. A team total priced off Pinnacle says so in the open row. Fair value: each leg is Novig’s own exchange book at that line, devigged worst case, joined at that correlation${S.data ? ` (data ${S.data})` : ""}. ` :     (SOC() || LEAGUE === "cfb" || LEAGUE === "cbb" || LEAGUE === "kalshicfb" || LEAGUE === "nbateam" ? `` : `Fair value: each leg is Novig’s own exchange book at that line, devigged worst case, joined with the player’s shrunk correlation${LEAGUE === "nfl" ? " (for a slip across two players or with a game line: the league-wide correlation for his role, position and targets or carries a game, from ten seasons of nflverse games against closing lines)" : ""}` +

async function poll() {
  if (!shown()) return;
  if ((KPAGE || LPAGE) && KEY && !KKEY) return kalshiNote();
  if (!KEY) {   // keep a "Wrong passcode" message up until the next try
    if (document.getElementById("lock").style.display === "none") lock("Private. Enter the passcode.");
    return;
  }
  try {
    const stop = STOP; STOP = false;
    const tab = LEAGUE;
    const r = await fetch(ALL() ? `/api/nba/novig-scan?league=${LEAGUE}&min=${MINEV}${WIDE ? "&wide=1" : ""}${GROUP() && stop ? "&stop=1" : ""}${GROUP() && NOW ? "&now=1" : ""}` : `/api/nba/novig-scan?league=${LEAGUE}${WIDE ? "&wide=1" : ""}${stop ? "&stop=1" : ""}${NOW ? "&now=1" + (document.getElementById("game").value ? "&events=" + document.getElementById("game").value : "") : ""}`, { cache: "no-store", headers: { "X-Scan-Key": KEY, "X-Kalshi-Key": KKEY } });
    if (r.status === 423 || r.status === 429) {
      const j = await r.json().catch(() => ({}));
      if (r.status === 429 && j.kind !== "kalshi") {
        KEY = "";
        try { localStorage.removeItem(KEYLS); } catch (_) {}
        return lock("Too many wrong passcodes from this connection. Try again in 15 minutes.");
      }
      if (r.status === 423 && !j.off) { kalshiLock(); return; }
      // No prompt: the passcode isn't the problem (or can't be tried yet). It is forgotten on this device either way.
      KKEY = "";
      try { localStorage.removeItem(KKEYLS); } catch (_) {}
      KWHY = j.off ? "The Kalshi boards are switched off on the server: KALSHI_TAB_KEY is not set there (8 characters or more)." : "Too many wrong Kalshi passcodes from this connection. Try again in 15 minutes, then click the title three times.";
      return kalshiNote();
    }
    if (r.status === 403) {
      KEY = "";
      try { localStorage.removeItem(KEYLS); } catch (_) {}
      return lock("Wrong passcode.");
    }
    if (r.status === 503) return lock("The scanner is switched off on the server (no NOVIG_SCAN_KEY set).");
    if (!r.ok) throw new Error(`server answered ${r.status}`);
    document.getElementById("lock").style.display = "none";
    document.querySelector(".board").style.display = "";
    document.querySelector(".controls").style.display = "";
    const j = await r.json();
    if (tab !== LEAGUE) return;   // the tab changed while this was on its way
    S = j;
    if (S.rows) S.rows.forEach(adapt);
    GOT = Date.now();
    if (Date.now() - BETS_AT > 30000) { BETS_AT = Date.now(); bets(); } else keepRows();
    if (S.scanning) NOW = false;
    // While a pass runs the button stops it: this board's own, or another
    // board's to fetch this one in its place.
    document.getElementById("now").textContent = S.scanning ? "Stop" : S.busy ? `Stop ${BOARD[S.busy] || (KGROUPS[S.busy] ? `Kalshi ${KGROUPS[S.busy].sport}` : S.busy)} and fetch` : "Fetch";
    render();
  } catch (e) {
    const st = document.getElementById("status");
    st.classList.add("err");
    st.textContent = `Couldn’t reach the scanner (${e.message}).`;
  }
}

bookHead();

// Swipe a row right to hide it. The drag starts on the row itself, not on
// its buttons, links, bet form or opened details.
{
  const rowsEl = document.getElementById("rows");
  rowsEl.addEventListener("pointerdown", e => {
    const el = e.target.closest(".row");
    if (!el || e.target.closest("button, a, input, .det, .betform") || (e.pointerType === "mouse" && e.button !== 0)) return;
    SWIPE = { el, x: e.clientX, y: e.clientY, dx: 0, on: false, id: e.pointerId };
  });
  rowsEl.addEventListener("pointermove", e => {
    if (!SWIPE || e.pointerId !== SWIPE.id) return;
    const dx = e.clientX - SWIPE.x, dy = e.clientY - SWIPE.y;
    if (!SWIPE.on) {
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { SWIPE = null; return; }   // a scroll
      if (dx < 14 || Math.abs(dy) > dx) return;
      SWIPE.on = true;
      SWIPE.el.classList.add("drag");
      try { SWIPE.el.setPointerCapture(e.pointerId); } catch (_) {}
    }
    SWIPE.dx = Math.max(0, dx);
    SWIPE.el.style.transform = `translateX(${SWIPE.dx}px)`;
    SWIPE.el.style.opacity = String(Math.max(0.25, 1 - SWIPE.dx / 260));
  });
  const end = e => {
    if (!SWIPE || e.pointerId !== SWIPE.id) return;
    const w = SWIPE;
    SWIPE = null;
    if (!w.on) return;
    SWIPED = Date.now();
    w.el.classList.remove("drag"); w.el.style.transform = ""; w.el.style.opacity = "";
    const c = e.type === "pointerup" && w.dx > Math.min(110, w.el.offsetWidth * 0.3) && S.rows.find(r => rk(r) === w.el.dataset.k);
    if (c) { HIDDEN.set(c.key, c.starts || Date.now() + 86400000); saveHidden(); }
    render();
  };
  rowsEl.addEventListener("pointerup", end);
  rowsEl.addEventListener("pointercancel", end);
}
document.getElementById("unhide").onclick = () => { HIDDEN.clear(); saveHidden(); render(); };
document.getElementById("hidebets").onclick = () => {
  HIDEBETS = !HIDEBETS;
  try { localStorage.setItem("nbaScanHideBets", HIDEBETS ? "1" : "0"); } catch (_) {}

};
document.getElementById("lock").onsubmit = e => {
  e.preventDefault();
  KEY = document.getElementById("pass").value.trim();
  document.getElementById("pass").value = "";
  try { localStorage.setItem(KEYLS, KEY); } catch (_) {}

};
const minev = document.getElementById("minev");
minev.value = MINEV;
minev.oninput = () => { const v = parseFloat(minev.value); MINEV = Number.isFinite(v) ? v : 0; save(); render(); if (ALL()) poll(); };
const wide = document.getElementById("wide");
wide.checked = WIDE;
wide.onchange = () => { WIDE = wide.checked; save(); OPEN.clear(); poll(); };

poll();
setInterval(poll, 4000);
document.addEventListener("visibilitychange", poll);
