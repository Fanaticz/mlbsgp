<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Novig SGP Scanner</title>
<style>
  :root {
    --bg:#0f1419; --panel:#1a2129; --line:#2a333d; --txt:#e6edf3;
    --muted:#8b98a5; --accent:#f5a623; --pos:#3fb950; --neg:#f85149;
  }
  * { box-sizing:border-box; }
  /* iOS enlarges text it thinks is body copy, which made rows change size. */
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--txt);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:14px 22px 10px; display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 14px; }
  h1 { margin:0; font-size:18px; }
  .sub { color:var(--muted); font-size:12.5px; }
  .sub.err { color:var(--neg); }
  .sub b { color:var(--txt); font-weight:600; }
  a { color:var(--accent); text-decoration:none; }
  .controls { display:flex; flex-wrap:wrap; gap:10px 12px; align-items:center; padding:10px 22px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line); position:sticky; top:0;
    background:var(--bg); z-index:5; }
  .toggle { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .toggle button { background:transparent; color:var(--muted); border:0; padding:7px 13px; font-size:13px; cursor:pointer; }
  .toggle button.on { background:var(--accent); color:#1a1a1a; font-weight:600; }
  input[type=search], input[type=number] { background:var(--panel); border:1px solid var(--line);
    color:var(--txt); border-radius:8px; padding:7px 10px; font-size:13px; }
  input[type=search] { width:170px; }
  input[type=number] { width:62px; margin-left:4px; }
  label.muted { color:var(--muted); font-size:13px; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
  .muted { color:var(--muted); }
  .back { margin-left:auto; font-size:13px; white-space:nowrap; }
  .bar { height:2px; background:var(--line); }
  .bar i { display:block; height:2px; width:0; background:var(--accent); transition:width .4s; }

  .board { padding:0 12px 24px; }
  .row, .head { display:grid; align-items:center; gap:0 12px; padding:9px 10px;
    grid-template-columns:minmax(190px,1.5fr) minmax(170px,1.3fr) repeat(5, minmax(62px,.55fr)) 46px; }
  .head { position:sticky; top:53px; background:var(--panel); color:var(--muted); font-weight:600; font-size:11px;
    text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line); z-index:4; }
  .head .num, .row .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .row { border-bottom:1px solid var(--line); cursor:pointer; }
  .row:hover { background:#161d25; }
  .row.old { opacity:.55; }
  .who b { font-weight:600; }
  /* Name, then team and tip (which give way first), then the chip, always whole. */
  .who { display:flex; align-items:baseline; min-width:0; }
  .who b { flex:none; }
  .who small { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .more { flex:none; margin-left:8px; background:none; border:1px solid var(--line); color:var(--muted); border-radius:999px;
    padding:1px 9px; font-size:11.5px; cursor:pointer; white-space:nowrap; }
  .row.sub { background:#12181f; }
  .row.sub .legs { padding-left:14px; }
  .who small, .legs small { color:var(--muted); font-size:11.5px; margin-left:6px; white-space:nowrap; }
  .legs { overflow:hidden; text-overflow:ellipsis; }
  .rough { color:var(--accent); cursor:help; margin-left:4px; }
  .fair { color:var(--accent); font-weight:600; }
  .ev { font-weight:700; }
  .ev.pos { color:var(--pos); }
  .ev.neg { color:var(--neg); font-weight:500; }
  .lab { display:none; }
  .det { grid-column:1 / -1; padding:8px 0 2px; cursor:default; }
  .lgs { display:flex; flex-wrap:wrap; gap:6px; }
  .lg { border:1px solid var(--line); border-radius:7px; padding:3px 9px; font-size:13px; color:var(--muted); white-space:nowrap; }
  .lg b { color:var(--txt); font-weight:600; margin-left:4px; }
  .lg small { font-size:11px; }
  .tech { color:var(--muted); font-size:11.5px; margin-top:7px; }
  .empty { padding:28px 14px; color:var(--muted); text-align:center; line-height:1.7; }
  .foot { padding:4px 22px 60px; color:var(--muted); font-size:12px; line-height:1.7; max-width:900px; }

  @media (max-width:760px) {
    header { padding:12px 14px 8px; }
    .controls { padding:8px 14px; gap:8px 10px; }
    .toggle { flex:1 1 40%; }
    .toggle button { flex:1; padding:9px 8px; }
    input[type=search] { flex:1 1 40%; width:auto; min-width:0; }
    input[type=search], input[type=number] { font-size:16px; }
    .board { padding:0 6px 24px; }
    .head { display:none; }
    .row { grid-template-columns:repeat(4, minmax(0,1fr)); gap:5px 8px; padding:11px 8px; }
    .who { grid-column:1 / span 3; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ev { grid-column:4; grid-row:1; font-size:17px; }
    .legs { grid-column:1 / -1; font-size:15px; }
    .row.sub { padding-left:20px; }
    .row.sub .who { display:none; }
    .row.sub .legs { grid-column:1 / span 3; grid-row:1; padding-left:0; }
    .row .num:not(.ev) { font-size:14px; }
    .foot { font-size:11.5px; }
    .row .num:not(.ev) { text-align:left; }
    .lab { display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; font-weight:400; }
    .rr { display:none; }
    .foot { padding:4px 14px 60px; }
  }
</style>
</head>
<body>
<header>
  <h1>Novig SGP scanner</h1>
  <div class="sub" id="status">Starting…</div>
</header>
<div class="controls">
  <div class="toggle" id="league">
    <button data-league="nba" class="on">NBA</button>
    <button data-league="nfl">NFL</button>
    <button data-league="soccer">Soccer</button>
  </div>
  <div class="toggle" id="mode">
    <button data-mode="plays" class="on">Plays</button>
    <button data-mode="all">All combos</button>
  </div>
  <input type="search" id="search" placeholder="Filter by name…" />
  <select id="pair" title="Show one kind of combo" style="background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px">
  </select>
  <label class="muted" title="Plays shows combos at this EV or better.">Min EV %
    <input type="number" id="minev" value="0" step="1" /></label>
  <label class="muted" title="Also price legs on Novig books up to 8¢ wide (10¢ for the second threes milestone). Their fair values are rough: marked ~.">
    <input type="checkbox" id="wide" /> Wide books</label>
  <button type="button" id="now" title="Run one pass. Nothing is asked of Novig until you press this: each pass sends every combo to its pricers as a live auction." style="background:var(--accent);border:0;color:#1a1a1a;font-weight:600;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;white-space:nowrap">Fetch</button>
  <a class="back" href="nba.html">Correlations →</a>
</div>
<div class="bar"><i id="bar"></i></div>
<form class="empty" id="lock" style="display:none">
  <div id="lockmsg">Private. Enter the passcode.</div>
  <input type="password" id="pass" autocomplete="current-password" style="margin-top:10px;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 12px;font-size:16px;width:220px" />
  <button type="submit" style="margin-left:6px;background:var(--accent);border:0;border-radius:8px;padding:10px 16px;font-weight:600;font-size:14px">Open</button>
</form>
<div class="board">
  <div class="head">
    <div>Player</div><div>Legs</div><div class="num">Fair</div><div class="num">Novig</div>
    <div class="num">EV</div><div class="num">QK</div><div class="num">r</div><div class="num">Age</div>
  </div>
  <div id="rows"></div>
</div>
<div class="foot" id="foot"></div>

<script>
// The board comes from the server: /api/nba/novig-scan runs
// .claude/skills/nba-sgp-fv/scan.py (one pass at a time) and returns what it
// has priced so far. Polling is what keeps it scanning, so this page only
// polls while it is actually on screen.
let S = null;              // last response
let NOW = false;           // Fetch was pressed: ask for a pass on the next poll
let GOT = 0;               // when it arrived (ms, this clock)
let MODE = "plays", WIDE = false, MINEV = 0, LEAGUE = "nba";
const PAIR_OPTS = {
  nba: [],   // one slip a player now: main-line Points + Threes
  nfl: [["rec,yds", "REC + YDS"], ["rec,td", "REC + TD"], ["yds,td", "YDS + TD"],
        ["pyds,ptd", "QB: PASS YDS + PASS TD"], ["cmp,pyds", "QB: CMP + PASS YDS"], ["att,cmp", "QB: ATT + CMP"],
        ["att,pyds", "QB: ATT + PASS YDS"], ["cmp,ptd", "QB: CMP + PASS TD"],
        ["ryds,td", "RUSH YDS + TD"], ["rry,td", "RUSH+REC YDS + TD"], ["car,td", "CAR + TD"],
        ["k:stack", "QB + his receiver"], ["k:over", "Prop + game total"], ["k:cover", "Prop + spread"], ["k:tt", "Prop + team total"]],
  soccer: [["n3", "Win + corners"], ["n4", "With a goals leg"]],
};
function pairOpts() {
  document.getElementById("pair").style.display = PAIR_OPTS[LEAGUE].length ? "" : "none";
  document.getElementById("pair").innerHTML = `<option value="">All pairs</option>` +
    PAIR_OPTS[LEAGUE].map(([v, t]) => `<option value="${v}">${t}</option>`).join("");
}
const OPEN = new Set();    // expanded rows, by key
const GOPEN = new Set();   // players whose other rows are unfolded
// The passcode (the server's NOVIG_SCAN_KEY), kept on this device once entered.
const KEYLS = "nbaScanKey";
let KEY = "";
try { KEY = localStorage.getItem(KEYLS) || ""; } catch (_) {}
function lock(msg) {
  S = null;
  document.getElementById("lock").style.display = "";
  document.getElementById("lockmsg").textContent = msg;
  document.querySelector(".board").style.display = "none";
  document.querySelector(".controls").style.display = "none";
  document.getElementById("status").textContent = "";
}
const LS = "nbaNovigScan";
try {
  const v = JSON.parse(localStorage.getItem(LS) || "{}");
  if (v.mode === "all") MODE = "all";
  if (PAIR_OPTS[v.league]) LEAGUE = v.league;
  WIDE = !!v.wide;
  if (Number.isFinite(v.minev)) MINEV = v.minev;
} catch (_) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify({ mode: MODE, wide: WIDE, minev: MINEV, league: LEAGUE })); } catch (_) {} };

const am = v => (v > 0 ? "+" : "−") + Math.abs(v);
const pct = v => `${v >= 0 ? "+" : "−"}${Math.abs(100 * v).toFixed(1)}%`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const clock = ms => new Date(ms).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
const LABEL = { pts:"PTS", reb:"REB", ast:"AST", tpm:"3PM", rec:"REC", yds:"YDS", td:"TD",
                att:"PASS ATT", cmp:"CMP", pyds:"PASS YDS", ptd:"PASS TD",
                car:"CAR", ryds:"RUSH YDS", rry:"RUSH+REC YDS" };
const SOC = () => LEAGUE === "soccer";
const BOARD = { nba:"NBA", nfl:"NFL", soccer:"soccer" };

// Shown on screen: the tab is visible and, inside the site's tab frame, that
// frame is the one displayed.
function shown() {
  if (document.visibilityState !== "visible") return false;
  try { return !window.frameElement || window.frameElement.offsetParent !== null; } catch (_) { return true; }
}

function age(row) {
  // The server's clock stamps both `now` and each row, so the phone's clock doesn't matter.
  const s = Math.max(0, (S.now + (Date.now() - GOT)) / 1000 - row.at);
  return s < 90 ? `${Math.round(s)}s` : s < 5400 ? `${Math.round(s / 60)}m` : s < 172800 ? `${Math.round(s / 3600)}h` : `${Math.round(s / 86400)}d`;
}
// While a pass runs, rows it hasn't re-priced yet are from the pass before: dimmed.
const isOld = row => S.scanning && row.at * 1000 < S.started;
const ago = ms => { const m = Math.round(ms / 60000); return m < 1 ? "just now" : m < 90 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };

function tip(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  return d.toLocaleDateString([], { weekday:"short" }) + " " + clock(ms);
}

// Expanded row: just what the row doesn't already say. Each leg's own fair
// odds, then one quiet line of the working numbers.
function detail(c) {
  const legs = c.legs.map(L =>
    `<span class="lg">${L.text ? esc(L.text) : `${LABEL[L.stat]} ${L.side === "over" ? "o" : "u"}${L.line}`} <b>${am(L.fair)}</b>${L.from != null ? ` <small>from ${L.from}</small>` : ""}</span>`).join("");
  const sg = v => `${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(2)}`;
  const tech = [
    c.model ? `r ${sg(c.r)} · modelled from the main line${c.fix > 1 ? `, ×${c.fix.toFixed(2)} for fat tails` : ""}` :
    c.r === null ? `unrelated legs ${c.unrelated_x.toFixed(2)}x, hits ×${c.lift.toFixed(2)} as often` : c.legs.length === 3 ? `lowest pair r ${sg(c.r)}` : `r ${sg(c.r)} · devig r ${sg(c.devig_r)}`,
    `books ${c.legs.map(L => (100 * L.width).toFixed(1)).join(" / ")}¢`,
    `quote ${c.raw_x.toFixed(2)}x before fee`,
    c.qk > 0 ? `${c.qk.toFixed(2)}u` : null,
    c.forced ? "threes alone clear the points line" : null,
  ].filter(Boolean).join(" · ");
  return `<div class="det"><div class="lgs">${legs}</div><div class="tech">${tech}</div></div>`;
}

function render() {
  if (!S) return;
  const st = document.getElementById("status"), rowsEl = document.getElementById("rows");
  // A game that has started can't be bet pregame: its rows drop off the board
  // as it tips, and the next Fetch prices whatever is still to come (tomorrow's
  // slate once tonight's last game is under way).
  const nowMs = S.now + (Date.now() - GOT);
  const started = S.rows.filter(c => c.starts && c.starts <= nowMs).length;
  const all = S.rows.filter(c => !c.starts || c.starts > nowMs).sort((a, b) => b.ev - a.ev);
  const plays = all.filter(c => c.ev * 100 >= MINEV);
  const q = document.getElementById("search").value.trim().toLowerCase();
  let rows = all;
  if (q) rows = rows.filter(c => c.player.toLowerCase().includes(q));
  const pair = document.getElementById("pair").value;
  if (pair) rows = rows.filter(c => pair.startsWith("k:") ? c.kind === pair.slice(2) : pair === "td" ? !!c.td : pair === "dd" ? !!c.dd : pair === "ladder" ? !!c.model && !c.dd && !c.td : pair === "n3" ? c.legs.length === 3 : pair === "n4" ? c.legs.length === 4 : pair === "3" ? c.legs.length === 3 : pair === "mix" ? c.legs.some(L => L.side === "under")
    : !c.kind && c.legs.length === 2 && c.legs.every(L => L.side === "over") && c.legs.map(L => L.stat).join() === pair);
  // One card per player (or match). Its head is his main-line Points + Threes
  // row, the price everything else hangs off; his other rows fold under a
  // chip. A player with no such row, or any view filtered to one kind of
  // combo, is headed by his best row. Plays keeps a card when any of his rows
  // clears Min EV, and folds only the rows that do.
  const pass = c => MODE !== "plays" || c.ev * 100 >= MINEV;
  const byId = new Map();
  // NFL shows every row on its own (a player's props, stacks and game-line
  // slips are different bets, not versions of one).
  const cardOf = c => LEAGUE === "nfl" ? c.key : c.id;
  for (const c of rows) (byId.get(cardOf(c)) || byId.set(cardOf(c), []).get(cardOf(c))).push(c);
  const mainOf = g => g.find(c => c.main) ||
    g.filter(c => c.tier === 1).sort((a, b) => Math.abs(a.legs[1].p - 0.5) - Math.abs(b.legs[1].p - 0.5))[0];
  const cards = [];
  for (const g of byId.values()) {
    const shown = g.filter(pass);
    if (!shown.length) continue;
    const head = (!pair && mainOf(g)) || shown[0];
    cards.push({ head, others: shown.filter(c => c !== head) });
  }
  cards.sort((a, b) => b.head.ev - a.head.ev);

  // Status line.
  st.classList.toggle("err", !!S.error && !S.scanning);
  const n = `<b>${plays.length}</b> at ${MINEV > 0 ? "+" : ""}${MINEV}% or better of ${all.length} priced`;
  if (S.scanning) {
    st.innerHTML = S.total ? `Scanning ${S.done} / ${S.total} combos on ${S.players} players · ${n}` : "Reading Novig’s lines…";
  } else if (S.error) {
    st.textContent = `Scan failed: ${S.error}`;
  } else if (S.finished) {
    const since = S.now + (Date.now() - GOT) - S.finished;
    st.innerHTML = `Saved from ${clock(Date.now() - since)} (${ago(since)}) · ${S.total} combos · ${n}` +
      (started ? ` · ${started} hidden, game started` : "") +
      (S.busy ? ` · a ${BOARD[S.busy] || S.busy} pass is running` : since > 20 * 60000 ? " · prices are old: Fetch before betting" : "");
  } else {
    st.textContent = S.busy ? `A ${BOARD[S.busy] || S.busy} pass is running. Press Fetch when it finishes.` : "Press Fetch to scan.";
  }
  document.getElementById("bar").style.width = S.scanning && S.total ? `${Math.round(100 * S.done / S.total)}%` : "0";

  if (!cards.length) {
    const best = all[0];
    rowsEl.innerHTML = `<div class="empty">${
      q ? "No combo for that name." :
      !all.length ? (S.scanning ? "Pricing the slate. Rows appear as Novig answers (about one a second)." :
        !S.finished ? "Nothing fetched yet. Press <b>Fetch</b> to price the slate." :
        started ? "Every game on this board has started. Press <b>Fetch</b> to price the next slate." :
        SOC() ? "No open match has two-sided books on both teams’ corners right now. They usually appear a day or two before kickoff." :
        `Nothing to price right now: no player has two Novig books tight enough.${S.wide ? "" : ` They tighten ${LEAGUE.startsWith("nfl") ? "toward the weekend" : "through the day"}; tick <b>Wide books</b> for rough numbers.`}`) :
      `No combo at ${MINEV > 0 ? "+" : ""}${MINEV}% or better right now. Best of ${all.length}: ${esc(best.player)}, ${esc(best.label)} at ${pct(best.ev)}. <b>All combos</b> shows the rest.`
    }</div>`;
  } else {
    const one = (c, sub, others) =>
      `<div class="row${sub ? " sub" : ""}${isOld(c) ? " old" : ""}" data-k="${c.key}">` +
      `<div class="who">${sub ? "" : `<b>${esc(c.player)}</b><small>${esc(c.team)}${c.starts ? " · " + tip(c.starts) : ""}</small>` +
        (others && others.length ? `<button type="button" class="more" data-g="${esc(c.id)}">${GOPEN.has(c.id) ? "hide" :
          `+${others.length} more${others[0].ev > c.ev ? `, to ${pct(others[0].ev)}` : ""}`}</button>` : "")}</div>` +
      `<div class="legs">${esc(c.label)}${c.model ? `<span class="rough" title="A higher line: fair value is modelled from the main line, not read off a book.">*</span>` : ""}${c.rough ? `<span class="rough" title="A leg sits on a Novig book wider than 4¢: rough fair value. Check sharp odds.">~</span>` : ""}</div>` +
      `<div class="num fair"><span class="lab">Fair</span>${am(c.fair)}</div>` +
      `<div class="num"><span class="lab">Novig</span>${c.slip_x.toFixed(2)}x</div>` +
      `<div class="num ev ${c.ev >= 0 ? "pos" : "neg"}">${pct(c.ev)}</div>` +
      `<div class="num qk"><span class="lab">QK</span>${c.qk > 0 ? c.qk.toFixed(2) + "u" : "—"}</div>` +
      `<div class="num rr">${c.r === null ? "" : (c.r >= 0 ? "+" : "−") + Math.abs(c.r).toFixed(2)}</div>` +
      `<div class="num"><span class="lab">Age</span>${age(c)}</div>` +
      (OPEN.has(c.key) ? detail(c) : "") + `</div>`;
    rowsEl.innerHTML = cards.map(({ head, others }) =>
      one(head, false, others) + (GOPEN.has(head.id) ? others.map(c => one(c, true)).join("") : "")).join("");
    rowsEl.querySelectorAll(".more").forEach(b => b.onclick = e => {
      e.stopPropagation();
      const g = b.dataset.g;
      GOPEN.has(g) ? GOPEN.delete(g) : GOPEN.add(g);
      render();
    });
    rowsEl.querySelectorAll(".row").forEach(el => el.onclick = e => {
      if (e.target.closest(".det")) return;   // let text in the details be selected
      const k = el.dataset.k;
      OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k);
      render();
    });
  }
  document.getElementById("foot").innerHTML =
    (SOC() ? `Soccer: favourite to win + favourite’s corners Under + underdog’s corners Over, with and without a goals Over. Fair value is the legs’ unrelated price adjusted for how much more often the whole slip hits (×1.25 to ×1.61, from 17,934 top-five-league matches). Those are league averages and corner books are often wide, so treat rows as leads. ` : "") +
    (LEAGUE === "nfl" ? `NFL: receptions, receiving yards and anytime touchdown for WRs, TEs and RBs; rushing yards, rushing + receiving yards and carries with anytime touchdown for RBs; pass attempts, completions, passing yards and passing touchdowns for QBs. Then a quarterback’s passing Over with one of his own receivers’ Over, and a player’s prop Over with the game total, his team’s spread or his team’s total on the side that goes with it (a back’s carries with his team covering; a quarterback’s pass attempts with the other team covering), up to three of each per player. Two legs only. ` : "") +
    (LEAGUE === "nba" ? `NBA: one slip a player, his main-line Points + Threes. Nothing else is asked, to keep the number of requests Novig’s pricers see down. ` : "") +
    `Fair value: each leg is Novig’s own exchange book at that line, devigged worst case, joined with the player’s shrunk correlation${LEAGUE === "nfl" ? " (for a slip across two players or with a game line: the league-wide correlation for his role, position and targets or carries a game, from ten seasons of nflverse games against closing lines)" : ""}` +
    `${S.data ? ` (data ${S.data})` : ""}. Novig: the multiplier on its slip, its public quote after the 10% parlay fee. ` +
    `Quotes move by a few percent between asks and last about 30 seconds, so a row is a lead to re-check on the slip, and against sharp odds, before betting. ` +
    `Nothing is asked of Novig until you press Fetch; the last pass for each league stays here until then.`;
}

async function poll() {
  if (!shown()) return;
  if (!KEY) {   // keep a "Wrong passcode" message up until the next try
    if (document.getElementById("lock").style.display === "none") lock("Private. Enter the passcode.");
    return;
  }
  try {
    const r = await fetch(`/api/nba/novig-scan?league=${LEAGUE}${WIDE ? "&wide=1" : ""}${NOW ? "&now=1" : ""}`, { cache: "no-store", headers: { "X-Scan-Key": KEY } });
    if (r.status === 403) {
      KEY = "";
      try { localStorage.removeItem(KEYLS); } catch (_) {}
      return lock("Wrong passcode.");
    }
    if (r.status === 503) return lock("The scanner is switched off on the server (no NOVIG_SCAN_KEY set).");
    if (!r.ok) throw new Error(`server answered ${r.status}`);
    document.getElementById("lock").style.display = "none";
    document.querySelector(".board").style.display = "";
    document.querySelector(".controls").style.display = "";
    S = await r.json();
    GOT = Date.now();
    if (S.scanning) NOW = false;
    document.getElementById("now").disabled = S.scanning || !!S.busy;
    render();
  } catch (e) {
    const st = document.getElementById("status");
    st.classList.add("err");
    st.textContent = `Couldn’t reach the scanner (${e.message}).`;
  }
}

document.querySelectorAll("#mode button").forEach(b => {
  b.classList.toggle("on", b.dataset.mode === MODE);
  b.onclick = () => {
    MODE = b.dataset.mode; save();
    document.querySelectorAll("#mode button").forEach(o => o.classList.toggle("on", o === b));
    render();
  };
});
document.getElementById("search").oninput = render;
document.getElementById("now").onclick = () => { NOW = true; poll(); };
pairOpts();
document.querySelectorAll("#league button").forEach(b => {
  b.classList.toggle("on", b.dataset.league === LEAGUE);
  b.onclick = () => {
    LEAGUE = b.dataset.league; save(); OPEN.clear(); pairOpts();
    document.querySelectorAll("#league button").forEach(o => o.classList.toggle("on", o === b));
    document.getElementById("rows").innerHTML = "";
    poll();
  };
});
document.getElementById("pair").onchange = render;
document.getElementById("lock").onsubmit = e => {
  e.preventDefault();
  KEY = document.getElementById("pass").value.trim();
  document.getElementById("pass").value = "";
  try { localStorage.setItem(KEYLS, KEY); } catch (_) {}
  document.getElementById("lockmsg").textContent = "Checking…";
  poll();
};
const minev = document.getElementById("minev");
minev.value = MINEV;
minev.oninput = () => { const v = parseFloat(minev.value); MINEV = Number.isFinite(v) ? v : 0; save(); render(); };
const wide = document.getElementById("wide");
wide.checked = WIDE;
wide.onchange = () => { WIDE = wide.checked; save(); OPEN.clear(); poll(); };

poll();
setInterval(poll, 4000);
document.addEventListener("visibilitychange", poll);
</script>
</body>
</html>
