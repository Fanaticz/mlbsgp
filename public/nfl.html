<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>NFL Receiving Correlations</title>
<style>
  :root {
    --bg:#0f1419; --panel:#1a2129; --line:#2a333d; --txt:#e6edf3;
    --muted:#8b98a5; --accent:#f5a623; --pos:#3fb950; --neg:#f85149;
    --prev:#6f9fd0; --old:#4e5965;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:18px 22px 10px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:19px; }
  .sub { color:var(--muted); font-size:12.5px; }
  .controls { display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    padding:12px 22px; border-bottom:1px solid var(--line); position:sticky;
    top:0; background:var(--bg); z-index:5; }
  .toggle { display:inline-flex; border:1px solid var(--line); border-radius:8px;
    overflow:hidden; }
  .toggle button { background:transparent; color:var(--muted); border:0;
    padding:7px 14px; font-size:13px; cursor:pointer; }
  .toggle button.on { background:var(--accent); color:#1a1a1a; font-weight:600; }
  input[type=search], input[type=number] { background:var(--panel); border:1px solid var(--line);
    color:var(--txt); border-radius:8px; padding:7px 10px; font-size:13px; }
  input[type=search] { width:180px; }
  label.muted input, label.muted select { margin-left:4px; }
  select { background:var(--panel); border:1px solid var(--line); color:var(--txt);
    border-radius:8px; padding:7px 8px; font-size:13px; }
  .count { color:var(--muted); font-size:12.5px; margin-left:auto; }
  .sched { padding:8px 22px; border-bottom:1px solid var(--line); color:var(--muted);
    font-size:12px; display:flex; flex-wrap:wrap; gap:8px 14px; }
  .sched .g { white-space:nowrap; }
  .sched .g.fin { opacity:.55; }
  .sched b { color:var(--txt); }
  .wrap { overflow-x:auto; padding:0 12px 60px; }
  table { border-collapse:collapse; width:100%; min-width:1120px; }
  th,td { padding:7px 9px; text-align:right; white-space:nowrap; }
  th { position:sticky; top:0; background:var(--panel); color:var(--muted);
    font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;
    cursor:pointer; border-bottom:1px solid var(--line); user-select:none; }
  th:hover { color:var(--txt); }
  th.sorted::after { content:" \25BC"; font-size:9px; }
  th.sorted.asc::after { content:" \25B2"; }
  td.l, th.l { text-align:left; }
  tbody tr { border-bottom:1px solid #20272f; }
  tbody tr:hover { background:#161d24; }
  .name { font-weight:600; }
  .inj { display:inline-flex; align-items:center; gap:4px; margin-left:7px; font-size:10.5px;
    font-weight:700; letter-spacing:.03em; cursor:help; color:var(--txt); }
  .inj i { width:7px; height:7px; border-radius:50%; background:#f4c430; }
  .inj.dbt i { background:#f0883e; }
  .inj.out i { background:var(--neg); }
  .team { color:var(--muted); font-size:12px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--pos); margin-right:6px; vertical-align:middle; }
  .r { font-weight:600; }
  .raw { color:var(--muted); font-size:11.5px; }
  .sig { text-decoration:underline; text-decoration-color:var(--accent);
    text-underline-offset:2px; }
  .muted { color:var(--muted); }
  .err { color:var(--neg); padding:20px 22px; }
  .care { display:inline-block; width:12px; color:var(--muted); }
  tbody tr.prow { cursor:pointer; }
  tbody tr.prow:hover .care { color:var(--accent); }
  tbody tr.drow > td { padding:0; background:#10161c; }
  /* contain: the panel's content can't widen the table; its own scroll
     wrappers (.sub-scroll, .pr-out) take any overflow instead. */
  .detail-wrap { padding:10px 16px 14px; text-align:left; white-space:normal; contain:inline-size; }
  .detail-h { font-size:12px; color:var(--muted); margin-bottom:8px; }
  table.sub { width:auto; min-width:0; border-collapse:collapse; }
  table.sub th { position:static; top:auto; background:transparent; cursor:default;
    border-bottom:1px solid var(--line); font-size:10.5px; padding:4px 12px; }
  table.sub td { padding:4px 12px; border-bottom:1px solid #20272f; white-space:nowrap; }
  table.sub tr.pool td { border-top:1px solid var(--line); }

  /* --- prop builder (every pulled season, scatter) --- */
  .pb { border:1px solid var(--line); border-radius:10px; background:var(--panel);
    padding:12px 14px 14px; margin-bottom:14px; }
  .pb-title { font-size:13px; font-weight:600; margin-bottom:2px; }
  .pb-sub { color:var(--muted); font-size:11.5px; margin-bottom:10px; }
  .pb-legend { display:flex; flex-wrap:wrap; gap:6px 16px; color:var(--muted);
    font-size:11.5px; margin-bottom:10px; }
  .pb-legend i { display:inline-block; width:9px; height:9px; border-radius:50%;
    margin-right:6px; vertical-align:-1px; }
  .pb-controls { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center;
    margin-bottom:12px; }
  .pb-controls label { color:var(--muted); font-size:12px; }
  .pb-controls input[type=number] { width:70px; margin-left:6px; }
  .pb-controls select { margin-left:6px; }
  .pb-body { display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start; }
  .pb-chart { position:relative; }
  .pb-chart svg { display:block; }
  .quads { display:grid; grid-template-columns:repeat(2, minmax(150px, 1fr));
    gap:8px; min-width:310px; flex:1; max-width:420px; }
  .quad { border:1px solid var(--line); border-radius:8px; padding:9px 11px;
    background:#10161c; }
  .quad .q-h { color:var(--muted); font-size:11px; line-height:1.35; }
  .quad .q-h b { color:var(--txt); }
  .quad .q-v { font-size:20px; font-weight:600; margin:3px 0 1px; }
  .quad .q-s { color:var(--muted); font-size:11px; }
  .pb-note { color:var(--muted); font-size:11px; margin-top:8px; grid-column:1/-1; }
  .pb-tip { position:absolute; pointer-events:none; display:none; z-index:10;
    background:#0b0f14; border:1px solid var(--line); border-radius:7px;
    padding:6px 9px; font-size:11.5px; line-height:1.4; white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.45); }
  .pb-tip b { color:var(--accent); }

  /* --- SGP pricer (Gaussian copula on the shrunk r) --- */
  /* Third item of .pb-body: beside the tiles when the screen has room, below
     the chart (full width) when it doesn't. min-width:0 lets its table
     scroll instead of widening the panel. */
  .pr { flex:1 1 560px; min-width:0; }
  .pr-sub { color:var(--muted); font-size:11.5px; margin-bottom:10px; max-width:900px; }
  .pr .pb-controls input[type=text] { width:74px; margin-left:6px; background:var(--panel);
    border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:7px 10px; font-size:13px; }
  .payin { width:92px; background:var(--panel); border:1px solid var(--line); color:var(--txt);
    border-radius:7px; padding:4px 7px; font-size:12.5px; text-align:right; }
  .pr table.sub td.fv { font-weight:600; color:var(--accent); }
  .fvw { display:inline-flex; align-items:center; gap:6px; }
  .sortw { display:inline-flex; align-items:center; gap:6px; }
  .sgn { background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:8px;
    min-width:34px; padding:6px 8px; font-size:14px; font-weight:600; cursor:pointer; }
  .plug { margin-left:auto; border:1px solid var(--accent); color:var(--accent); border-radius:8px;
    padding:6px 11px; font-size:12.5px; }
  .plug b { font-size:14px; }
  .pr-out, .sub-scroll { overflow-x:auto; }
  .nvbtn { font-size:12.5px; border-color:var(--accent); color:var(--accent); }
  .nvbtn:disabled { opacity:.5; cursor:wait; }
  .nv-out { color:var(--muted); font-size:11.5px; margin-top:8px; line-height:1.9; }
  .nv-out:empty { display:none; }
  .nv-chip { background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:7px;
    padding:2px 7px; margin:0 3px; font-size:11.5px; cursor:pointer; white-space:nowrap; }
  .nv-chip:hover { border-color:var(--accent); }
  .nv-chip.on { border-color:var(--accent); color:var(--accent); }
  .nv-chip.wide { border-style:dashed; color:var(--muted); }
  .nv-chip.wide.on { color:var(--accent); }
  .nv-chip small { font-size:10px; opacity:.8; }

  /* The player panel sits in a table row as wide as the table, so on a
     narrower screen it ran off the right edge (and the SGP pricer with it).
     Pin it to the visible width; --vw is the page's width without the
     scrollbar, set from JS. */
  .detail-wrap { position:sticky; left:0; width:min(100%, calc(var(--vw, 100vw) - 24px)); }
  @media (max-width: 900px) {
    .pb-chart svg { max-width:100%; height:auto; }
  }

  /* Phones: each player is a card (name / box stats / r values) instead of a
     12-column row; the Sort menu stands in for the hidden header. 16px
     inputs stop iOS zooming in on focus. */
  @media (max-width: 700px) {
    header { padding:12px 14px 8px; }
    h1 { font-size:17px; }
    h1 .h1sub { display:block; font-size:12px !important; margin-top:2px; }
    #meta { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
      overflow:hidden; cursor:pointer; }
    #meta.open { display:block; }
    .controls { position:static; padding:10px 14px; gap:8px 10px; }
    .toggle { flex:1 1 auto; }
    .toggle button { flex:1; padding:9px 8px; white-space:nowrap; }
    input[type=search] { flex:1 1 100%; width:auto; }
    input[type=search], input[type=number], input[type=text], select { font-size:16px; }
    #sortsel { max-width:60vw; }
    .count { margin-left:0; width:100%; }
    .sched { padding:8px 14px; }
    .wrap { padding:0 8px 60px; overflow-x:visible; }
    #tbl, #tbl > tbody { display:block; min-width:0; width:auto; }
    #tbl > thead { display:none; }
    #tbl > tbody > tr.prow { display:grid; grid-template-columns:repeat(18, minmax(0,1fr));
      row-gap:6px; padding:10px 4px; }
    #tbl > tbody > tr.prow > td { padding:0 2px; text-align:left; min-width:0; }
    #tbl td.c-name { grid-column:span 12; font-size:15px; overflow:hidden; text-overflow:ellipsis; }
    #tbl td.c-tag { grid-column:span 3; text-align:right; color:var(--muted); font-size:12px; align-self:center; }
    #tbl td.c-stat { grid-column:span 3; text-align:center; font-variant-numeric:tabular-nums; }
    #tbl td.c-r { grid-column:span 6; text-align:center; font-size:15px; }
    #tbl td[data-label]::before { content:attr(data-label); display:block; font-size:10px;
      color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
    #tbl td.srt::before { color:var(--accent) !important; font-weight:700; }
    #tbl tr.prow .raw { display:none; }
    #tbl > tbody > tr.drow, #tbl > tbody > tr.drow > td { display:block; }
    .detail-wrap { position:static; width:auto; padding:6px 2px 14px; }
    .pb { padding:10px 10px 12px; }
    .quads { min-width:0; grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .pr .pb-controls input[type=text] { width:84px; }
  }
</style>
</head>
<body>
<header>
  <h1>NFL Receiving Correlations <span class="muted h1sub" style="font-size:13px">— receptions, receiving yards &amp; touchdowns (WR · TE · RB)</span></h1>
  <div class="sub" id="meta">Loading…</div>
</header>

<div class="controls">
  <div class="toggle" id="toggle">
    <button data-mode="week" class="on">This week</button>
    <button data-mode="all">All players</button>
  </div>
  <input type="search" id="search" placeholder="Filter by name…" />
  <label class="muted">Pos
    <select id="possel">
      <option value="WR,TE" selected>WR + TE</option>
      <option value="WR">WR</option>
      <option value="TE">TE</option>
      <option value="RB">RB</option>
      <option value="WR,TE,RB">All</option>
    </select>
  </label>
  <label class="muted" title="Targets per game this season. 0 = show everyone.">Min tgt/g
    <input type="number" id="mintgt" value="3" min="0" step="0.5" style="width:56px" />
  </label>
  <label class="muted" title="Optional. 0 = show everyone (small samples included).">Min G
    <input type="number" id="ming" value="0" min="0" step="1" style="width:56px" />
  </label>
  <span class="muted" id="outn" title="Players ESPN's injury report lists as Out, IR, PUP, NFI, inactive or suspended are always left off. Questionable (Q) and doubtful (D) players stay, with a badge."></span>
  <span class="sortw"><label class="muted">Sort:
    <select id="sortsel">
      <option value="_yds">Rec yards</option>
      <option value="_rec">Receptions</option>
      <option value="_tgt">Targets</option>
      <option value="_td">TD%</option>
      <option value="_plug.rec_yds">REC·YDS r</option>
      <option value="_plug.rec_td">REC·TD r</option>
      <option value="_plug.yds_td">YDS·TD r</option>
    </select>
  </label><button type="button" class="sgn" id="sortdir" title="Flip the sort order"></button></span>
  <span class="count" id="count"></span>
</div>

<div class="sched" id="sched"></div>
<div class="wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
<div class="err" id="err" style="display:none"></div>

<script>
const SCOREBOARD = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard";
const INJURIES = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries";
let INJ = new Map();    // athlete_id -> {lab, status, out, note, ret} from ESPN's injury report
let DATA = null;        // full payload
let WEEK_IDS = null;    // Set<string> of team_ids with a game this week that hasn't finished
let MODE = "week";
let SORT = { key: "_yds", dir: -1 };  // dir -1 = high first, 1 = low first (A–Z)
let BOX_SEASON = null;  // box-stat columns show this season only (the current one)
let BLEND = [];         // seasons, oldest first — the prop builder + pricer blend them
let SW = {};            // per-game season weights (recency tilt), from the data file
const gw = g => SW[g.s] || 0;
const logOf = p => p.games || [];

const num = (v, d=2) => (v===null||v===undefined||Number.isNaN(v)) ? "—" : v.toFixed(d);
const pctTxt = v => (v===null||v===undefined) ? "—" : `${Math.round(100 * v)}%`;
const get = (o, path) => path.split(".").reduce((a,k)=> (a==null?a:a[k]), o);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

// ---- This week's slate --------------------------------------------------------
// ESPN's scoreboard without a date is the current NFL week. "This week" = the
// teams whose game hasn't gone final (what can still be bet); once every game
// is final, the whole week's slate.
async function liveWeek() {
  try {
    const r = await fetch(SCOREBOARD);
    if (!r.ok) throw 0;
    const j = await r.json();
    const games = (j.events || []).map(e => {
      const comp = (e.competitions?.[0]?.competitors || []).slice()
        .sort((a, b) => (a.homeAway !== "away") - (b.homeAway !== "away"));  // away first
      const st = e.status?.type || {};
      return { start: e.date, state: st.state, detail: st.shortDetail || "",
               matchup: comp.map(c => c.team.abbreviation).join(" @ "),
               team_ids: comp.map(c => String(c.team.id)),
               score: st.state && st.state !== "pre" ? comp.map(c => c.score).join("-") : "" };
    });
    return { week: j.week?.number, byes: (j.week?.teamsOnBye || []).map(t => t.abbreviation), games, live: true };
  } catch (_) {
    return null; // caller falls back to the baked snapshot
  }
}

function weekTeams(games) {
  const up = games.filter(g => g.state !== "post");
  return new Set((up.length ? up : games).flatMap(g => g.team_ids));
}

function renderSched(w) {
  const el = document.getElementById("sched");
  if (!w || !w.games.length) { el.textContent = "No NFL games this week."; return; }
  const kick = g => new Date(g.start).toLocaleString([], { weekday:"short", hour:"numeric", minute:"2-digit" });
  const games = w.games.slice().sort((a, b) => (a.start || "").localeCompare(b.start || ""));
  el.innerHTML = `<span class="muted">Week ${w.week ?? "?"}${w.live ? " (live)" : ""}:</span> ` +
    games.map(g => `<span class="g${g.state === "post" ? " fin" : ""}"><b>${esc(g.matchup)}</b> <span class="muted">${
      g.state === "pre" && g.start ? kick(g) : esc(g.detail)}${g.score ? ` ${esc(g.score)}` : ""}</span></span>`).join("") +
    (w.byes && w.byes.length ? `<span class="g">Bye: ${esc(w.byes.join(", "))}</span>` : "");
}

// ---- Injuries -----------------------------------------------------------------
// ESPN's league-wide injury report (CORS open), keyed by the athlete id in each
// entry's player-card link (the data file's athlete_id). The label is ESPN's
// fantasy status where it has one (QUESTIONABLE, OUT, IR, IR-R, INACTIVE,
// PUP-R, NFI-R, RESERVE-SUS, ...), else the status word. "Active" entries are
// transaction notes (practice-squad call-ups) and get nothing.
function injLabel(fs, status) {
  const f = (fs || "").toUpperCase(), s = (status || "").toLowerCase();
  if (f) {
    if (f === "QUESTIONABLE") return "Q";
    if (f === "DOUBTFUL") return "D";
    if (f === "PROBABLE") return "P";
    if (f === "OUT") return "OUT";
    if (f.startsWith("IR")) return "IR";
    if (f === "INACTIVE") return "INA";
    if (f.startsWith("PUP")) return "PUP";
    if (f.startsWith("NFI")) return "NFI";
    if (f.includes("SUS")) return "SUSP";
  }
  return { questionable:"Q", doubtful:"D", probable:"P", out:"OUT", "injured reserve":"IR",
           suspension:"SUSP", "physically unable to perform":"PUP", "day-to-day":"DTD" }[s] || "";
}
const INJ_HIDE = new Set(["OUT", "IR", "INA", "PUP", "NFI", "SUSP"]);

async function loadInjuries() {
  try {
    const r = await fetch(INJURIES);
    if (!r.ok) return;
    const m = new Map();
    for (const t of (await r.json()).injuries || []) {
      for (const i of t.injuries || []) {
        const id = (i.athlete?.links?.[0]?.href || "").match(/\/id\/(\d+)/)?.[1];
        if (!id) continue;
        const lab = injLabel(i.details?.fantasyStatus?.abbreviation, i.status);
        if (!lab) continue;
        m.set(id, { lab, status: i.status || "", out: INJ_HIDE.has(lab), note: i.shortComment || "",
                    ret: i.details?.returnDate || "" });
      }
    }
    INJ = m;
  } catch (_) { /* no report: nobody hidden, no badges */ }
}

function injBadge(p) {
  const i = INJ.get(p.athlete_id);
  if (!i) return "";
  const tip = `${i.lab} (${i.status})${i.ret ? ` · est. return ${i.ret}` : ""}${i.note ? ` — ${i.note}` : ""}`;
  return `<span class="inj${i.out ? " out" : i.lab === "D" ? " dbt" : ""}" title="${esc(tip)}"><i></i>${i.lab}</span>`;
}

// ---- Correlations ---------------------------------------------------------------
const R_HT = "Plug-in r = the binary correlation to put in a devig calculator " +
  "(joint = pA·pB + r·√(pA(1−pA)·pB(1−pB))) for an Over+Over or Under+Under at a median line " +
  "(the TD leg at his anytime-TD rate); flip its sign for an Over/Under mix. Expand the player for the exact value at any lines. " +
  "Copula r (small text) = the correlation of a Gaussian copula fit to his games — rank-based, so TDs being 0/1 most weeks " +
  "and catches being small counts don't water it down — pulled toward the average for his position: with ~40 games one " +
  "player's r carries 0.08 (REC·YDS) to 0.25 (TD pairs) of noise, and out of sample the position average predicts better. " +
  "'own' = his games alone, underlined when p < 0.05.";

// Normal CDF from erf (Abramowitz-Stegun 7.1.26, error < 1.5e-7).
function ncdf(x) {
  const t = 1 / (1 + 0.3275911 * Math.abs(x) / Math.SQRT2);
  const e = t * (0.254829592 + t * (-0.284496736 + t * (1.421413741 +
            t * (-1.453152027 + t * 1.061405429)))) * Math.exp(-x * x / 2);
  return x >= 0 ? 1 - e / 2 : e / 2;
}
function nppf(pr) {
  let lo = -10, hi = 10;
  for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (ncdf(m) < pr) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
// P(U below its a-quantile and V below its b-quantile) for standard normals
// with correlation r: Plackett's identity, Simpson's rule over rho in [0, r].
// The bivariate normal is symmetric, so it is also P(both over) at over-probs a, b.
function copulaJoint(r, a, b) {
  const x = nppf(a), y = nppf(b), n = 200, h = r / n;
  let tot = 0;
  for (let i = 0; i <= n; i++) {
    const rho = i * h, q = 1 - rho * rho;
    const f = Math.exp(-(x * x - 2 * rho * x * y + y * y) / (2 * q)) / (2 * Math.PI * Math.sqrt(q));
    tot += f * (i === 0 || i === n ? 1 : i % 2 ? 4 : 2);
  }
  return a * b + tot * h / 3;
}
// Binary (phi) correlation of two legs with probabilities a, b under the copula.
function binCorr(r, a, b) {
  if (!(a > 0 && a < 1 && b > 0 && b < 1)) return null;
  return (copulaJoint(r, a, b) - a * b) / Math.sqrt(a * (1 - a) * b * (1 - b));
}

const rhoOf = (p, key) => p[key]?.shrunk?.r ?? p[key]?.weighted?.r ?? null;

// Headline = plug-in r at a median line (TD leg: his blended anytime-TD rate).
// Small text = copula r (shrunk) and his own r, underlined when p < 0.05.
function rCell(p, key, full) {
  const pair = p[key];
  const rho = rhoOf(p, key);
  if (!pair || rho === null) return "—";
  const w = pair.weighted, s = pair.shrunk, v = p._plug[key];
  const sig = (w.p_value !== null && w.p_value < 0.05) ? "sig" : "";
  const td = key !== "rec_yds";
  const why = `binary correlation at a median line${td ? ` and his ${pctTxt(p._tdAll)} anytime-TD rate (${BLEND[0]}–${BLEND[BLEND.length - 1]} weighted)` : ""}, from copula r ${num(rho, 3)}` +
    (s ? ` (${p.group} average ${num(s.prior, 3)}, ${Math.round(100 * s.w)}% weight on his own ${num(w.r, 3)})` : "") +
    "; flip the sign for an Over/Under mix";
  const head = v === null ? `<span class="r muted" title="${td ? "no TD rate to price at (no TDs in his games)" : ""}">—</span>`
    : `<span class="r" style="color:${v > 0 ? "var(--pos)" : "var(--neg)"}" title="${why}">${num(v)}</span>`;
  return `${head} <span class="raw">copula ${num(rho)} · own <span class="${sig}">${num(w.r)}</span>` +
    `${full ? ` · p=${num(w.p_value, 3)}` : ""}${full && s ? ` · ${p.group} avg ${num(s.prior)}` : ""}</span>`;
}

// One r value for the per-season sub-table (single season => unweighted).
function rMini(pair) {
  if (!pair || pair.r===null || pair.r===undefined) return '<span class="muted">—</span>';
  const col = pair.r>0 ? "var(--pos)" : "var(--neg)";
  const sig = (pair.p_value!==null && pair.p_value<0.05) ? "sig" : "";
  return `<span class="r ${sig}" style="color:${col}">${num(pair.r)}</span>` +
         ` <span class="raw">p=${num(pair.p_value,3)}</span>`;
}

// Box-score columns show BOX_SEASON only, via the _g/_tgt/... fields
// precomputed in blendBox(). The r columns pool every season, weighted.
const COLS = [
  { k:"name", h:"Player", l:true,  v:p=>`<span class="care">${EXPANDED.has(p.athlete_id)?"▾":"▸"}</span>${WEEK_IDS&&WEEK_IDS.has(p.team_id)?'<span class="dot"></span>':''}<span class="name">${esc(p.name)}</span>${injBadge(p)}` },
  { k:"team_abbr", h:"Tm", l:true, v:p=>`<span class="team">${esc(p.team_abbr)||"—"}</span>` },
  { k:"position", h:"Pos", l:true, v:p=>esc(p.position)||"—" },
  { k:"_g", h:"G", ht:"Games this season", v:p=>p._g },
  { k:"effective_n", h:"nEff", ht:"Effective sample size of the recency-weighted correlations", v:p=>num(p.effective_n,1) },
  { k:"_tgt", h:"Tgt", ht:"Targets per game this season", v:p=>num(p._tgt,1) },
  { k:"_rec", h:"Rec", ht:"Receptions per game this season", v:p=>num(p._rec,1) },
  { k:"_yds", h:"Yds", ht:"Receiving yards per game this season", v:p=>num(p._yds,1) },
  { k:"_td", h:"TD%", ht:"Share of games this season with a touchdown (receiving or rushing) — the anytime-TD hit rate", v:p=>pctTxt(p._td) },
  { k:"_plug.rec_yds", h:"REC·YDS r", ht:"Receptions vs receiving yards. " + R_HT, v:p=>rCell(p, "rec_yds") },
  { k:"_plug.rec_td", h:"REC·TD r", ht:"Receptions vs anytime TD. " + R_HT, v:p=>rCell(p, "rec_td") },
  { k:"_plug.yds_td", h:"YDS·TD r", ht:"Receiving yards vs anytime TD. " + R_HT, v:p=>rCell(p, "yds_td") },
];
const EXPANDED = new Set();

// ---- Prop builder: two-stat scatter over every pulled season, weighted -----
const PROPS = new Map();
const STATS = ["rec", "yds", "td"];
const STAT_LABEL = { rec:"REC", yds:"YDS", td:"TD" };
const STAT_NAME = { rec:"Receptions", yds:"Receiving yards", td:"Touchdowns" };
const opts = cur => STATS.map(k => `<option value="${k}"${k===cur?" selected":""}>${STAT_NAME[k]}</option>`).join("");
const PAIR_KEY = { "rec|yds":"rec_yds", "yds|rec":"rec_yds", "rec|td":"rec_td", "td|rec":"rec_td",
                   "yds|td":"yds_td", "td|yds":"yds_td" };
// Sorted on a correlation -> the builder opens on that pair.
const SORT_PAIR = { "_plug.rec_yds":["rec","yds"], "_plug.rec_td":["rec","td"], "_plug.yds_td":["yds","td"] };

// Default line: the half-point line that splits his games (weighted) closest
// to 50/50, about where a book hangs its main line. TD: 0.5, anytime.
function mainLine(p, stat) {
  if (stat === "td") return 0.5;
  const gs = logOf(p);
  const W = gs.reduce((a, g) => a + gw(g), 0);
  if (!W) return 0.5;
  let best = 0.5, bd = Infinity;
  for (const v of [...new Set(gs.map(g => g[stat]))].sort((a, b) => a - b)) {
    for (const L of [v - 0.5, v + 0.5]) {
      if (L < 0) continue;
      const d = Math.abs(gs.reduce((a, g) => a + (g[stat] > L ? gw(g) : 0), 0) / W - 0.5);
      if (d < bd - 1e-12) { bd = d; best = L; }
    }
  }
  return best;
}

function propState(p) {
  if (!PROPS.has(p.athlete_id)) {
    const [x, y] = SORT_PAIR[SORT.key] || ["rec", "yds"];
    PROPS.set(p.athlete_id, { xStat: x, xLine: mainLine(p, x), yStat: y, yLine: mainLine(p, y) });
  }
  return PROPS.get(p.athlete_id);
}

// A new sort on a pair moves every builder showing another pair onto it
// (fresh lines, fair odds and prices cleared); one already on it is kept.
function syncPropsToSort() {
  const pair = SORT_PAIR[SORT.key];
  if (!pair) return;
  for (const [id, st] of PROPS) if (PAIR_KEY[`${st.xStat}|${st.yStat}`] !== PAIR_KEY[pair.join("|")]) PROPS.delete(id);
}

// A two-way price (implied po + pu) -> [fair over, fair under], each side the
// worst (lowest) of the multiplicative, additive, power and Shin devigs, like
// Vulture's Fair column: +132/-173 -> +153/-147. A pair at or under 100% is
// already fair and kept. Same as devig_worst in .claude/skills/nba-ast-pts-sgp/sgp.py.
function devigWorst(po, pu) {
  const s = po + pu;
  if (s <= 1 + 1e-9) return [po, pu];
  const c = [[po / s, pu / s], [po - (s - 1) / 2, pu - (s - 1) / 2]];
  let lo = 1, hi = 20, k = 1;
  for (let i = 0; i < 100; i++) { k = (lo + hi) / 2; if (po ** k + pu ** k > 1) lo = k; else hi = k; }
  c.push([po ** k, pu ** k]);
  const shin = (z, q) => (Math.sqrt(z * z + 4 * (1 - z) * q * q / s) - z) / (2 * (1 - z));
  let zl = 0, zh = 0.5, z = 0;
  for (let i = 0; i < 100; i++) { z = (zl + zh) / 2; if (shin(z, po) + shin(z, pu) > 1) zl = z; else zh = z; }
  c.push([shin(z, po), shin(z, pu)]);
  return [Math.min(...c.map(x => x[0])), Math.min(...c.map(x => x[1]))];
}

// "+117" / "117" / "-133" -> implied probability; null if not American odds.
function oddsProb(txt) {
  const o = parseFloat(String(txt || "").replace(/\s/g, ""));
  if (!Number.isFinite(o) || Math.abs(o) < 100) return null;
  return o > 0 ? 100 / (o + 100) : -o / (-o + 100);
}

// p (probability) -> fair American odds string.
function fairOdds(pr) {
  if (pr <= 0 || pr >= 1) return "—";
  return pr >= 0.5 ? `-${Math.round(100 * pr / (1 - pr))}`
                   : `+${Math.round(100 * (1 - pr) / pr)}`;
}

function niceStep(span, target = 7) {
  const raw = span / target;
  for (const s of [1, 2, 5, 10, 20, 25, 50]) if (s >= raw) return s;
  return 100;
}

// Axis padding per stat so the red lines and edge dots never clip.
const PAD = { rec: 1, yds: 8, td: 0.4 };
function domain(vals, line, k) {
  const lo = Math.min(...vals, line), hi = Math.max(...vals, line);
  return [lo < 0 ? lo - PAD[k] : Math.max(0, lo - PAD[k]), hi + PAD[k]];
}

// Build the SVG scatter + quadrant tiles inside the given .pb container.
function drawProp(pb, p) {
  const st = propState(p);
  const yKey = st.yStat, yLab = STAT_LABEL[yKey];
  const xKey = st.xStat, xLab = STAT_LABEL[xKey];
  const games = logOf(p);
  const chartEl = pb.querySelector(".pb-chart");
  const quadEl = pb.querySelector(".quads");
  drawPricer(pb, p, games);
  if (!games.length) {
    chartEl.innerHTML = `<div class="muted" style="padding:20px 0">No ${BLEND.join(" or ")} games for this player.</div>`;
    quadEl.innerHTML = "";
    return;
  }

  // Quadrant hit rates, each game weighted by its season (gw). Over = strictly
  // greater; a game landing exactly on an integer line is a push and is
  // excluded from all four buckets. Each bucket holds [games, weight].
  const q = { oo:[0,0], ou:[0,0], uo:[0,0], uu:[0,0] };
  let push = 0, wn = 0;
  for (const g of games) {
    const x = g[xKey], y = g[yKey];
    if (x === st.xLine || y === st.yLine) { push++; continue; }
    const b = q[(x > st.xLine ? "o" : "u") + (y > st.yLine ? "o" : "u")];
    b[0]++; b[1] += gw(g); wn += gw(g);
  }
  const n = games.length - push;
  const tile = (label, [c, w]) => {
    const pr = wn ? w / wn : 0;
    return `<div class="quad"><div class="q-h">${label}</div>` +
      `<div class="q-v">${wn ? Math.round(pr * 100) : "—"}%</div>` +
      `<div class="q-s">${c}/${n} games · fair ${wn ? fairOdds(pr) : "—"}</div></div>`;
  };
  // Tiles mirror the chart's quadrants: over/over top-right, under/over
  // top-left, under/under bottom-left, over/under bottom-right.
  const oX = `${xLab} <b>o${st.xLine}</b>`, uX = `${xLab} <b>u${st.xLine}</b>`;
  const oY = `${yLab} <b>o${st.yLine}</b>`, uY = `${yLab} <b>u${st.yLine}</b>`;
  quadEl.innerHTML =
    tile(`${uX} &amp; ${oY}`, q.uo) + tile(`${oX} &amp; ${oY}`, q.oo) +
    tile(`${uX} &amp; ${uY}`, q.uu) + tile(`${oX} &amp; ${uY}`, q.ou) +
    (push ? `<div class="pb-note">${push} push${push>1?"es":""} (exactly on a line) excluded.</div>` : "");

  const W = 520, H = 400, ML = 46, MR = 16, MT = 14, MB = 42;
  const [xmin, xmax] = domain(games.map(g => g[xKey]), st.xLine, xKey);
  const [ymin, ymax] = domain(games.map(g => g[yKey]), st.yLine, yKey);
  const X = v => ML + (v - xmin) / (xmax - xmin) * (W - ML - MR);
  const Y = v => H - MB - (v - ymin) / (ymax - ymin) * (H - MT - MB);

  // Duplicate (x,y) games collapse into one bigger dot.
  const cells = new Map();
  for (const g of games) {
    const k = `${g[xKey]},${g[yKey]}`;
    if (!cells.has(k)) cells.set(k, []);
    cells.get(k).push(g);
  }

  const xStep = niceStep(xmax - xmin), yStep = niceStep(ymax - ymin);
  let grid = "", labels = "";
  for (let v = Math.ceil(xmin / xStep) * xStep; v <= xmax; v += xStep) {
    grid += `<line x1="${X(v)}" y1="${MT}" x2="${X(v)}" y2="${H-MB}"/>`;
    labels += `<text x="${X(v)}" y="${H-MB+16}" text-anchor="middle">${v}</text>`;
  }
  for (let v = Math.ceil(ymin / yStep) * yStep; v <= ymax; v += yStep) {
    grid += `<line x1="${ML}" y1="${Y(v)}" x2="${W-MR}" y2="${Y(v)}"/>`;
    labels += `<text x="${ML-8}" y="${Y(v)+3.5}" text-anchor="end">${v}</text>`;
  }

  // One layer per season, oldest first: each layer's dot is sized by games
  // from that season onward, so older seasons show as rings around newer.
  const dot = (k, m) => {
    const [gx, gy] = k.split(",").map(Number);
    return `<circle cx="${X(gx)}" cy="${Y(gy)}" r="${5 + 2.2 * Math.sqrt(m - 1)}" data-k="${k}"/>`;
  };
  const layers = BLEND.map((yr, i) => {
    let d = "";
    for (const [k, gs] of cells) {
      if (!gs.some(g => g.s === yr)) continue;
      d += dot(k, gs.filter(g => g.s >= yr).length);
    }
    return `<g fill="${seasonColor(i)}" stroke="#10161c" stroke-width="2">${d}</g>`;
  }).join("");

  chartEl.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
       aria-label="${esc(p.name)}: ${BLEND.join(" + ")} games, ${xLab} vs ${yLab}">
      <g stroke="#2a333d" stroke-width="1">${grid}</g>
      <g fill="#8b98a5" font-size="11">${labels}</g>
      <g stroke="var(--neg)" stroke-width="1.5">
        <line x1="${X(st.xLine)}" y1="${MT}" x2="${X(st.xLine)}" y2="${H-MB}"/>
        <line x1="${ML}" y1="${Y(st.yLine)}" x2="${W-MR}" y2="${Y(st.yLine)}"/>
      </g>
      <g fill="var(--neg)" font-size="10.5">
        <text x="${Math.min(X(st.xLine)+4, W-MR-24)}" y="${MT+11}">${st.xLine}</text>
        <text x="${W-MR-4}" y="${Y(st.yLine)-5}" text-anchor="end">${st.yLine}</text>
      </g>
      ${layers}
      <text x="${(ML+W-MR)/2}" y="${H-6}" text-anchor="middle" fill="#8b98a5" font-size="12">${STAT_NAME[xKey]}</text>
      <text x="12" y="${(MT+H-MB)/2}" text-anchor="middle" fill="#8b98a5" font-size="12"
        transform="rotate(-90 12 ${(MT+H-MB)/2})">${STAT_NAME[yKey]}</text>
    </svg><div class="pb-tip"></div>`;

  // Hover tooltip: date · week · opp · result · stat line for each game on the dot.
  const tip = chartEl.querySelector(".pb-tip");
  chartEl.querySelectorAll("circle").forEach(c => {
    c.style.cursor = "pointer";
    c.onmouseenter = () => {
      const gs = cells.get(c.dataset.k);
      tip.innerHTML = gs.map(g =>
        `${g.d} wk ${g.wk ?? "?"} ${esc(g.loc)} ${esc(g.opp)} (${esc(g.res)}${g.tm!=null?` ${g.tm}-${g.op}`:""}) — ` +
        `<b>${g.tgt} tgt, ${g.rec} rec, ${g.yds} yds, ${g.td} TD${g.rtd ? ` (${g.rtd} rush)` : ""}</b>`
      ).join("<br>");
      tip.style.display = "block";
      const bb = chartEl.getBoundingClientRect(), cb = c.getBoundingClientRect();
      let tx = cb.left - bb.left + 14, ty = cb.top - bb.top - 8;
      tip.style.left = "0px"; tip.style.top = "0px";
      const tw = tip.offsetWidth;
      if (tx + tw > W - 4) tx = cb.left - bb.left - tw - 14;
      tip.style.left = Math.max(0, tx) + "px"; tip.style.top = ty + "px";
    };
    c.onmouseleave = () => { tip.style.display = "none"; };
  });
}

// Dot color per BLEND index: newest = accent, then progressively dimmer.
const seasonColor = i => ["var(--accent)", "var(--prev)", "var(--old)"][BLEND.length - 1 - i] || "var(--old)";

// Static shell for the builder; drawProp fills in the chart, tiles and pricer.
function propHTML(p) {
  const st = propState(p);
  const lineIn = a => `<label>${STAT_LABEL[st[a + "Stat"]]} line<input type="number" step="0.5" min="0" value="${st[a + "Line"]}" data-f="${a}Line"></label>`;
  return `<div class="pb" data-id="${p.athlete_id}">
    <div class="pb-title">Prop builder</div>
    <div class="pb-legend">${BLEND.slice().reverse().map((yr, j) =>
      `<span><i style="background:${seasonColor(BLEND.length - 1 - j)}"></i>${yr}${j===0?" · this season":j===1?" · last season":""}</span>`).join("")}</div>
    <div class="pb-controls">
      <label>1st stat<select data-f="xStat">${opts(st.xStat)}</select></label>
      ${lineIn("x")}
      <label>2nd stat<select data-f="yStat">${opts(st.yStat)}</select></label>
      ${lineIn("y")}
      <span class="plug" data-plug title="Binary correlation for a devig calculator at these lines (the SGP pricer). Same size for every over/under combo; positive for Over+Over and Under+Under, negative for an Over/Under mix."></span>
    </div>
    <div class="pb-body"><div class="pb-chart"></div><div class="quads"></div>
    <div class="pr">
      <div class="pb-title">SGP pricer</div>
      <div class="pr-sub"></div>
      <div class="pb-controls">
        ${["x", "y"].map(a => ["", "U"].map(u => `<span class="fvw"><label><span data-lab="${a}${u}"></span> fair<input type="text" inputmode="numeric" placeholder="${u ? "optional" : "e.g. -110"}" value="${st[a + "Fv" + u] || ""}" data-f="${a}Fv${u}"></label><button type="button" class="sgn" data-sgn="${a}Fv${u}" title="Flip the sign (phone number pads have no minus key)">±</button></span>`).join("")).join("")}
        <button type="button" class="sgn nvbtn" data-novig title="Fill both legs' Over and Under fair odds from Novig's exchange: each side the worst-case devig of the two asks at that line (pregame, books up to ${NV_MAX_SPREAD * 100}¢ wide)">Fetch FV</button>
      </div>
      <div class="nv-out"></div>
      <div class="pr-out"></div>
    </div>
    </div>
  </div>`;
}

// Price the four over/under combos of the builder's two lines. Leg odds are
// the fair odds entered (Over, plus Under for a worst-case devig); a leg left
// blank uses the player's weighted game-log hit rate instead.
function drawPricer(pb, p, games) {
  const el = pb.querySelector(".pr");
  if (!el) return;
  const st = propState(p);
  const xL = STAT_LABEL[st.xStat], yL = STAT_LABEL[st.yStat];
  for (const [a, L] of [["x", xL], ["y", yL]]) {
    el.querySelector(`[data-lab="${a}"]`).textContent = `${L} o${st[a + "Line"]}`;
    el.querySelector(`[data-lab="${a}U"]`).textContent = `u${st[a + "Line"]}`;
  }
  const sub = el.querySelector(".pr-sub"), out = el.querySelector(".pr-out");
  const plugEl = pb.querySelector("[data-plug]");
  plugEl.innerHTML = "Plug-in r: —";
  const key = PAIR_KEY[`${st.xStat}|${st.yStat}`], pair = p[key], r = key ? rhoOf(p, key) : null;
  if (!pair || r === null) {
    sub.textContent = `No ${xL}·${yL} correlation for this player, so these lines can't be priced together here.`;
    out.innerHTML = "";
    return;
  }
  // {p: P(over), u: P(under)}. Both fair boxes filled: each side is its
  // worst-case devig (a fair pair at or under 100% is kept as is); one box:
  // the other side is its complement; none: game-log hit rate.
  const leg = (stat, line, ot, ut) => {
    const o = oddsProb(ot), u = oddsProb(ut);
    if (o !== null && u !== null) { const [fo, fu] = devigWorst(o, u); return { p: fo, u: fu, fv: true }; }
    if (o !== null) return { p: o, u: 1 - o, fv: true };
    if (u !== null) return { p: 1 - u, u, fv: true };
    let w = 0, wo = 0;
    for (const g of games) {
      if (g[stat] === line) continue;
      w += gw(g); if (g[stat] > line) wo += gw(g);
    }
    return { p: w ? wo / w : null, u: w ? 1 - wo / w : null, fv: false };
  };
  const X = leg(st.xStat, st.xLine, st.xFv, st.xFvU), Y = leg(st.yStat, st.yLine, st.yFv, st.yFvU);
  sub.innerHTML = `r <b>${num(r, 3)}</b>`;
  if (X.p === null || Y.p === null || X.p <= 0 || X.p >= 1 || Y.p <= 0 || Y.p >= 1) {
    out.innerHTML = `<div class="pb-note">Not enough games on both sides of a line to price it; enter fair odds.</div>`;
    return;
  }
  const plug = binCorr(r, X.p, Y.p);
  const sgn = v => `${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(3)}`;
  plugEl.innerHTML = `Plug-in r at these lines: <b>${sgn(plug)}</b> <span class="muted">(${sgn(-plug)} for an Over/Under mix)</span>`;
  // Each combo has its own SGP price (a book prices O/O and O/U separately).
  const pays = st.pays ||= {};
  const pct = v => `${(100 * v).toFixed(1)}%`;
  const row = (xo, yo) => {
    const k = (xo ? "o" : "u") + (yo ? "o" : "u");
    const a = xo ? X.p : X.u, b = yo ? Y.p : Y.u;
    const rr = xo === yo ? r : -r;  // an Over/Under combo flips the sign
    const j = copulaJoint(rr, a, b);
    const corr = (j - a * b) / Math.sqrt(a * (1 - a) * b * (1 - b));
    return `<tr data-j="${j}"><td class="l">${xL} <b>${xo ? "o" : "u"}${st.xLine}</b> &amp; ${yL} <b>${yo ? "o" : "u"}${st.yLine}</b></td>` +
      `<td class="fv">${fairOdds(j)}</td>` +
      `<td><input type="text" inputmode="decimal" class="payin" placeholder="e.g. +250" value="${esc(pays[k] || "")}" data-pay="${k}"></td>` +
      `<td data-ev>${evCell(j, pays[k])}</td><td>${(1 / j).toFixed(2)}x</td>` +
      `<td>${pct(j)}</td><td>${corr >= 0 ? "+" : ""}${corr.toFixed(3)}</td><td>${pct(a)} · ${pct(b)}</td></tr>`;
  };
  out.innerHTML = `<table class="sub"><thead><tr><th class="l">Combo</th><th>Fair odds</th>` +
    `<th>SGP odds</th><th>EV</th><th>Fair x</th><th>Fair %</th><th>Corr</th><th>Legs</th></tr></thead><tbody>` +
    row(true, true) + row(false, false) + row(true, false) + row(false, true) + `</tbody></table>`;
  // Typing a price updates that row's EV only, so the input keeps focus.
  out.querySelectorAll("[data-pay]").forEach(inp => inp.oninput = () => {
    pays[inp.dataset.pay] = inp.value.trim();
    const tr = inp.closest("tr");
    tr.querySelector("[data-ev]").innerHTML = evCell(+tr.dataset.j, pays[inp.dataset.pay]);
  });
}

// A slip price -> decimal: "2.39" / "2.39x" as decimal, "+139" / "-120" (or
// any |v| >= 100) as American. null if it isn't a price.
function payDecimal(txt) {
  const t = String(txt || "").replace(/\s|x$/gi, "");
  const v = parseFloat(t);
  if (!Number.isFinite(v)) return null;
  if (/^[+-]/.test(t) || Math.abs(v) >= 100) {
    if (Math.abs(v) < 100) return null;
    return v > 0 ? 1 + v / 100 : 1 + 100 / -v;
  }
  return v > 1 ? v : null;
}

// EV at the slip's price for a combo with fair probability j.
function evCell(j, txt) {
  const d = payDecimal(txt);
  if (d === null) return "—";
  const ev = d * j - 1;
  return `<span style="color:${ev >= 0 ? "var(--pos)" : "var(--neg)"}">${ev >= 0 ? "+" : ""}${(100 * ev).toFixed(1)}%</span>`;
}

// ---- Novig fair values -------------------------------------------------------
// Novig's public catalog (official API, no key, CORS open): every open pregame
// NFL receptions / receiving yards / touchdowns prop with each outcome's best
// bid. The Over ask is 1 - the Under bid, so the two asks are a two-way price
// whose vig is the spread; each side's fair is its worst-case devig
// (devigWorst), a hair under the mid on a tight book. TOUCHDOWNS 0.5 is the
// anytime TD. Pregame game markets charge no taker fee. Wide books (thin alts)
// are not priced from; same rule as .claude/skills/nba-sgp-fv/novig.py.
const NV_URL = "https://api.novig.com/v3/public/catalog/markets";
const NV_TYPES = { rec:"RECEPTIONS", yds:"RECEIVING_YARDS", td:"TOUCHDOWNS" };
const NV_MAX_SPREAD = 0.04;
let NV_CACHE = null;  // { t, items }: one slate pull serves every player for a minute

async function novigMarkets() {
  if (NV_CACHE && Date.now() - NV_CACHE.t < 60e3) return NV_CACHE.items;
  const items = [];
  let after = null;
  for (let i = 0; i < 20; i++) {
    const q = new URLSearchParams({ league:"NFL", marketType:Object.values(NV_TYPES).join(","),
                                    eventStatus:"OPEN_PREGAME", limit:"5000" });
    if (after) q.set("after", after);
    const res = await fetch(`${NV_URL}?${q}`);
    if (!res.ok) throw new Error(`Novig answered ${res.status}`);
    const page = await res.json();
    items.push(...(page.items || []));
    after = page.next;
    if (!after) break;
  }
  NV_CACHE = { t: Date.now(), items };
  return items;
}

// Match key: "Marvin Harrison Jr." / "A.J. Brown" / "Ja'Marr Chase" ->
// "marvinharrison" / "ajbrown" / "jamarrchase". Periods and apostrophes drop
// out and spaces don't count, so "A.J." (ESPN) meets "AJ" (Novig).
const nvNorm = s => s.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
  .replace(/['.]/g, "").replace(/[^a-z0-9 ]/g, " ").split(/\s+/)
  .filter(w => w && !["jr", "sr", "ii", "iii", "iv", "v"].includes(w)).join("")
  .replace(/^.*$/, k => NV_ALIAS[k] || k);
// Novig's name -> ESPN's, where they differ.
const NV_ALIAS = { kennethgainwell: "kennygainwell", kevinconcepcion: "kcconcepcion" };

// { stat: [{line, bid, ask, mid, spread, vol, fair}] } for the player, or null.
function novigLadder(items, name) {
  const want = nvNorm(name);
  const who = m => m.description.split(" ").slice(0, -2).join(" ");
  const names = [...new Set(items.map(who))];
  let hit = names.filter(n => nvNorm(n) === want);
  if (!hit.length) hit = names.filter(n => nvNorm(n).includes(want));
  if (hit.length !== 1) return null;
  const stat = Object.fromEntries(Object.entries(NV_TYPES).map(([k, v]) => [v, k]));
  const out = {};
  for (const m of items) {
    if (who(m) !== hit[0] || !stat[m.marketType]) continue;
    const side = Object.fromEntries(m.outcomes.map(o => [o.name.split(" ")[0].toLowerCase(), o]));
    const bid = side.over?.bid ? +side.over.bid.price : null;
    const ask = side.under?.bid ? 1 - side.under.bid.price : null;
    const two = bid !== null && ask !== null;
    (out[stat[m.marketType]] ||= []).push({ line: +m.strike, bid, ask, vol: m.volume,
      mid: two ? (bid + ask) / 2 : null, spread: two ? ask - bid : null,
      // The two sides' asks are a two-way price whose vig is the spread.
      fair: two ? devigWorst(ask, 1 - bid) : null });
  }
  for (const v of Object.values(out)) v.sort((a, b) => a.line - b.line);
  return out;
}

const nvTight = r => r.spread !== null && r.spread <= NV_MAX_SPREAD + 1e-9;

// Fill each leg's fair odds from Novig at its line. A leg whose line is
// missing or too wide is left alone, with Novig's lines as chips: a click
// moves the line there and fills its fair odds.
async function fetchNovig(pb, p) {
  const btn = pb.querySelector("[data-novig]"), msg = pb.querySelector(".nv-out");
  btn.disabled = true;
  msg.textContent = "Fetching Novig…";
  let lad;
  try {
    lad = novigLadder(await novigMarkets(), p.name);
  } catch (e) {
    msg.textContent = `Couldn't reach Novig (${e.message}).`;
    btn.disabled = false;
    return;
  }
  btn.disabled = false;
  if (!lad) {
    msg.textContent = `${p.name} isn't on Novig's open pregame props right now.`;
    return;
  }
  const st = propState(p);
  const time = new Date().toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
  // "YDS 69.5: o -104 / u -103 (worst case; mid 51.5%, 51.0–52.0, 1.0¢ wide)" for the line in use.
  const used = (a, r) => `${STAT_LABEL[st[a + "Stat"]]} ${r.line}: o <b>${fairOdds(r.fair[0])}</b> / u <b>${fairOdds(r.fair[1])}</b> (worst case; mid ${(100 * r.mid).toFixed(1)}%, ` +
    `${(100 * r.bid).toFixed(1)}–${(100 * r.ask).toFixed(1)}, ${(100 * r.spread).toFixed(1)}¢ wide${nvTight(r) ? "" : ", rough"})`;
  const byChip = {};
  const fill = (a, r) => {
    for (const [u, q] of [["", r.fair[0]], ["U", r.fair[1]]]) {
      st[a + "Fv" + u] = fairOdds(q);
      pb.querySelector(`[data-f="${a}Fv${u}"]`).value = st[a + "Fv" + u];
    }
  };
  const lines = ["x", "y"].map(a => {
    const stat = st[a + "Stat"], line = st[a + "Line"], lab = `${STAT_LABEL[stat]} o${line}`;
    const rows = lad[stat] || [], at = rows.find(r => r.line === line);
    if (at && nvTight(at)) {
      fill(a, at);
      return used(a, at);
    }
    const why = !at ? `no Novig line at ${line}`
      : at.mid === null ? `Novig's ${line} is one-sided`
      : `Novig's ${line} is ${(100 * at.spread).toFixed(1)}¢ wide, not used`;
    // Wide books stay pickable, dimmed and with their spread: the mid is shaky
    // but sometimes it's the only line near the slip's.
    const two = rows.filter(r => r.mid !== null);
    const chips = two.map(r => {
      const w = !nvTight(r), sp = `${(100 * r.spread).toFixed(1)}¢`;
      byChip[`${a}|${r.line}`] = r;
      return `<button type="button" class="nv-chip${w ? " wide" : ""}" data-nv="${a}|${r.line}"` +
        ` title="${(100 * r.bid).toFixed(1)}–${(100 * r.ask).toFixed(1)}, ${sp} wide${w ? " (rough)" : ""} · vol ${(r.vol || 0).toLocaleString()}">` +
        `${r.line} ${fairOdds(r.fair[0])}${w ? ` <small>${sp}</small>` : ""}</button>`;
    }).join("");
    return `<span data-nvh="${a}">${lab}: ${why}.</span> ${two.length ? `Novig's lines: ${chips}` : "Novig has no two-sided line for this stat."}`;
  });
  msg.innerHTML = `Novig · ${time}<br>` + lines.join("<br>");
  msg.querySelectorAll("[data-nv]").forEach(c => c.onclick = () => {
    const [a, line] = c.dataset.nv.split("|");
    st[a + "Line"] = +line;
    pb.querySelector(`[data-f="${a}Line"]`).value = line;
    fill(a, byChip[`${a}|${line}`]);
    msg.querySelectorAll(`[data-nv^="${a}|"]`).forEach(o => o.classList.toggle("on", o === c));
    // The note now describes the line the chip moved to.
    msg.querySelector(`[data-nvh="${a}"]`).innerHTML = used(a, byChip[`${a}|${line}`]) + ".";
    drawProp(pb, p);
  });
  drawPricer(pb, p, logOf(p));
}

// Bind builder controls + first draw. Input changes redraw only this builder
// (no full table re-render, so typing keeps focus).
function initProp(pb) {
  const p = DATA.players.find(x => x.athlete_id === pb.dataset.id);
  if (!p) return;
  const rebuild = () => {
    pb.outerHTML = propHTML(p);
    initProp(document.querySelector(`.pb[data-id="${p.athlete_id}"]`));
  };
  pb.querySelectorAll("[data-f]").forEach(el => {
    const f = el.dataset.f;
    const h = () => {
      const st = propState(p);
      if (/^[xy]FvU?$/.test(f)) {
        // Pricer inputs: keep the raw text (odds can be negative), reprice only.
        st[f] = el.value.trim();
        drawPricer(pb, p, logOf(p));
        return;
      }
      // A new stat or line makes that leg's entered fair odds and the
      // combos' SGP prices stale.
      const a = f[0], o = a === "x" ? "y" : "x";
      st.pays = {};
      if (f === "xStat" || f === "yStat") {
        if (el.value === st[o + "Stat"]) {
          // Picking the other leg's stat swaps the legs; lines and fair odds go with them.
          for (const k of ["Stat", "Line", "Fv", "FvU"]) [st["x" + k], st["y" + k]] = [st["y" + k], st["x" + k]];
        } else {
          st[f] = el.value;
          st[a + "Line"] = mainLine(p, el.value);
          st[a + "Fv"] = st[a + "FvU"] = "";
        }
        rebuild();
        return;
      }
      const v = parseFloat(el.value);
      if (!Number.isFinite(v) || v < 0) return;
      st[f] = v;
      for (const u of ["", "U"]) {
        st[a + "Fv" + u] = "";
        const fvIn = pb.querySelector(`[data-f="${a}Fv${u}"]`);
        if (fvIn) fvIn.value = "";
      }
      drawProp(pb, p);
    };
    el.tagName === "SELECT" ? el.onchange = h : el.oninput = h;
  });
  // ± flips an odds box between + and −: phone number pads have no minus key.
  pb.querySelectorAll(".sgn[data-sgn]").forEach(btn => btn.onclick = () => {
    const inp = pb.querySelector(`[data-f="${btn.dataset.sgn}"]`);
    const v = inp.value.trim().replace(/^\+/, "");
    inp.value = v.startsWith("-") ? v.slice(1) : "-" + v;
    inp.dispatchEvent(new Event("input"));
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
  });
  pb.querySelector("[data-novig]").onclick = () => fetchNovig(pb, p);
  drawProp(pb, p);
}

// Expanded per-season history block (rendered in a full-width detail row).
function detailHTML(p) {
  const yrs = Object.keys(p.by_season || {}).sort();
  let body = yrs.map(y => {
    const s = p.by_season[y];
    return `<tr><td class="l"><b>${y}</b></td><td>${s.games}</td><td>${num(s.tgt_mean,1)}</td>` +
           `<td>${num(s.rec_mean,1)}</td><td>${num(s.yds_mean,1)}</td><td>${pctTxt(s.td_rate)}</td>` +
           `<td class="l">${rMini(s.rec_yds)}</td><td class="l">${rMini(s.rec_td)}</td><td class="l">${rMini(s.yds_td)}</td></tr>`;
  }).join("");
  // Pooled (all seasons, recency-weighted) reference row.
  body += `<tr class="pool"><td class="l" title="Each season ranked on its own before pooling, so a season where his role moved every stat up or down together can't fake a correlation"><b>Pooled</b> <span class="muted">(wtd, within-season)</span></td>` +
          `<td>${p.n_games}</td><td>${num(p.tgt_mean,1)}</td><td>${num(p.rec_mean,1)}</td><td>${num(p.yds_mean,1)}</td><td>${pctTxt(p.td_rate)}</td>` +
          `<td class="l">${rCell(p, "rec_yds", 1)}</td><td class="l">${rCell(p, "rec_td", 1)}</td><td class="l">${rCell(p, "yds_td", 1)}</td></tr>`;
  return `<div class="detail-wrap">${propHTML(p)}<div class="detail-h">Per-season history</div>` +
         `<div class="sub-scroll"><table class="sub"><thead><tr><th class="l">Season</th><th>G</th><th>Tgt</th><th>Rec</th><th>Yds</th><th>TD%</th>` +
         `<th class="l">REC·YDS</th><th class="l">REC·TD</th><th class="l">YDS·TD</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
}

function sortKey(p, key) {
  const v = get(p, key);
  return (typeof v === "string") ? v.toLowerCase() : (v ?? -Infinity);
}

function render() {
  if (!DATA) return;
  const q = document.getElementById("search").value.trim().toLowerCase();
  const minTgt = +document.getElementById("mintgt").value || 0;
  const minG = +document.getElementById("ming").value || 0;
  const pos = new Set(document.getElementById("possel").value.split(","));
  let rows = DATA.players.filter(p => pos.has(p.group) && p._g > 0 && p._g >= minG && (p._tgt || 0) >= minTgt);
  if (MODE === "week" && WEEK_IDS) rows = rows.filter(p => p.team_id && WEEK_IDS.has(p.team_id));
  if (q) rows = rows.filter(p => p.name.toLowerCase().includes(q));
  // Out players are always left off; counted after the other filters, so
  // the note says how many would otherwise show.
  const nOut = rows.filter(p => INJ.get(p.athlete_id)?.out).length;
  document.getElementById("outn").textContent = nOut ? `${nOut} OUT/IR hidden` : "";
  rows = rows.filter(p => !INJ.get(p.athlete_id)?.out);

  rows.sort((a,b) => {
    const av = sortKey(a, SORT.key), bv = sortKey(b, SORT.key);
    if (av === -Infinity || bv === -Infinity) return (av === -Infinity) - (bv === -Infinity);
    if (av < bv) return -SORT.dir; if (av > bv) return SORT.dir; return 0;
  });

  const thead = document.querySelector("#tbl thead");
  thead.innerHTML = "<tr>" + COLS.map(c => {
    const on = c.k === SORT.key ? "sorted " + (SORT.dir>0?"asc":"") : "";
    return `<th class="${c.l?'l ':''}${on}" data-k="${c.k}"${c.ht?` title="${esc(c.ht)}"`:""}>${c.h}</th>`;
  }).join("") + "</tr>";
  thead.querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (SORT.key === k) SORT.dir *= -1;
    else SORT = { key:k, dir: ["name","team_abbr","position"].includes(k) ? 1 : -1 };
    const sel = document.getElementById("sortsel");
    if ([...sel.options].some(o => o.value === k)) sel.value = k;
    syncPropsToSort();
    render();
  });

  const tbody = document.querySelector("#tbl tbody");
  tbody.innerHTML = rows.map(p => {
    const main = `<tr class="prow" data-id="${p.athlete_id}">` +
      COLS.map(c => {
        const kind = c.k === "name" ? "c-name" : c.l ? "c-tag" : c.k.startsWith("_plug.") ? "c-r" : "c-stat";
        const lab = kind === "c-stat" || kind === "c-r" ? ` data-label="${c.h.replace(/ r$/, "")}"` : "";
        return `<td class="${c.l?'l ':''}${kind}${c.k===SORT.key?' srt':''}"${lab}>${c.v(p)}</td>`;
      }).join("") + "</tr>";
    const det = EXPANDED.has(p.athlete_id)
      ? `<tr class="drow"><td colspan="${COLS.length}">${detailHTML(p)}</td></tr>` : "";
    return main + det;
  }).join("");
  tbody.querySelectorAll("tr.prow").forEach(tr => tr.onclick = () => {
    const id = tr.dataset.id;
    if (EXPANDED.has(id)) EXPANDED.delete(id); else EXPANDED.add(id);
    render();
  });
  tbody.querySelectorAll(".pb").forEach(initProp);

  document.getElementById("sortdir").textContent = SORT.dir < 0 ? "↓ High first" : "↑ Low first";
  document.getElementById("count").textContent =
    `${rows.length} player${rows.length===1?"":"s"}` + (MODE==="week" ? " this week" : "");
}

function setMode(m) {
  MODE = m;
  document.querySelectorAll("#toggle button").forEach(b =>
    b.classList.toggle("on", b.dataset.mode === m));
  render();
}

// Box stats shown in the left columns: BOX_SEASON games only. No games -> "—".
// The table's plug-in r's need a TD rate; they take the steadier one over
// every season, weighted like the r's (_tdAll), not this season's few games.
function blendBox() {
  DATA.players.forEach(p => {
    const gs = logOf(p).filter(g => g.s === BOX_SEASON);
    const n = gs.length;
    p._g = n;
    p._tgt = n ? gs.reduce((a, g) => a + g.tgt, 0) / n : null;
    p._rec = n ? gs.reduce((a, g) => a + g.rec, 0) / n : null;
    p._yds = n ? gs.reduce((a, g) => a + g.yds, 0) / n : null;
    p._td = n ? gs.filter(g => g.td >= 1).length / n : null;
    let w = 0, wt = 0;
    for (const g of logOf(p)) { w += gw(g); if (g.td >= 1) wt += gw(g); }
    p._tdAll = w ? wt / w : null;
    const plug = (key, b) => { const r = rhoOf(p, key); return r === null || b === null ? null : binCorr(r, 0.5, b); };
    p._plug = { rec_yds: plug("rec_yds", 0.5), rec_td: plug("rec_td", p._tdAll), yds_td: plug("yds_td", p._tdAll) };
  });
}

async function init() {
  try {
    const r = await fetch("./data/nfl_correlations.json");
    if (!r.ok) throw new Error("could not load data/nfl_correlations.json");
    DATA = await r.json();
  } catch (e) {
    document.getElementById("err").style.display = "block";
    document.getElementById("err").textContent = "Error: " + e.message +
      " — run scripts/nfl_fetch_correlations.py first.";
    return;
  }

  SW = DATA.weighting?.per_game_season_weights || {};
  BLEND = DATA.seasons || [];
  BOX_SEASON = BLEND[BLEND.length - 1];  // current season
  blendBox();

  document.getElementById("meta").textContent = `Box stats: ${BOX_SEASON} season`;

  // Live slate for the toggle; fall back to the baked snapshot.
  const live = await liveWeek();
  const wk = live || { ...DATA.schedule_week, live: false };
  WEEK_IDS = weekTeams(wk.games || []);
  renderSched(wk);

  document.querySelectorAll("#toggle button").forEach(b =>
    b.onclick = () => setMode(b.dataset.mode));
  document.getElementById("meta").onclick = e => e.currentTarget.classList.toggle("open");
  document.getElementById("search").oninput = render;
  document.getElementById("mintgt").oninput = render;
  document.getElementById("ming").oninput = render;
  document.getElementById("possel").onchange = render;
  document.getElementById("sortsel").onchange = e => {
    SORT = { key: e.target.value, dir: -1 }; syncPropsToSort(); render();
  };
  document.getElementById("sortdir").onclick = () => { SORT.dir *= -1; render(); };
  render();
  // The injury report lands after the first paint, then filters and badges.
  loadInjuries().then(render);
}
// The visible page width (no scrollbar), for .detail-wrap.
const setVw = () => document.documentElement.style.setProperty("--vw", document.documentElement.clientWidth + "px");
setVw();
addEventListener("resize", setVw);
init();
</script>
