// "Pinnacle main lines · 1:38 PM: PTS 21.5 o −115 / u −105 · REB 8.5 ..." for
// the legs the builder opened on; empty when neither came from Pinnacle.
function pinNote(st) {
  const legs = ["x", "y"].filter(a => st[a + "Pin"]);
  if (!PIN || !legs.length) return "";
  const txt = legs.map(a => { const L = st[a + "Pin"];
    return `${STAT_LABEL[st[a + "Stat"]]} ${L.line} o <b>${fmtAm(L.over)}</b> / u <b>${fmtAm(L.under)}</b>`; });
  const miss = ["x", "y"].filter(a => !st[a + "Pin"]).map(a => `${STAT_LABEL[st[a + "Stat"]]}: no Pinnacle line`);
  return `Pinnacle main lines · ${PIN.at}: ${[...txt, ...miss].join(" · ")}`;
}

// Price the four over/under combos of the builder's two lines. Leg odds are
// the Over's fair odds (e.g. Vulture's Fair column; Under = the complement); a leg
// left blank uses the player's weighted game-log hit rate instead.
// ---- 3rd leg -----------------------------------------------------------------
// Margin r of any two stats, oriented as corr(a, b). Pairs the data file
// carries use its shrunk r; the rest (REB·3PM, REB·AST, AST·3PM, ...) are
// computed here like price.py's shrunk_r: the player's recency-weighted,
// within-season r over every game, pulled toward rotation players in a
// similar role (binned on minutes, or REB / 3PM volume for the threes pairs).
const R_ORDER = ["pts", "reb", "ast", "tpm", "tot", "tm", "op"];
const R_COV = { "reb|ast":"min_mean", "reb|tpm":"reb_mean", "ast|tpm":"tpm_mean" };
const R_POOL = {};
function wcorrJS(q, a, b) {
  const by = {};
  for (const g of q.recent_games || []) if (g[a] != null && g[b] != null) (by[g.s] ||= []).push(g);
  let n = 0, sw = 0, sw2 = 0, sxy = 0, sxx = 0, syy = 0;
  for (const [season, v] of Object.entries(by)) {
    if (v.length < 3) continue;
    const ma = v.reduce((t, g) => t + g[a], 0) / v.length, mb = v.reduce((t, g) => t + g[b], 0) / v.length;
    const w = SW[season] || 0;
    for (const g of v) {
      const x = g[a] - ma, y = g[b] - mb;
      sxy += w * x * y; sxx += w * x * x; syy += w * y * y; sw += w; sw2 += w * w; n++;
    }
  }
  if (n < 10 || !sw || !sxx || !syy) return null;
  return { r: sxy / Math.sqrt(sxx * syy), n: sw * sw / sw2 };
}
function interpK(k, x) {
  if (x <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (x <= k[i][0]) {
    const [x0, y0] = k[i - 1], [x1, y1] = k[i];
    return x1 === x0 ? y0 : y0 + (y1 - y0) * (x - x0) / (x1 - x0);
  }
  return k[k.length - 1][1];
}
function pairR(p, a, b) {
  const [u, v] = [a, b].sort((s, t) => R_ORDER.indexOf(s) - R_ORDER.indexOf(t));
  const key = PAIR_KEY[`${u}|${v}`];
  if (key && p[key] && p[key].weighted.r !== null) return p[key].shrunk ? p[key].shrunk.r : p[key].weighted.r;
  const ck = `${u}|${v}`, cov = R_COV[ck] || "min_mean";
  if (!R_POOL[ck]) {
    const pool = [];
    for (const q of DATA.players) {
      if ((q.min_mean || 0) < 20 || (q.n_games || 0) < 40) continue;
      const c = wcorrJS(q, u, v);
      if (c) pool.push([q[cov] || 0, c.r, c.n]);
    }
    pool.sort((s, t) => s[0] - t[0]);
    const knots = [];
    for (let i = 0; i < 5; i++) {
      const bin = pool.slice(Math.floor(i * pool.length / 5), Math.floor((i + 1) * pool.length / 5));
      if (!bin.length) continue;
      const xs = bin.map(z => z[0]);
      knots.push([xs[Math.floor(xs.length / 2)], bin.reduce((t, z) => t + z[1], 0) / bin.length]);
    }
    const resid = pool.map(([x, r]) => r - interpK(knots, x));
    const noise = pool.reduce((t, [x, , n]) => t + (1 - interpK(knots, x) ** 2) ** 2 / n, 0) / pool.length;
    const tau2 = Math.max(resid.reduce((t, e) => t + e * e, 0) / resid.length - noise, 0.02 ** 2);
    R_POOL[ck] = { knots, tau2 };
  }
  const { knots, tau2 } = R_POOL[ck];
  if (!knots.length) return 0;
  const prior = interpK(knots, p[cov] || 0), c = wcorrJS(p, u, v);
  if (!c) return prior;
  const w = tau2 / (tau2 + (1 - prior * prior) ** 2 / c.n);
  return w * c.r + (1 - w) * prior;
}
// P(all three legs hit): ps are each leg's hit probability, R the margin
// correlations oriented the same way (an Under leg flips its signs). Same
// integral as price.py's tri_joint.
function triJoint(ps, R) {
  const [a, b, c] = ps.map(q => nppf(1 - q));
  const rab = R[0][1], rac = R[0][2], rbc = R[1][2];
  const sy = Math.sqrt(1 - rab * rab), sz = Math.sqrt(1 - rac * rac);
  const rc = Math.max(-0.999, Math.min(0.999, (rbc - rab * rac) / (sy * sz)));
  const n = 400, hi = Math.max(a, 0) + 9, step = (hi - a) / n;
  let tot = 0;
  for (let i = 0; i <= n; i++) {
    const x = a + i * step, h = (b - rab * x) / sy, k = (c - rac * x) / sz;
    const up = copulaJoint(rc, ncdf(-h), ncdf(-k));
    tot += Math.exp(-x * x / 2) / Math.sqrt(2 * Math.PI) * up * (i === 0 || i === n ? 1 : i % 2 ? 4 : 2);
  }
  return tot * step / 3;
}

function drawPricer(pb, p, games) {
  const el = pb.querySelector(".pr");
  if (!el) return;
  const st = propState(p);
  const xL = STAT_LABEL[st.xStat], yL = STAT_LABEL[st.yStat];
  const four = fourBoxes(st);
  el.querySelectorAll('[data-f="xFvU"],[data-f="yFvU"]').forEach(i => { i.closest(".fvw").style.display = four ? "" : "none"; });
  for (const [a, L] of [["x", xL], ["y", yL]]) {
    el.querySelector(`[data-lab="${a}"]`).textContent = `${L} o${st[a + "Line"]}`;
    el.querySelector(`[data-lab="${a}U"]`).textContent = `u${st[a + "Line"]}`;
  }
  const sub = el.querySelector(".pr-sub"), out = el.querySelector(".pr-out");
  const plugEl = pb.querySelector("[data-plug]");
  plugEl.innerHTML = "Devig r: —";
  plugEl.title = "";
  const pair = p[PAIR_KEY[`${st.xStat}|${st.yStat}`]];
  if (!pair || pair.weighted.r === null) {
    sub.textContent = `No ${xL}·${yL} correlation is computed, so these lines can't be priced together here.`;
    out.innerHTML = "";
    return;
  }
  const s = pair.shrunk, r = s ? s.r : pair.weighted.r;
  // {p: P(over), u: P(under)}. The boxes hold fair values. PTS+AST shows an
  // Over and an Under box per leg, each side used as entered (one left blank:
  // the complement); every other pair shows the Over only, Under = complement.
  // No box: game-log hit rate.
  const leg = (stat, line, ot, ut) => {
    const o = oddsProb(ot), u = four ? oddsProb(ut) : null;
    if (o !== null && u !== null) return { p: o, u, fv: true };
    if (o !== null) return { p: o, u: 1 - o, fv: true };
    if (u !== null) return { p: 1 - u, u, fv: true };
    let w = 0, wo = 0;
    for (const g of games) {
      if (g[stat] === line) continue;
      w += gw(g); if (g[stat] > line) wo += gw(g);
    }
    return { p: w ? wo / w : null, u: w ? 1 - wo / w : null, fv: false };
  };
  const X = leg(st.xStat, st.xLine, st.xFv, st.xFvU), Y = leg(st.yStat, st.yLine, st.yFv, st.yFvU);
  const src = X.fv && Y.fv ? "both legs from the fair odds entered"
    : !X.fv && !Y.fv ? "legs from the game-log hit rates until fair odds are entered"
    : `${X.fv ? yL : xL} leg from the game-log hit rate until its fair odds are entered`;
  sub.innerHTML = `r <b>${num(r, 3)}</b>`;
  if (X.p === null || Y.p === null || X.p <= 0 || X.p >= 1 || Y.p <= 0 || Y.p >= 1) {
    out.innerHTML = `<div class="pb-note">Not enough games on both sides of a line to price it; enter fair odds.</div>`;
    return;
  }
  const jo = pairJoint(st.xStat, st.xLine, st.yStat, st.yLine, r, X.p, Y.p, true);
  const plug = (jo - X.p * Y.p) / Math.sqrt(X.p * (1 - X.p) * Y.p * (1 - Y.p));
  const sgn = v => `${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(3)}`;
  // One number: the r to type into the devig tool's Correlation box. An
  // Over/Under mix gets its own (the tool's room differs on the downside);
  // the phi-formula plug-in r stays in the tooltip for other calculators.
  const mixJ = pairJoint(st.xStat, st.xLine, st.yStat, st.yLine, r, X.p, Y.u, false);
  const mixPlug = (mixJ - X.p * Y.u) / Math.sqrt(X.p * (1 - X.p) * Y.u * (1 - Y.u));
  plugEl.innerHTML = `Devig r: <b>${sgn(devigR(jo, X.p, Y.p))}</b>` +
    ` <span class="muted">(Over/Under mix ${sgn(devigR(mixJ, X.p, Y.u))})</span>`;
  plugEl.dataset.two = "1";
  plugEl.title = "Type this into the devig tool's Correlation box with the two legs' fair odds; " +
    "it returns the same fair odds as the pricer below. " +
    `For a calculator using joint = pA·pB + r·√(pA(1−pA)·pB(1−pB)) instead, use ${sgn(plug)} (mix ${sgn(mixPlug)}).`;
  // Each combo has its own SGP price (a book prices O/O and O/U separately).
  const pays = st.pays ||= {};
  // 3rd leg (Over only): a three-leg row under the pairs, and the devig
  // tool's "<FV>=<legs>" Correlation string, which makes it return this FV.
  const zLab = el.querySelector('[data-lab="z"]');
  if (zLab) zLab.textContent = st.zStat ? `${STAT_LABEL[st.zStat]} o${st.zLine}` : "";
  let tri = null;
  if (st.zStat && st.zStat !== st.xStat && st.zStat !== st.yStat) {
    const Z = leg(st.zStat, st.zLine, st.zFv, "");
    if (Z.p !== null && Z.p > 0 && Z.p < 1) {
      const L = [[st.xStat, st.xLine, X.p], [st.yStat, st.yLine, Y.p], [st.zStat, st.zLine, Z.p]];
      // A 3PM Over that forces the PTS Over (3 x threes > PTS line) drops the
      // PTS leg: the parlay is just 3PM and the other leg.
      const ti = L.findIndex(l => l[0] === "tpm"), pi = L.findIndex(l => l[0] === "pts");
      let j;
      if (ti >= 0 && pi >= 0 && tpmForcesPts("pts", L[pi][1], "tpm", L[ti][1])) {
        const o = [0, 1, 2].find(i => i !== ti && i !== pi);
        j = copulaJoint(pairR(p, L[ti][0], L[o][0]), L[ti][2], L[o][2]);
      } else {
        const R = L.map((u, i) => L.map((v, k) => i === k ? 1 : pairR(p, u[0], v[0])));
        j = triJoint(L.map(l => l[2]), R);
      }
      tri = { j, L, Z };
    }
  }
  const triRow = () => {
    if (!tri) return "";
    const { j, L } = tri, legsAm = L.map(l => fairOdds(l[2])).join(",");
    return `<tr data-j="${j}"><td class="l">${L.map(l => `${STAT_LABEL[l[0]]} <b>o${l[1]}</b>`).join(" &amp; ")}</td>` +
      `<td class="fv">${fairOdds(j)}</td>` +
      `<td><input type="text" inputmode="decimal" placeholder="price" class="payin${st.payGot?.tri ? " got" : ""}" value="${pays.tri || ""}" data-pay="tri"></td>` +
      `<td data-ev>${evCell(j, pays.tri)}</td><td>${(1 / j).toFixed(2)}x</td>` +
      `<td>${pct(j)}</td><td class="dvr" title="Devig tool: Leg Odds ${legsAm} and Correlation ${fairOdds(j)}=${legsAm}">3-leg</td>` +
      `<td>${L.map(l => pct(l[2])).join(" · ")}</td></tr>`;
  };
  const pct = v => `${(100 * v).toFixed(1)}%`;
  const row = (xo, yo) => {
    const k = (xo ? "o" : "u") + (yo ? "o" : "u");
    const a = xo ? X.p : X.u, b = yo ? Y.p : Y.u;
    // An Over/Under combo flips the sign of r.
    const j = pairJoint(st.xStat, st.xLine, st.yStat, st.yLine, r, a, b, xo === yo);
    const corr = (j - a * b) / Math.sqrt(a * (1 - a) * b * (1 - b));
    const dv = devigR(j, a, b);
    return `<tr data-j="${j}"><td class="l">${xL} <b>${xo ? "o" : "u"}${st.xLine}</b> &amp; ${yL} <b>${yo ? "o" : "u"}${st.yLine}</b></td>` +
      `<td class="fv">${fairOdds(j)}</td>` +
      `<td><input type="text" inputmode="decimal" class="payin${st.payGot?.[k] ? " got" : ""}" placeholder="price" value="${pays[k] || ""}" data-pay="${k}"></td>` +
      `<td data-ev>${evCell(j, pays[k])}</td><td>${(1 / j).toFixed(2)}x</td>` +
      `<td>${pct(j)}</td><td class="dvr" title="phi-formula r: ${corr >= 0 ? "+" : ""}${corr.toFixed(3)}">${dv >= 0 ? "+" : ""}${dv.toFixed(3)}</td><td>${pct(a)} · ${pct(b)}</td></tr>`;
  };
  out.innerHTML = `<table class="sub"><thead><tr><th class="l">Combo</th><th>Fair odds</th>` +
    `<th title="The price on your slip (4.14x or +314); Novig SGP fills Novig's.">SGP odds</th><th>EV</th><th>Fair x</th><th>Fair %</th><th title="The r to type into the devig tool's Correlation box; it returns this row's fair odds. Hover a cell for the phi-formula r other calculators use.">Devig r</th><th>Legs</th></tr></thead><tbody>` +
    // Over+Over only; PTS+AST (its 4 fair boxes) adds the two Over/Under mixes.
    row(true, true) + (four ? row(true, false) + row(false, true) : "") + triRow() + `</tbody></table>`;
  if (tri) {
    const legsAm = tri.L.map(l => fairOdds(l[2])).join(",");
    plugEl.innerHTML += `<br>3-leg devig tool: Leg Odds <b>${legsAm}</b> · Correlation <b>${fairOdds(tri.j)}=${legsAm}</b>`;
  }
  // Typing a price updates that row's EV only, so the input keeps focus.
  out.querySelectorAll("[data-pay]").forEach(inp => inp.oninput = () => {
    pays[inp.dataset.pay] = inp.value.trim();
    if (st.payGot) delete st.payGot[inp.dataset.pay];   // typed over: no longer Novig's
    inp.classList.remove("got");
    const tr = inp.closest("tr");
    tr.querySelector("[data-ev]").innerHTML = evCell(+tr.dataset.j, pays[inp.dataset.pay]);
  });
}

// A slip price -> decimal: "4.14" / "4.14x" as decimal, "+314" / "-120" (or
// any |v| >= 100) as American. null if it isn't a price.
function payDecimal(txt) {
  const t = String(txt || "").replace(/\s|x$/gi, "");
  const v = parseFloat(t);
  if (!Number.isFinite(v)) return null;
  if (/^[+-]/.test(t) || Math.abs(v) >= 100) {
    if (Math.abs(v) < 100) return null;
    return v > 0 ? 1 + v / 100 : 1 + 100 / -v;
  }
  return v > 1 ? v : null;
}

// EV at the slip's price for a combo with fair probability j.
function evCell(j, txt) {
  const d = payDecimal(txt);
  if (d === null) return "—";
  const ev = d * j - 1;
  return `<span style="color:${ev >= 0 ? "var(--pos)" : "var(--neg)"}">${ev >= 0 ? "+" : ""}${(100 * ev).toFixed(1)}%</span>`;
}

// ---- Novig fair values -------------------------------------------------------
// Novig's public catalog (official API, no key, CORS open): every open pregame
// NBA prop with each outcome's best bid. The Over ask is 1 - the Under bid, so
// the two asks are a two-way price whose vig is the spread; each side's fair
// is its worst-case devig (devigWorst), a hair under the mid on a tight book.
// The app shows asks (O 91% / U 15% = 106%), never fair values. Pregame game markets charge
// no taker fee. Wide books (thin alts, some out of order with the ladder) are
// not priced from; same rule as .claude/skills/nba-sgp-fv/novig.py.
const NV_URL = "https://api.novig.com/v3/public/catalog/markets";
const NV_TYPES = { pts:"POINTS", reb:"REBOUNDS", ast:"ASSISTS", tpm:"THREE_POINTERS_MADE" };
const NV_MAX_SPREAD = 0.04;
let NV_CACHE = null;  // { t, items }: one slate pull serves every player for a minute

async function novigMarkets() {
  if (NV_CACHE && Date.now() - NV_CACHE.t < 60e3) return NV_CACHE.items;
  const items = [];
  let after = null;
  for (let i = 0; i < 20; i++) {
    const q = new URLSearchParams({ league:"NBA", marketType:Object.values(NV_TYPES).join(","),
                                    eventStatus:"OPEN_PREGAME", limit:"5000" });
    if (after) q.set("after", after);
    const res = await fetch(`${NV_URL}?${q}`);
    if (!res.ok) throw new Error(`Novig answered ${res.status}`);
    const page = await res.json();
    items.push(...(page.items || []));
    after = page.next;
    if (!after) break;
  }
  NV_CACHE = { t: Date.now(), items };
  return items;
}

// Match key: "Darius Acuff Jr." / "Nikola Jokić" / "P.J. Washington" ->
// "dariusacuff" / "nikolajokic" / "pjwashington". Periods and apostrophes
// drop out and spaces don't count, so "P.J." (ESPN) meets "PJ" (Novig).
const nvNorm = s => s.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
  .replace(/['.]/g, "").replace(/[^a-z0-9 ]/g, " ").split(/\s+/)
  .filter(w => w && !["jr", "sr", "ii", "iii", "iv", "v"].includes(w)).join("")
  .replace(/^.*$/, k => NV_ALIAS[k] || k);
// Novig's full name -> ESPN's short one, where they differ (same table in novig.py).
const NV_ALIAS = { alexandresarr: "alexsarr" };

// { stat: [{line, bid, ask, mid, spread, vol}] } for the player, or null.
function novigLadder(items, name) {
  const want = nvNorm(name);
  const who = m => m.description.split(" ").slice(0, -2).join(" ");
  const names = [...new Set(items.map(who))];
  let hit = names.filter(n => nvNorm(n) === want);
  if (!hit.length) hit = names.filter(n => nvNorm(n).includes(want));
  if (hit.length !== 1) return null;
  const stat = Object.fromEntries(Object.entries(NV_TYPES).map(([k, v]) => [v, k]));
  const out = {};
  for (const m of items) {
    if (who(m) !== hit[0] || !stat[m.marketType]) continue;
    const side = Object.fromEntries(m.outcomes.map(o => [o.name.split(" ")[0].toLowerCase(), o]));
    const bid = side.over?.bid ? +side.over.bid.price : null;
    const ask = side.under?.bid ? 1 - side.under.bid.price : null;
    const two = bid !== null && ask !== null;
    (out[stat[m.marketType]] ||= []).push({ line: +m.strike, bid, ask, vol: m.volume,
      ids: { o: side.over?.outcomeId, u: side.under?.outcomeId },
      mid: two ? (bid + ask) / 2 : null, spread: two ? ask - bid : null,
      // The two sides' asks are a two-way price whose vig is the spread.
      fair: two ? devigWorst(ask, 1 - bid) : null });
  }
  for (const v of Object.values(out)) v.sort((a, b) => a.line - b.line);
  return out;
}

const nvTight = r => r.spread !== null && r.spread <= NV_MAX_SPREAD + 1e-9;

// Fill each leg's Over fair odds from Novig at its line. A leg whose line is
// missing or too wide is left alone, with Novig's tight lines as chips: a
// click moves the line there and fills its fair odds.
async function fetchNovig(pb, p) {
  const btn = pb.querySelector("[data-novig]"), msg = pb.querySelector(".nv-out");
  const say = (cls, html) => { msg.classList.add("rep"); msg.innerHTML = `<div class="nv-st ${cls}">${html}</div>`; };
  btn.disabled = true;
  btn.textContent = "Fetching…";
  say("busy", "Asking Novig for fair odds…");
  const idle = () => { btn.disabled = false; btn.textContent = "Fetch FV"; };
  let lad;
  try {
    lad = novigLadder(await novigMarkets(), p.name);
  } catch (e) {
    idle();
    return say("warn", `<b class="w">Nothing filled.</b> Couldn't reach Novig (${e.message}).`);
  }
  idle();
  if (!lad) return say("warn", `<b class="w">Nothing filled.</b> ${p.name} isn't on Novig's open pregame props right now.`);
  const st = propState(p);
  const time = new Date().toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
  const cents = r => `${(100 * r.spread).toFixed(1)}¢`;
  // "PTS 17.5 filled: over -113 / under +105 · 1.0¢ wide" for the line in use.
  const used = (a, r) => `<b class="w">${STAT_LABEL[st[a + "Stat"]]} ${r.line} filled:</b> over <b>${fairOdds(r.fair[0])}</b> / under <b>${fairOdds(r.fair[1])}</b>` +
    ` <span class="muted" title="Worst-case devig of Novig's two asks; mid ${(100 * r.mid).toFixed(1)}%, ${(100 * r.bid).toFixed(1)}–${(100 * r.ask).toFixed(1)}">· ${cents(r)} wide${nvTight(r) ? "" : ", rough"}</span>`;
  const byChip = {};
  const fill = (a, r) => {
    st.auto = false;          // the user's now: Pinnacle landing later won't reset it
    st[a + "Pin"] = null;
    clearTyped(st, a);
    for (const [u, q] of [["", r.fair[0]], ["U", r.fair[1]]]) {
      st[a + "Fv" + u] = fairOdds(q);
      const box = pb.querySelector(`[data-f="${a}Fv${u}"]`);
      box.value = st[a + "Fv" + u];
      box.classList.add("got");
    }
  };
  const legs = ["x", "y", ...(st.zStat ? ["z"] : [])];
  const lines = legs.map(a => {
    const stat = st[a + "Stat"], line = st[a + "Line"], lab = `${STAT_LABEL[stat]} ${line}`;
    const no = why => `<b class="w">${lab} not filled:</b> ${why}`;
    if (!NV_TYPES[stat]) return `<div class="nv-st warn">${no(`Novig doesn't list ${STAT_LABEL[stat].toLowerCase()} props.`)}</div>`;
    const rows = lad[stat] || [], at = rows.find(r => r.line === line);
    if (at && nvTight(at)) {
      fill(a, at);
      return `<div class="nv-st ok" data-nvh="${a}">${used(a, at)}</div>`;
    }
    const why = !at ? `Novig has no line at ${line}.`
      : at.mid === null ? `Novig's ${line} is one-sided.`
      : `Novig's ${line} is ${cents(at)} wide, too wide to trust.`;
    // Wide books stay pickable, dashed and with their spread: the mid is shaky
    // but sometimes it's the only line near the slip's.
    const two = rows.filter(r => r.mid !== null);
    const chips = two.map(r => {
      const w = !nvTight(r);
      byChip[`${a}|${r.line}`] = r;
      return `<button type="button" class="nv-chip${w ? " wide" : ""}" data-nv="${a}|${r.line}"` +
        ` title="${(100 * r.bid).toFixed(1)}–${(100 * r.ask).toFixed(1)}, ${cents(r)} wide${w ? " (rough)" : ""} · vol ${r.vol.toLocaleString()}">` +
        `o${r.line} <b>${fairOdds(r.fair[0])}</b>${w ? ` <small>${cents(r)} wide</small>` : ""}</button>`;
    }).join("");
    return `<div class="nv-st warn" data-nvh="${a}">${no(why)}</div>` +
      `<div class="nv-pick">${two.length ? `Tap a Novig line to switch ${STAT_LABEL[stat]} to it: ${chips}` : "Novig has no two-sided line for this stat."}</div>`;
  });
  const head = () => {
    const n = msg.querySelectorAll(".nv-st.ok").length;
    msg.querySelector(".nv-h").innerHTML = `<b>Fetch FV</b> · Novig ${time} · ${n === legs.length ? `all ${n}` : `${n} of ${legs.length}`} legs filled`;
  };
  msg.classList.add("rep");
  msg.innerHTML = `<div class="nv-h"></div>` + lines.map(l => `<div class="nv-leg">${l}</div>`).join("");
  head();
  msg.querySelectorAll("[data-nv]").forEach(c => c.onclick = () => {
    const [a, line] = c.dataset.nv.split("|");
    st[a + "Line"] = +line;
    st.pays = {}; st.payGot = {};   // SGP prices belonged to the old line
    const sg = pb.querySelector(".nvp-out");
    sg.textContent = ""; sg.classList.remove("rep");
    pb.querySelector(`[data-f="${a}Line"]`).value = line;
    fill(a, byChip[`${a}|${line}`]);
    msg.querySelectorAll(`[data-nv^="${a}|"]`).forEach(o => o.classList.toggle("on", o === c));
    // The status line now describes the line the chip moved to.
    const h = msg.querySelector(`[data-nvh="${a}"]`);
    h.className = "nv-st ok";
    h.innerHTML = used(a, byChip[`${a}|${line}`]);
    head();
    drawProp(pb, p);
  });
  drawPricer(pb, p, logOf(p).filter(g => g[st.xStat] != null && g[st.yStat] != null));
}

// ---- Novig SGP prices --------------------------------------------------------
// Novig's keyless parlay quote (docs.novig.com/affiliates/parlay-pricing, CORS
// open): outcome IDs in, one implied probability out. 10-request burst per
// IP, then 1 a second; a quote is reused until it expires (about 30 s). Same
// call as novig.py's parlay().
// The quote is before Novig's parlay taker fee, 0.10 x stake x (1 - price) on
// top of the stake (docs.novig.com/fees, "RFQ trades"). The order slip shows
// the multiplier after it, and that is the price used here: quote 0.218 is
// 4.59x raw (what Pikkit shows, +359) and 4.25x on the slip.
const NV_RFQ = "https://api.novig.com/rfq/v2/quote/unauthenticated";
const NV_RFQ_FEE = 0.10;
const nvSlipX = prob => 1 / (prob * (1 + NV_RFQ_FEE * (1 - prob)));
const NV_QUOTES = {};  // ids joined -> { price, until }

// { price } (the slip's multiplier, after the fee) or { why }.
async function novigQuote(ids) {
  const key = ids.join(","), hit = NV_QUOTES[key];
  if (hit && Date.now() < hit.until) return { price: hit.price };
  for (let i = 0; i < 3; i++) {
    const res = await fetch(NV_RFQ, { method:"POST", headers:{ "Content-Type":"application/json" },
                                      body: JSON.stringify({ outcomeIds: ids }) });
    if (res.status === 429) {
      await new Promise(r => setTimeout(r, 1000 * (+res.headers.get("Retry-After") || 2)));
      continue;
    }
    if (res.status === 404) return { why: "no price right now" };
    if (!res.ok) return { why: res.status === 400 ? "legs can't be combined" : `Novig answered ${res.status}` };
    const q = await res.json(), prob = +q.price;
    if (!(prob > 0 && prob < 1)) return { why: "no price right now" };
    NV_QUOTES[key] = { price: nvSlipX(prob), until: Date.now() + (q.expiresAt - q.serverNow) };
    return { price: nvSlipX(prob) };
  }
  return { why: "rate limited, try again" };
}

// Fill the SGP odds box of every combo on the pricer with Novig's parlay
// price at the builder's lines; EV follows from the row's fair value.
async function fetchNovigSgp(pb, p) {
  const btn = pb.querySelector("[data-nvsgp]"), msg = pb.querySelector(".nvp-out");
  const st = propState(p);
  const snap = JSON.stringify(["x", "y", "z"].map(a => [st[a + "Stat"], st[a + "Line"]]));
  const line = (cls, html) => `<div class="nv-st ${cls}">${html}</div>`;
  btn.disabled = true;
  btn.textContent = "Asking…";
  msg.classList.add("rep");
  msg.innerHTML = line("busy", "Asking Novig for its parlay price…");
  const done = html => {
    msg.innerHTML = html; msg.classList.toggle("rep", !!html);
    btn.disabled = false; btn.textContent = "Novig SGP";
  };
  const fail = why => done(line("warn", `<b class="w">No SGP price filled.</b> ${why}`));
  let lad;
  try {
    lad = novigLadder(await novigMarkets(), p.name);
  } catch (e) {
    return fail(`Couldn't reach Novig (${e.message}).`);
  }
  if (!lad) return fail(`${p.name} isn't on Novig's open pregame props right now.`);
  const legs = ["x", "y", ...(st.zStat ? ["z"] : [])];
  const at = {}, miss = [];
  for (const a of legs) {
    at[a] = (lad[st[a + "Stat"]] || []).find(r => r.line === st[a + "Line"]);
    if (!at[a]) miss.push(`${STAT_LABEL[st[a + "Stat"]]} ${st[a + "Line"]}`);
  }
  const combos = [["oo", "xo yo"], ...(fourBoxes(st) ? [["ou", "xo yu"], ["uo", "xu yo"]] : []),
                  ...(st.zStat ? [["tri", "xo yo zo"]] : [])];
  const parts = [];
  const pays = st.pays ||= {}, got = st.payGot ||= {};
  try {
    for (const [k, spec] of combos) {
      const picks = spec.split(" ").map(t => [t[0], t[1]]);
      const lab = picks.map(([a, o]) => `${STAT_LABEL[st[a + "Stat"]]} ${o}${st[a + "Line"]}`).join(" & ");
      if (picks.some(([a]) => !at[a])) continue;   // named once, below
      const ids = picks.map(([a, o]) => at[a].ids[o]);
      if (ids.some(id => !id)) { parts.push(line("warn", `<b class="w">${lab} not priced:</b> Novig doesn't offer it.`)); continue; }
      const q = await novigQuote(ids);
      if (q.price) {
        pays[k] = `${q.price.toFixed(2)}x`;
        got[k] = true;
        parts.push(line("ok", `<b class="w">${lab}:</b> Novig's slip pays <b>${q.price.toFixed(2)}x</b> (${fairOdds(1 / q.price)}), filled into SGP odds`));
      } else parts.push(line("warn", `<b class="w">${lab} not priced:</b> ${q.why}.`));
    }
  } catch (e) {
    return fail(`Couldn't reach Novig (${e.message}).`);
  }
  // Lines or stats changed while Novig was answering: the prices aren't theirs.
  if (snap !== JSON.stringify(["x", "y", "z"].map(a => [st[a + "Stat"], st[a + "Line"]]))) {
    st.pays = {}; st.payGot = {};
    return done("");
  }
  if (miss.length) parts.push(line("warn", `<b class="w">No SGP price filled.</b> Novig has no line at ${miss.join(" or ")}. ` +
    `Tap <b>Fetch FV</b>, pick one of Novig's lines, then tap Novig SGP again.`));
  const time = new Date().toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
  done(`<div class="nv-h"><b>Novig SGP</b> · ${time} · slip price, after its 10% parlay fee</div>` + parts.join(""));
  drawPricer(pb, p, logOf(p).filter(g => g[st.xStat] != null && g[st.yStat] != null));
}

// Bind builder controls + first draw. Input changes redraw only this builder
// (no full table re-render, so typing keeps focus).
function initProp(pb) {
  const p = DATA.players.find(x => x.athlete_id === pb.dataset.id);
  if (!p) return;
  pb.querySelectorAll("[data-f]").forEach(el => {
    const f = el.dataset.f;
    const h = () => {
      const st = propState(p);
      st.auto = false;
      if (/^[xyz]FvU?$/.test(f)) {
        // Pricer inputs: keep the raw text (odds can be negative), reprice only.
        st[f] = el.value.trim();
        el.classList.remove("got");
        st.typed = st.typed || {};
        st.typed[f] = true;
        const other = f.endsWith("U") ? f.slice(0, -1) : f + "U";
        if (!st.typed[other] && st[other]) {
          st[other] = "";
          const oIn = pb.querySelector(`[data-f="${other}"]`);
          if (oIn) oIn.value = "";
        }
        drawPricer(pb, p, logOf(p).filter(g => g[st.xStat] != null && g[st.yStat] != null));
        return;
      }
      // A new stat or line makes that leg's entered fair odds and the
      // combos' SGP prices stale.
      const a = f[0];
      st.pays = {}; st.payGot = {};
      pb.querySelector(".nvp-out").textContent = "";
      pb.querySelector(".nvp-out").classList.remove("rep");
      st[a + "Pin"] = null;
      clearTyped(st, a);
      for (const u of ["", "U"]) {
        st[a + "Fv" + u] = "";
        const fvIn = pb.querySelector(`[data-f="${a}Fv${u}"]`);
        if (fvIn) { fvIn.value = ""; fvIn.classList.remove("got"); }
      }
      if (f === "zStat") {
        st.zStat = el.value;
        if (st.zStat) setLeg(st, "z", p, st.zStat);
        pb.outerHTML = propHTML(p);
        initProp(document.querySelector(`.pb[data-id="${p.athlete_id}"]`));
        return;
      }
      if (f === "xStat" || f === "yStat") {
        // The 3rd leg can't repeat a stat now on the builder.
        if (st.zStat === el.value) st.zStat = "";
        // New stat -> its Pinnacle main line and prices, else the line under
        // the blended mean; relabel the input.
        st[f] = el.value;
        setLeg(st, a, p, el.value);
        for (const u of ["", "U"]) {
          const fvIn = pb.querySelector(`[data-f="${a}Fv${u}"]`);
          if (fvIn) fvIn.value = st[a + "Fv" + u];
        }
        const inp = pb.querySelector(`[data-f="${a}Line"]`);
        inp.value = st[a + "Line"];
        inp.parentElement.firstChild.textContent = STAT_LABEL[el.value] + " line";
        pb.querySelector(".nv-out").classList.remove("rep");
        pb.querySelector(".nv-out").innerHTML = pinNote(st);
        pb.querySelector('[data-f="zStat"]').innerHTML = zOpts(st);
        if (!st.zStat) pb.querySelectorAll(".zon").forEach(e => e.style.display = "none");
        // Game counts in the subtitle depend on which games have a score.
        if (f === "xStat") {
          pb.outerHTML = propHTML(p);
          initProp(document.querySelector(`.pb[data-id="${p.athlete_id}"]`));
          return;
        }
      } else {
        const v = parseFloat(el.value);
        if (!Number.isFinite(v) || v < 0) return;
        st[f] = v;
      }
      drawProp(pb, p);
    };
    el.tagName === "SELECT" ? el.onchange = h : el.oninput = h;
  });
  // ± flips an odds box between + and −: phone number pads have no minus key.
  pb.querySelectorAll(".sgn").forEach(btn => btn.onclick = () => {
    const inp = pb.querySelector(`[data-f="${btn.dataset.sgn}"]`);
    const v = inp.value.trim().replace(/^\+/, "");
    inp.value = v.startsWith("-") ? v.slice(1) : "-" + v;
    inp.dispatchEvent(new Event("input"));
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
  });
  pb.querySelectorAll(".stp").forEach(btn => btn.onclick = e => {
    e.preventDefault();
    const inp = pb.querySelector(`[data-f="${btn.dataset.stp}"]`);
    const v = parseFloat(inp.value);
    inp.value = Math.max(0.5, (Number.isFinite(v) ? v : 0.5) + +btn.dataset.d);
    inp.dispatchEvent(new Event("input"));
  });
  // Tapping a line box selects it, so typing replaces the old line.
  pb.querySelectorAll('input[type=number][data-f$="Line"]').forEach(inp => inp.onfocus = () => inp.select());
  pb.querySelector("[data-novig]").onclick = () => fetchNovig(pb, p);
  pb.querySelector("[data-nvsgp]").onclick = () => fetchNovigSgp(pb, p);
  drawProp(pb, p);
}

// Expanded per-season history block (rendered in a full-width detail row).
function detailHTML(p) {
  const yrs = Object.keys(p.by_season||{}).sort();
  const keys = ["pts_reb", "pts_ast", "pts_3pm", ...(scoreOn() ? ["tot_reb", "tm_reb", "op_reb"] : [])];
  const heads = { pts_reb:"PTS·REB", pts_ast:"PTS·AST", pts_3pm:"PTS·3PM", tot_reb:"TOT·REB", tm_reb:"TM·REB", op_reb:"OPP·REB" };
  let body = yrs.map(y => {
    const s = p.by_season[y];
    const sg = s.short_games ? ` <span class="muted" title="of which short-minute games (under 60% of his median minutes); they count in the r's">(${s.short_games} short)</span>` : "";
    return `<tr><td class="l"><b>${y}</b></td><td>${s.games}${sg}</td><td>${num(s.min_mean,1)}</td>`+
           `<td>${num(s.pts_mean,1)}</td><td>${num(s.reb_mean,1)}</td><td>${num(s.ast_mean,1)}</td><td>${num(s.tpm_mean,1)}</td>`+
           keys.map(k => `<td class="l">${rMini(s[k])}</td>`).join("") + `</tr>`;
  }).join("");
  // Pooled (all seasons, recency-weighted) reference row.
  body += `<tr class="pool"><td class="l" title="Each season is centered on its own average before pooling, so a season where his role moved every stat up or down together can't fake a correlation"><b>Pooled</b></td>`+
          `<td>${p.n_games}</td><td>${num(p.min_mean,1)}</td>`+
          `<td>${num(p.pts_mean,1)}</td><td>${num(p.reb_mean,1)}</td><td>${num(p.ast_mean,1)}</td><td>${num(p.tpm_mean,1)}</td>`+
          keys.map(k => `<td class="l">${rCell(p, k, 1)}</td>`).join("") + `</tr>`;
  return `<div class="detail-wrap">${propHTML(p)}<div class="detail-h">By season · underlined = p &lt; 0.05 · pooled row is recency-weighted within season, effective sample ${num(p.effective_n,1)} games</div>`+
         `<div class="sub-scroll"><table class="sub"><thead><tr><th class="l">Season</th><th>G</th><th>Min</th><th>Pts</th><th>Reb</th><th>Ast</th><th>3PM</th>`+
         keys.map(k => `<th class="l">${heads[k]}</th>`).join("") + `</tr></thead><tbody>${body}</tbody></table></div></div>`;
}

function sortKey(p, key) {
  // r columns sort by the r on screen (Pinnacle lines or median).
  if (key.includes(".")) { const v = rShown(p, key.split(".")[0]); return v===null?-Infinity:v; }
  const v = get(p, key); return (typeof v==="string") ? v.toLowerCase() : (v??-Infinity);
}

function render() {
  if (!DATA) return;
  const q = document.getElementById("search").value.trim().toLowerCase();
  const minMpg = +document.getElementById("minmpg").value || 0;
  const minG = +document.getElementById("ming").value || 0;
  // No baked-in filtering: show everyone (negative correlations included).
  // The two inputs are optional, off by default (0). Filter on the blended
  // blended multi-season figures that the left columns display.
  let rows = DATA.players.filter(p => p._g > 0 && p._g >= minG && (p._min||0) >= minMpg);
  if (MODE === "today") {
    const ids = TODAY_IDS || snapshotIds();
    rows = rows.filter(p => p.team_id && ids.has(p.team_id));
  }
  if (q) rows = rows.filter(p => p.name.toLowerCase().includes(q));
  // Out players are always left off; counted after the other filters, so
  // the note says how many would otherwise show.
  const nOut = rows.filter(p => INJ.get(p.athlete_id)?.out).length;
  document.getElementById("outn").textContent = nOut ? `${nOut} OUT hidden` : "";
  rows = rows.filter(p => !INJ.get(p.athlete_id)?.out);
  setColStats(rows);

  rows.sort((a,b) => {
    const av = sortKey(a, SORT.key), bv = sortKey(b, SORT.key);
    if (av === -Infinity || bv === -Infinity) return (av === -Infinity) - (bv === -Infinity);
    if (av < bv) return -SORT.dir; if (av > bv) return SORT.dir; return 0;
  });

  const cols = visCols();
  document.getElementById("tbl").classList.toggle("narrow", !scoreOn());
  document.getElementById("scorecols").checked = scoreOn();
  const thead = document.querySelector("#tbl thead");
  thead.innerHTML = "<tr>" + cols.map(c => {
    const on = c.k === SORT.key ? "sorted " + (SORT.dir>0?"asc":"") : "";
    return `<th class="${c.l?'l ':''}${c.grp?'grp ':''}${on}" data-k="${c.k}"${c.ht?` title="${c.ht}"`:""}>${c.h}</th>`;
  }).join("") + "</tr>";
  thead.querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (SORT.key === k) SORT.dir *= -1;
    else SORT = { key:k, dir: ["name","team_abbr","position"].includes(k) ? 1 : -1 };
    const sel = document.getElementById("sortsel");
    if ([...sel.options].some(o => o.value === k)) sel.value = k;
    syncPropsToSort();
    render();
  });

  const tbody = document.querySelector("#tbl tbody");
  tbody.innerHTML = rows.map(p => {
    const main = `<tr class="prow" data-id="${p.athlete_id}">` +
      cols.map(c => {
        const kind = c.k === "name" ? "c-name" : c.l ? "c-tag" : c.k.includes(".") ? "c-r" : "c-stat";
        const lab = kind === "c-stat" || kind === "c-r" ? ` data-label="${c.h}"` : "";
        return `<td class="${c.l?'l ':''}${c.grp?'grp ':''}${kind}${c.k===SORT.key?' srt':''}"${lab}>${c.v(p)}</td>`;
      }).join("") + "</tr>";
    const det = EXPANDED.has(p.athlete_id)
      ? `<tr class="drow"><td colspan="${cols.length}">${detailHTML(p)}</td></tr>` : "";
    return main + det;
  }).join("");
  tbody.querySelectorAll("tr.prow").forEach(tr => tr.onclick = () => {
    const id = tr.dataset.id;
    if (EXPANDED.has(id)) EXPANDED.delete(id); else EXPANDED.add(id);
    render();
  });
  tbody.querySelectorAll(".pb").forEach(initProp);

  document.getElementById("sortdir").textContent = SORT.dir < 0 ? "↓ High first" : "↑ Low first";
  document.getElementById("count").textContent =
    `${rows.length} player${rows.length===1?"":"s"}`;
  document.getElementById("count").title = MODE==="today" ? `Playing ${DAY}, game not started` : "";
}

// Baked-snapshot fallback: team ids for games whose start time is still
// ahead. The snapshot lists games by abbreviation, mapped to ids via players.
function snapshotIds() {
  const ab2id = new Map(DATA.players.filter(p => p.team_abbr && p.team_id).map(p => [p.team_abbr, p.team_id]));
  const now = Date.now(), ids = new Set();
  for (const g of DATA.schedule_today.games || [])
    if (!g.start || Date.parse(g.start) > now)
      (g.team_abbrs || []).forEach(a => ab2id.has(a) && ids.add(ab2id.get(a)));
  return ids;
}

function setMode(m) {
  MODE = m;
  document.querySelectorAll("#toggle button").forEach(b =>
    b.classList.toggle("on", b.dataset.mode === m));
  render();
}

// Box stats shown in the left columns: BOX_SEASON games only.
// Re-run when the short-minute toggle changes. No games -> "—".
function blendBox() {
  DATA.players.forEach(p => {
    const gs = logOf(p).filter(g => g.s === BOX_SEASON);
    // Per-field weight totals: game scores can be missing on a few games.
    const sum = { min:0, pts:0, reb:0, ast:0, tpm:0, tot:0, tm:0, op:0 };
    const w = { ...sum };
    for (const g of gs) {
      const k = gw(g);
      for (const f in sum) if (g[f] != null) { sum[f] += k * g[f]; w[f] += k; }
    }
    p._g = gs.length;
    for (const f in sum) p["_" + f] = w[f] ? sum[f] / w[f] : null;
    p._r = null;  // r's at season-average lines move with these means
  });
}

async function init() {
  try {
    const r = await fetch("./data/nba_correlations.json");
    if (!r.ok) throw new Error("could not load data/nba_correlations.json");
    DATA = await r.json();
  } catch (e) {
    document.getElementById("err").style.display = "block";
    document.getElementById("err").textContent = "Error: " + e.message +
      " — run scripts/nba_fetch_correlations.py first.";
    return;
  }

  SW = DATA.weighting?.per_game_season_weights || {};
  BLEND = DATA.recent_seasons || [];
  BOX_SEASON = BLEND[BLEND.length - 1];  // current season
  blendBox();

  const wtxt = Object.entries(SW).map(([k,v])=>`${k}: ${v}`).join(", ");
  document.getElementById("meta").textContent = `Box stats: ${BOX_SEASON} season · r at this season's averages (~)`;

  if (!await refreshSlate())
    renderSched(DATA.schedule_today.games.map(g=>({matchup:g.matchup, st:g.state})), false);
  // Re-check every 2 minutes so players drop off as their games tip.
  setInterval(async () => { await refreshSlate(); render(); }, 120000);

  document.querySelectorAll("#toggle button").forEach(b =>
    b.onclick = () => setMode(b.dataset.mode));
  document.getElementById("meta").onclick = e => e.currentTarget.classList.toggle("open");
  document.getElementById("search").oninput = render;
  document.getElementById("minmpg").oninput = render;
  document.getElementById("ming").oninput = render;
  document.getElementById("shortg").onchange = e => {
    SHOW_SHORT = e.target.checked; blendBox(); render();
  };
  document.getElementById("sortsel").onchange = e => {
    SORT = { key: e.target.value, dir: -1 }; syncPropsToSort(); render();
  };
  document.getElementById("sortdir").onclick = () => { SORT.dir *= -1; render(); };
  document.getElementById("scorecols").onchange = e => {
    SHOW_SCORE = e.target.checked;
    try { localStorage.setItem("nbaScoreCols", SHOW_SCORE ? "1" : "0"); } catch (_) {}
    // Turned off while sorted on one of them: back to the default sort.
    if (!SHOW_SCORE && scoreOn()) {
      SORT = { key: "pts_reb.shrunk", dir: -1 };
      document.getElementById("sortsel").value = SORT.key;
      syncPropsToSort();
    }
    render();
  };
  // The Options popover closes on a click anywhere else.
  document.addEventListener("click", e => {
    const o = document.getElementById("opts");
    if (o.open && !o.contains(e.target)) o.open = false;
  });
  render();
  // The injury report lands after the first paint, then filters and badges.
  loadInjuries().then(render);
  // Pinnacle's main lines land after the first paint too: the r columns move
  // to them, and builders still on their defaults reopen on them.
  loadPinnacle().then(() => {
    if (!PIN) return;
    document.getElementById("meta").textContent =
      `Box stats: ${BOX_SEASON} season · r at Pinnacle main lines (@, ${PIN.at}, ${PIN.n} players), else this season's averages (~)`;
    for (const [id, st] of PROPS) if (st.auto) PROPS.delete(id);
    render();
  });
}
// The visible page width (no scrollbar), for .detail-wrap.
const setVw = () => document.documentElement.style.setProperty("--vw", document.documentElement.clientWidth + "px");
setVw();
addEventListener("resize", setVw);
init();
</script>
