<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>NBA PTS Correlations</title>
<style>
  :root {
    --bg:#0f1419; --panel:#1a2129; --line:#2a333d; --txt:#e6edf3;
    --muted:#8b98a5; --accent:#f5a623; --pos:#3fb950; --neg:#f85149;
    --prev:#6f9fd0; --old:#4e5965;
  }
  * { box-sizing:border-box; }
  /* iOS inflates small text inside the dashboard's iframe; keep sizes as set. */
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--txt);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:14px 22px 10px; display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 14px; }
  h1 { margin:0; font-size:18px; }
  .sub { color:var(--muted); font-size:12.5px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px 12px; align-items:center;
    padding:10px 22px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); position:sticky;
    top:0; background:var(--bg); z-index:5; }
  /* Sorting is the column headers' job on a wide screen; the menu is for
     phones, where the header row is hidden. */
  .sortw { display:none !important; }
  /* Options: the rarely-touched filters, tucked into a popover. */
  .opts { position:relative; }
  .opts summary { list-style:none; cursor:pointer; color:var(--muted); font-size:13px;
    border:1px solid var(--line); border-radius:8px; padding:6px 12px; user-select:none; }
  .opts summary::-webkit-details-marker { display:none; }
  .opts[open] summary, .opts summary:hover { color:var(--txt); }
  .opts-panel { position:absolute; top:calc(100% + 6px); left:0; z-index:20; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:grid; gap:10px;
    min-width:230px; box-shadow:0 8px 24px rgba(0,0,0,.5); font-size:13px; }
  .opts-panel label { display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .opts-panel input[type=number] { margin-left:auto; }
  .toggle { display:inline-flex; border:1px solid var(--line); border-radius:8px;
    overflow:hidden; }
  .toggle button { background:transparent; color:var(--muted); border:0;
    padding:7px 14px; font-size:13px; cursor:pointer; }
  .toggle button.on { background:var(--accent); color:#1a1a1a; font-weight:600; }
  input[type=search], input[type=number] { background:var(--panel); border:1px solid var(--line);
    color:var(--txt); border-radius:8px; padding:7px 10px; font-size:13px; }
  input[type=search] { width:180px; }
  label.muted input { margin-left:4px; }
  select { background:var(--panel); border:1px solid var(--line); color:var(--txt);
    border-radius:8px; padding:7px 8px; font-size:13px; }
  .count { color:var(--muted); font-size:12.5px; margin-left:auto; }
  .sched { padding:8px 22px; color:var(--muted);
    font-size:12px; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; }
  .sched .g { white-space:nowrap; border:1px solid var(--line); border-radius:6px; padding:2px 8px; }
  .sched b { color:var(--txt); font-weight:600; }
  .sched .flip { margin-left:auto; background:none; border:1px solid var(--accent); color:var(--accent);
                 border-radius:7px; padding:2px 9px; font-size:12px; cursor:pointer; white-space:nowrap; }
  .sched .flip:disabled { opacity:.5; cursor:wait; }
  .wrap { overflow-x:auto; padding:0 12px 60px; }
  table { border-collapse:collapse; width:100%; min-width:900px; }
  th,td { padding:8px 10px; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  /* First correlation column: a rule and some air between box stats and r's. */
  #tbl th.grp, #tbl td.grp { border-left:1px solid var(--line); padding-left:18px; }
  #tbl td.c-stat { color:#c3ccd5; }
  /* Three r columns don't need the full width of a wide monitor. */
  #tbl.narrow { max-width:1180px; }
  #tbl td.c-r { min-width:92px; }
  th { position:sticky; top:0; background:var(--panel); color:var(--muted);
    font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;
    cursor:pointer; border-bottom:1px solid var(--line); user-select:none; }
  th:hover { color:var(--txt); }
  th.sorted::after { content:" \25BC"; font-size:9px; }
  th.sorted.asc::after { content:" \25B2"; }
  td.l, th.l { text-align:left; }
  tbody tr { border-bottom:1px solid #20272f; }
  tbody tr:hover { background:#161d24; }
  .name { font-weight:600; }
  .inj { display:inline-flex; align-items:center; gap:4px; margin-left:7px; font-size:10.5px;
    font-weight:700; letter-spacing:.03em; cursor:help; color:var(--txt); }
  .inj i { width:7px; height:7px; border-radius:50%; background:#f4c430; }
  .inj.out i { background:var(--neg); }
  .team { color:var(--muted); font-size:12px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--pos); margin-right:6px; vertical-align:middle; }
  .r { font-weight:600; border-radius:4px; padding:1px 4px; }
  .rflag { color:var(--accent); font-weight:700; font-size:11.5px; cursor:help; }
  #tbl td.c-r .rflag { display:inline-block; width:9px; text-align:right; }
  .at { color:var(--muted); font-size:10.5px; margin-left:5px; white-space:nowrap; }
  #tbl td.c-r .at { display:inline-block; min-width:64px; text-align:left; }
  .raw { color:var(--muted); font-size:11.5px; }
  .sig { text-decoration:underline; text-decoration-color:var(--accent);
    text-underline-offset:2px; }
  .muted { color:var(--muted); }
  .err { color:var(--neg); padding:20px 22px; }
  .care { display:inline-block; width:14px; color:var(--old); font-size:11px; }
  tbody tr.prow { cursor:pointer; }
  tbody tr.prow:hover .care { color:var(--accent); }
  tbody tr.drow > td { padding:0; background:#10161c; }
  /* contain: the panel's content can't widen the table; its own scroll
     wrappers (.sub-scroll, .pr-out) take any overflow instead. */
  .detail-wrap { padding:10px 16px 14px; text-align:left; white-space:normal; contain:inline-size; }
  .detail-h { font-size:12px; color:var(--muted); margin-bottom:8px; }
  table.sub { width:auto; min-width:0; border-collapse:collapse; }
  table.sub th { position:static; top:auto; background:transparent; cursor:default;
    border-bottom:1px solid var(--line); font-size:10.5px; padding:4px 12px; }
  table.sub td { padding:4px 12px; border-bottom:1px solid #20272f; white-space:nowrap; }
  table.sub tr.pool td { border-top:1px solid var(--line); }

  /* --- prop builder: two stats, their lines, and the SGP pricer --- */
  .pb { border:1px solid var(--line); border-radius:10px; background:var(--panel);
    padding:12px 14px 14px; margin-bottom:14px; }
  .pb-title { font-size:13px; font-weight:600; margin-bottom:2px; }
  .pb-sub { color:var(--muted); font-size:11.5px; margin-bottom:10px; }
  .pb-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 18px; margin-bottom:10px; }
  .pb-row { display:flex; flex-wrap:nowrap; gap:10px 14px; align-items:center; min-width:0; }
  .pb-row label { white-space:nowrap; display:flex; align-items:center; min-width:0; }
  .pb-row select { min-width:0; max-width:42vw; }
  .pb-controls { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center;
    margin-bottom:12px; }
  .pb-controls label { color:var(--muted); font-size:12px; }
  .pb-controls input[type=number] { width:64px; margin:0 4px; text-align:center; -moz-appearance:textfield; }
  .pb-controls input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; }
  .stp { background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:8px;
    width:32px; padding:6px 0; font-size:15px; font-weight:600; cursor:pointer; margin-left:6px; }
  .stp + input + .stp { margin-left:0; }
  .stp:active { border-color:var(--accent); color:var(--accent); }
  .pb-controls select { margin-left:6px; }
  .pb-body { display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start; }
  .pb-note { color:var(--muted); font-size:11px; margin-top:8px; grid-column:1/-1; }
  /* --- SGP pricer (copula on the shrunk r) --- */
  /* Beside the chart when the screen has room, below it (full width) when
     it doesn't. min-width:0 lets its table scroll instead of widening the panel. */
  .pr { flex:1 1 480px; min-width:0; }
  .pr-sub { color:var(--muted); font-size:11.5px; margin-bottom:10px; max-width:900px; }
  .pr .pb-controls input[type=text] { width:74px; margin-left:6px; background:var(--panel);
    border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:7px 10px; font-size:13px; }
  .pr .pb-controls input[type=number] { width:74px; }
  .payin { width:92px; background:var(--panel); border:1px solid var(--line); color:var(--txt);
    border-radius:7px; padding:4px 7px; font-size:12.5px; text-align:right; }
  .pr table.sub td.fv { font-weight:600; color:var(--accent); }
  .fvw { display:inline-flex; align-items:center; gap:6px; }
  .sortw { display:inline-flex; align-items:center; gap:6px; }
  .sgn { background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:8px;
    min-width:34px; padding:6px 8px; font-size:14px; font-weight:600; cursor:pointer; }
  .plug { margin-left:auto; border:1px solid var(--accent); color:var(--accent); border-radius:8px;
    padding:6px 11px; font-size:12.5px; }
  .plug b { font-size:14px; }
  .pr-out, .sub-scroll { overflow-x:auto; }
  .pr-out { margin-top:10px; }
  .nvbtn { font-size:12.5px; border-color:var(--accent); color:var(--accent); }
  .nvbtn:disabled { opacity:.5; cursor:wait; }
  .nv-out { color:var(--muted); font-size:12px; margin-top:10px; line-height:1.5; }
  .nv-out:empty { display:none; }
  /* Result of a Fetch FV / Novig SGP press: a boxed report, one line per leg
     or combo, each opening with a green check (filled) or amber ! (not). */
  .nv-out.rep { border:1px solid var(--line); border-radius:8px; background:#10161c; padding:9px 11px; max-width:760px; }
  .nv-h { font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
  .nv-h b { color:var(--txt); }
  .nv-leg + .nv-leg { margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
  .nv-st { color:var(--txt); padding-left:22px; position:relative; }
  .nv-st::before { position:absolute; left:0; top:1px; width:15px; height:15px; border-radius:50%;
    font-size:10.5px; font-weight:700; line-height:15px; text-align:center; color:#10161c; }
  .nv-st.ok::before { content:"\2713"; background:var(--pos); }
  .nv-st.warn::before { content:"!"; background:var(--accent); }
  .nv-st.busy::before { content:"\2026"; background:var(--old); color:var(--txt); }
  .nv-st.ok b.w { color:var(--pos); }
  .nv-st.warn b.w { color:var(--accent); }
  .nv-pick { padding-left:22px; margin-top:5px; line-height:2.1; }
  /* A box Novig just filled: green edge until it's edited. */
  input.got { border-color:var(--pos) !important; box-shadow:0 0 0 1px rgba(63,185,80,.35); }
  .nv-chip { background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:7px;
    padding:2px 7px; margin:0 3px; font-size:11.5px; cursor:pointer; white-space:nowrap; }
  .nv-chip:hover { border-color:var(--accent); }
  .nv-chip.on { border-color:var(--pos); color:var(--pos); border-style:solid; }
  .nv-chip.wide { border-style:dashed; color:var(--muted); }
  .nv-chip.wide.on { color:var(--pos); }
  .nv-chip small { font-size:10px; opacity:.8; }

  /* The player panel sits in a table row as wide as the table (~1780px), so
     on a narrower screen it ran off the right edge (and the SGP pricer with
     it). Pin it to the visible width; --vw is the page's width without the
     scrollbar, set from JS. */
  .detail-wrap { position:sticky; left:0; width:min(100%, calc(var(--vw, 100vw) - 24px)); }

  /* Phones: each player is a card (name / box stats / r values) instead of a
     16-column row; the Sort menu stands in for the hidden header. 16px
     inputs stop iOS zooming in on focus. */
  @media (max-width: 700px) {
    header { padding:12px 14px 8px; }
    h1 { font-size:17px; }
    #meta { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
      overflow:hidden; cursor:pointer; }
    #meta.open { display:block; }
    .controls { position:static; padding:10px 14px; gap:8px 10px; }
    .sortw { display:inline-flex !important; order:3; }
    .opts { order:2; margin-left:auto; }
    #outn, .count { order:4; }
    #tbl.narrow { max-width:none; }
    .opts-panel { left:auto; right:0; }
    .pb-row { flex-basis:100%; }
    .toggle { flex:1 1 100%; }
    .toggle button { flex:1; padding:9px 8px; white-space:nowrap; }
    input[type=search] { flex:1 1 100%; width:auto; }
    input[type=search], input[type=number], input[type=text], select { font-size:16px; }
    #sortsel { max-width:44vw; }
    .count { margin-left:0; width:100%; }
    /* One swipeable row instead of six stacked lines. */
    .sched { padding:8px 14px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
    .sched::-webkit-scrollbar { display:none; }
    .sched > * { flex:none; }
    .sched .flip { margin-left:6px; }
    .wrap { padding:0 8px 60px; overflow-x:visible; }
    #tbl, #tbl > tbody { display:block; min-width:0; width:auto; }
    #tbl > thead { display:none; }
    #tbl > tbody > tr.prow { display:grid; grid-template-columns:repeat(42, minmax(0,1fr));
      row-gap:6px; padding:10px 4px; }
    #tbl > tbody > tr.prow > td { padding:0 2px; text-align:left; min-width:0; }
    #tbl th.grp, #tbl td.grp { border-left:0; padding-left:2px; }
    #tbl td.c-r { min-width:0; }
    #tbl td.c-r .at { display:inline; min-width:0; }
    #tbl td.c-r .rflag:empty, #tbl td.c-r .at:empty { display:none; }
    #tbl td.c-name { grid-column:span 30; font-size:15px; overflow:hidden; text-overflow:ellipsis; }
    #tbl td.c-tag { grid-column:span 6; text-align:right; color:var(--muted); font-size:12px; align-self:center; }
    #tbl td.c-stat { grid-column:span 7; text-align:center; }
    #tbl td.c-r { grid-column:span 14; text-align:center; font-size:15px; }
    #tbl td[data-label]::before { content:attr(data-label); display:block; font-size:10px;
      color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
    #tbl td.srt::before { color:var(--accent) !important; font-weight:700; }
    #tbl tr.prow .raw { display:none; }
    #tbl > tbody > tr.drow, #tbl > tbody > tr.drow > td { display:block; }
    .detail-wrap { position:static; width:auto; padding:6px 2px 14px; }
    .pb { padding:10px 10px 12px; }
    .pr .pb-controls input[type=text] { width:84px; }
  }
</style>
</head>
<body>
<header>
  <h1>NBA Points Correlations</h1>
  <div class="sub" id="meta">Loading…</div>
  <a class="sub" href="nba_scan.html" style="margin-left:auto;color:var(--accent);text-decoration:none;white-space:nowrap">Novig scanner →</a>
</header>

<div class="controls">
  <div class="toggle" id="toggle">
    <button data-mode="today" class="on">Playing today</button>
    <button data-mode="all">All players</button>
  </div>
  <input type="search" id="search" placeholder="Filter by name…" />
  <label class="muted" title="Set to 0 to show everyone (incl. low-minute players).">Min mpg
    <input type="number" id="minmpg" value="20" min="0" step="1" style="width:56px" />
  </label>
  <span class="sortw"><label class="muted">Sort
    <select id="sortsel">
      <option value="pts_reb.shrunk">PTS·REB r</option>
      <option value="pts_ast.shrunk">PTS·AST r</option>
      <option value="pts_3pm.shrunk">PTS·3PM r</option>
      <option value="tot_reb.shrunk">Game total·REB r</option>
      <option value="tm_reb.shrunk">Team score·REB r</option>
      <option value="op_reb.shrunk">Opp score·REB r</option>
      <option value="_pts">Points</option>
      <option value="_reb">Rebounds</option>
      <option value="_ast">Assists</option>
      <option value="_tpm">3PM</option>
      <option value="_min">Minutes</option>
    </select>
  </label><button type="button" class="sgn" id="sortdir" title="Flip the sort order"></button></span>
  <details class="opts" id="opts"><summary>Options</summary>
    <div class="opts-panel">
      <label class="muted" title="Final game total, team score and opponent score vs his rebounds. Small for most players, so off by default.">
        <input type="checkbox" id="scorecols" /> Game score·REB columns</label>
      <label class="muted" title="Games under 60% of a player's median minutes that season (injury exits, blowouts, foul trouble). A prop on a player who plays is action, so they always count in the r values; uncheck to leave them out of the box stats and prop builder.">
        <input type="checkbox" id="shortg" checked /> Short-minute games</label>
      <label class="muted" title="Optional. 0 = show everyone (small samples included).">Min games
        <input type="number" id="ming" value="0" min="0" step="1" style="width:56px" /></label>
    </div>
  </details>
  <span class="muted" id="outn" style="font-size:12.5px" title="Players ESPN's injury report lists as Out (or suspended) are always left off. Day-to-day / questionable players stay, with a badge."></span>
  <span class="count" id="count"></span>
</div>

<div class="sched" id="sched"></div>
<div class="wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
<div class="err" id="err" style="display:none"></div>

<script>
const SCOREBOARD = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard";
const INJURIES = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/injuries";
let INJ = new Map();    // athlete_id -> {status, out, note, ret} from ESPN's injury report
let DATA = null;        // full payload
let TODAY_IDS = null;   // Set<string> of team_ids whose game today hasn't started (live)
let MODE = "today";
let DAY = "today";      // "tomorrow" once today has nothing left to tip, or when picked
const ymdOf = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
// The slate bar's switch: show tomorrow's slate while today still has games
// to tip. Remembered for the rest of the (local) day.
let PICK_TOM = false;
try { PICK_TOM = localStorage.getItem("nbaSlateTomorrow") === ymdOf(new Date()); } catch (_) {}
let SORT = { key: "pts_reb.shrunk", dir: -1 };  // dir -1 = high first, 1 = low first (A–Z)
let BOX_SEASON = null;  // box-stat columns show this season only
let BLEND = [];         // seasons, oldest first — blended by box stats + prop builder
let SW = {};            // per-game season weights (recency tilt), from the data file
const gw = g => SW[g.s] || 0;
let SHOW_SHORT = true;   // include games flagged `short` (low minutes) in box stats + prop builder, as the r values do
const logOf = p => (p.recent_games || []).filter(g => SHOW_SHORT || !g.short);
const nShortHidden = p => SHOW_SHORT ? 0 : (p.recent_games || []).filter(g => g.short).length;

const num = (v, d=2) => (v===null||v===undefined||Number.isNaN(v)) ? "—" : v.toFixed(d);
const get = (o, path) => path.split(".").reduce((a,k)=> (a==null?a:a[k]), o);

// One day's slate from ESPN's scoreboard (YYYYMMDD): team ids for games that
// haven't tipped, plus every game for the slate bar.
async function slateFor(ymd) {
  // ESPN directly; if the browser can't reach it (blocker, network), the
  // same scoreboard through this site's server.
  let j;
  try {
    const r = await fetch(`${SCOREBOARD}?dates=${ymd}`);
    if (!r.ok) throw 0;
    j = await r.json();
  } catch (_) {
    const r = await fetch(`/api/nba/scoreboard?dates=${ymd}`);
    if (!r.ok) throw 0;
    j = await r.json();
  }
  const ids = new Set(), games = [];
  for (const e of (j.events||[])) {
    const comp = e.competitions?.[0]?.competitors || [];
    const pair = comp.map(c => ({id:String(c.team.id), ab:c.team.abbreviation}));
    // Only games that haven't tipped feed the "Playing today" list: once a
    // game starts its players drop off (the slate bar still shows it).
    const state = e.status?.type?.state || "";
    if (state === "pre") pair.forEach(p => ids.add(p.id));
    // "11/10 - 7:30 PM EST" -> "7:30 PM": the bar already says which day.
    const st = (e.status?.type?.shortDetail || state).replace(/^\d+\/\d+\s*-\s*/, "").replace(/\s+[ECMP][SD]T$/, "");
    games.push({ matchup: pair.map(p=>p.ab).reverse().join(" @ "), st });
  }
  return { ids, games, date: ymd, live:true, day:"today" };
}

async function liveTodayIds() {
  // Use the browser's local date so the toggle is correct on any day.
  const d = new Date();
  const fmt = ymdOf;
  try {
    const today = await slateFor(fmt(d));
    today.flip = today.ids.size > 0;   // games left today: the switch is offered
    if (today.ids.size && !PICK_TOM) return today;
    // Nothing left to tip today (no games, or all started/final), or the
    // switch is on: roll the toggle over to tomorrow's slate.
    const t = new Date(d); t.setDate(t.getDate() + 1);
    const tom = await slateFor(fmt(t));
    if (!tom.games.length) return today;
    tom.day = "tomorrow";
    tom.flip = today.flip;
    return tom;
  } catch (_) {
    return null; // caller falls back to baked snapshot
  }
}

// ESPN's league-wide injury report (CORS open). Keyed by the athlete id in
// each entry's player-card link, the same id as the data file's athlete_id.
async function loadInjuries() {
  try {
    const r = await fetch(INJURIES);
    if (!r.ok) return;
    const m = new Map();
    for (const t of (await r.json()).injuries || []) {
      for (const i of t.injuries || []) {
        const id = (i.athlete?.links?.[0]?.href || "").match(/\/id\/(\d+)/)?.[1];
        if (!id) continue;
        // The label on ESPN's player page (GTD / OUT / OFS = out for the
        // season) is details.fantasyStatus. It's the current one: a player
        // ruled out of last night's game keeps status "Out" but shows GTD
        // for the next. The status word is only a fallback.
        const status = i.status || "";
        const lab = (i.details?.fantasyStatus?.abbreviation ||
                     INJ_ABBR[status.toLowerCase()] || status).toUpperCase();
        m.set(id, { lab, status, out: /^(OUT|OFS|SUSP)/.test(lab), note: i.shortComment || "",
                    ret: i.details?.returnDate || "" });
      }
    }
    INJ = m;
  } catch (_) { /* no report: nobody hidden, no badges */ }
}

const INJ_ABBR = { "day-to-day":"GTD", "questionable":"GTD", "doubtful":"GTD", "probable":"GTD",
                   "out":"OUT", "suspension":"SUSP" };
// ESPN-style status: colored dot + ESPN's label (yellow GTD, red OUT).
function injBadge(p) {
  const i = INJ.get(p.athlete_id);
  if (!i) return "";
  const tip = `${i.lab} (${i.status})${i.ret ? ` · est. return ${i.ret}` : ""}${i.note ? ` — ${i.note}` : ""}`;
  return `<span class="inj${i.out ? " out" : ""}" title="${tip.replace(/"/g, "&quot;")}"><i></i>${i.lab}</span>`;
}

function renderSched(games, live, day = "today", flip = false) {
  const el = document.getElementById("sched");
  const Day = day === "tomorrow" ? "Tomorrow" : "Today";
  document.querySelector('#toggle button[data-mode="today"]').textContent = `Playing ${day}`;
  if (!games || !games.length) { el.textContent = `No NBA games ${day}.`; return; }
  // flip: today still has games to tip, so either day can be shown.
  const sw = !flip ? "" : `<button type="button" class="flip" data-flip title="${day === "tomorrow"
    ? "Back to the games still to tip today" : "Done with today? Show tomorrow's slate and players now"}">${
    day === "tomorrow" ? "← Today’s slate" : "Tomorrow’s slate →"}</button>`;
  el.innerHTML = `<span class="muted">${Day}${day==="tomorrow"&&!flip?" (no games left today)":""}</span> ` +
    games.map(g => `<span class="g"><b>${g.matchup}</b>${g.st?` <span class="muted">${g.st}</span>`:""}</span>`).join("") + sw;
  const b = el.querySelector("[data-flip]");
  if (b) b.onclick = async () => {
    PICK_TOM = day !== "tomorrow";
    try { PICK_TOM ? localStorage.setItem("nbaSlateTomorrow", ymdOf(new Date())) : localStorage.removeItem("nbaSlateTomorrow"); } catch (_) {}
    b.disabled = true;
    await refreshSlate();
    render();
  };
}

// Live schedule for the toggle; fall back to the baked snapshot.
async function refreshSlate() {
  const l = await liveTodayIds();
  if (l) { TODAY_IDS = l.ids; DAY = l.day; renderSched(l.games, true, DAY, l.flip); return true; }
  TODAY_IDS = snapshotIds();
  return false;
}

const SHRUNK_HT = "Devig r = what to type into the devig tool's Correlation box " +
  "(joint = pA·pB + r·(min(pA, pB) − pA·pB)) for an Over+Over or Under+Under at today's Pinnacle main lines " +
  "(@, legs at Pinnacle's worst-case devigged prices). A leg Pinnacle hasn't posted uses the half-point line at this season's " +
  "average and how often his games clear it (~). The prop builder opens on the same lines. " +
  "Flip its sign for an Over/Under mix. Expand the player for the exact value at any lines. " +
  "Margin r = correlation of the whole stat lines over every game played (short-minute games count: the props are action in them): " +
  "the player's own recency-weighted r pulled toward the " +
  "typical r of rotation players in a similar role, more so the noisier the sample (one player's r " +
  "carries about 0.10 of noise). Devig r comes from it through a Gaussian copula.";

// Binary correlation that a margin r implies when both legs sit at their
// median (Gaussian copula; the arcsine law). Lines off the median shrink it.
const plugR = r => 2 / Math.PI * Math.asin(r);

// ---- Pinnacle main lines ------------------------------------------------
// /api/pinnacle/nba-props: Pinnacle's one line per player prop with both
// prices, plus each game's total and team totals. The r columns are priced at
// these lines and the prop builder opens on them; a player without a Pinnacle
// line for both legs falls back to the median.
let PIN = null;  // { at: "1:38 PM", n: players matched, byId: Map(athlete_id -> {pts, reb, ..., tot, tm, op}) }
const PAIR_STATS = { pts_reb:["pts","reb"], pts_ast:["pts","ast"], pts_3pm:["pts","tpm"],
                     tot_reb:["tot","reb"], tm_reb:["tm","reb"], op_reb:["op","reb"] };
// "Los Angeles Clippers" (Pinnacle) and "LA Clippers" (ESPN) -> "clippers".
const teamKey = s => (s || "").trim().split(/\s+/).pop().toLowerCase();
const fmtAm = o => o > 0 ? `+${o}` : `${o}`;
// Today's Pinnacle line for one of his stats: {line, over, under} or null.
const pinLeg = (p, stat) => PIN?.byId.get(p.athlete_id)?.[stat] || null;
// A leg's fair P(over): the Over's worst-case devig, as the pricer takes it.
const pinOver = L => devigWorst(oddsProb(L.over), oddsProb(L.under))[0];

async function loadPinnacle() {
  try {
    const r = await fetch("/api/pinnacle/nba-props");
    if (!r.ok) return;
    const j = await r.json();
    if (!j.ok || !Array.isArray(j.props)) return;
    const byName = new Map();
    for (const p of DATA.players) {
      const k = nvNorm(p.name);
      byName.set(k, [...(byName.get(k) || []), p]);
    }
    const games = new Map((j.games || []).map(g => [g.id, g]));
    const byId = new Map();
    for (const pr of j.props) {
      const g = games.get(pr.game_id), cands = byName.get(nvNorm(pr.player)) || [];
      const teams = g ? [teamKey(g.home), teamKey(g.away)] : [];
      const p = cands.length === 1 ? cands[0] : cands.find(c => teams.includes(teamKey(c.team_name)));
      if (!p) continue;
      const e = byId.get(p.athlete_id) || {};
      e[pr.stat] = { line: pr.line, over: pr.over, under: pr.under };
      // Game total and the two team totals, from his side of the game.
      if (g && !e.tot) {
        e.tot = g.total || undefined;
        const side = teamKey(p.team_name) === teamKey(g.home) ? "home"
          : teamKey(p.team_name) === teamKey(g.away) ? "away" : null;
        if (side) {
          e.tm = g.team_total?.[side];
          e.op = g.team_total?.[side === "home" ? "away" : "home"];
        }
      }
      byId.set(p.athlete_id, e);
    }
    const t = new Date(j.fetched_at || Date.now());
    PIN = { byId, n: byId.size, at: t.toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }) };
    for (const p of DATA.players) p._r = null;  // re-price every r at the new lines
  } catch (_) { /* no Pinnacle: every r stays at this season's averages */ }
}

// Weighted share of his games over a line, pushes left out, over the games
// that have both stats of the pair: how the pricer takes a leg with no fair
// odds. Null when no game falls on either side.
function logOver(p, stat, line, other) {
  let w = 0, wo = 0;
  for (const g of logOf(p)) {
    if (g[stat] == null || g[other] == null || g[stat] === line) continue;
    w += gw(g); if (g[stat] > line) wo += gw(g);
  }
  return w ? wo / w : null;
}

// One leg of the table's r: Pinnacle's main line (fair Over from its prices),
// else the half-point line at this season's average with his game-log hit
// rate. The same leg the prop builder opens on. {line, p, L: Pinnacle line or null}
function legFor(p, stat, other) {
  const L = pinLeg(p, stat);
  if (L) return { line: L.line, p: pinOver(L), L };
  const line = halfLine(p["_" + stat]);
  return { line, p: logOver(p, stat, line, other), L: null };
}

// {v, m, X, Y}: devig r of a pair at its two legs (legFor), from the shrunk
// margin r m; null when the pair has no r. A leg with no usable probability
// (no line, every game on one side) leaves the median value and X = Y = null.
function lineR(p, key) {
  const pair = p[key];
  if (!pair || pair.weighted.r === null) return null;
  const m = pair.shrunk ? pair.shrunk.r : pair.weighted.r;
  const [xs, ys] = PAIR_STATS[key], X = legFor(p, xs, ys), Y = legFor(p, ys, xs);
  const ok = q => q !== null && q > 0 && q < 1;
  // At the median (50/50 legs) the devig r equals the phi r, the arcsine law.
  if (!ok(X.p) || !ok(Y.p)) return { v: plugR(m), m, X: null, Y: null };
  return { v: devigR(pairJoint(xs, X.line, ys, Y.line, m, X.p, Y.p, true), X.p, Y.p), m, X, Y };
}
// Cached per player and pair; cleared when the lines (Pinnacle) or the games
// behind them (short-game toggle, via blendBox) change.
const rAt = (p, key) => ((p._r ||= {})[key] !== undefined ? p._r[key] : (p._r[key] = lineR(p, key)));

// Box-score columns (G..3PM) show BOX_SEASON only, via the _g/_min/... fields precomputed in
// init(). The correlation columns remain pooled + recency-weighted across
// every season; expand a row for the per-season history.
const COLS = [
  { k:"name", h:"Player", l:true,  v:p=>`<span class="care" >${EXPANDED.has(p.athlete_id)?"▾":"▸"}</span>${MODE==="all"&&TODAY_IDS&&TODAY_IDS.has(p.team_id)?`<span class="dot" title="Plays ${DAY}"></span>`:''}<span class="name">${p.name}</span>${injBadge(p)}` },
  { k:"team_abbr", h:"Tm", l:true, v:p=>`<span class="team">${p.team_abbr||"—"}</span>` },
  { k:"position", h:"Pos", l:true, v:p=>p.position||"—" },
  { k:"_g", h:"G", ht:"Games this season (short-minute games included unless unchecked)", v:p=>p._g },
  { k:"_min", h:"Min", v:p=>num(p._min,1) },
  { k:"_pts", h:"Pts", v:p=>num(p._pts,1) },
  { k:"_reb", h:"Reb", v:p=>num(p._reb,1) },
  { k:"_ast", h:"Ast", v:p=>num(p._ast,1) },
  { k:"_tpm", h:"3PM", v:p=>num(p._tpm,1) },
  { k:"pts_reb.shrunk", h:"PTS·REB", grp:true, ht:SHRUNK_HT, v:p=>rCell(p, "pts_reb") },
  { k:"pts_ast.shrunk", h:"PTS·AST", ht:SHRUNK_HT, v:p=>rCell(p, "pts_ast") },
  { k:"pts_3pm.shrunk", h:"PTS·3PM", ht:SHRUNK_HT, v:p=>rCell(p, "pts_3pm") },
  { k:"tot_reb.shrunk", score:true, h:"TOT·REB", ht:"Final game total (both teams) vs his rebounds. Negative = more boards in low-scoring games (pairs with game Under + REB Over). " + SHRUNK_HT, v:p=>rCell(p, "tot_reb") },
  { k:"tm_reb.shrunk", score:true, h:"TM·REB", ht:"His team's final score vs his rebounds. " + SHRUNK_HT, v:p=>rCell(p, "tm_reb") },
  { k:"op_reb.shrunk", score:true, h:"OPP·REB", ht:"Opponent's final score vs his rebounds. " + SHRUNK_HT, v:p=>rCell(p, "op_reb") },
];
const EXPANDED = new Set();
// The three game score·REB columns are small for nearly everyone: hidden
// until asked for (Options), or while the table is sorted on one of them.
let SHOW_SCORE = false;
try { SHOW_SCORE = localStorage.getItem("nbaScoreCols") === "1"; } catch (_) {}
const scoreOn = () => SHOW_SCORE || COLS.some(c => c.score && c.k === SORT.key);
const visCols = () => COLS.filter(c => !c.score || scoreOn());
// "-0.00" reads as noise: a value that rounds to zero shows as 0.00.
const rTxt = (v, d=2) => num(v, d).replace(/^-(0\.0+)$/, "$1");

// The r a column shows and sorts by: the devig r at the pair's lines (rAt).
// Null = no r.
function rShown(p, key) {
  const c = rAt(p, key);
  return c ? c.v : null;
}

// Headline = devig r from the shrunk margin r (files without a shrunk r
// fall back to the data r) at the pair's lines: "@23.5/2.5" when both are
// Pinnacle main lines, "~20.5/9.5" when a leg is at this season's average.
// The table shows only that; the margin r and the player's own weighted r
// are in the tooltip and in the expanded row (own r underlined when p < 0.05).
function rCell(p, key, full) {
  const pair = p[key];
  if (!pair) return "—";
  const w = pair.weighted, s = pair.shrunk;
  if (w.r===null) return "—";
  const c = rAt(p, key), m = c.m, v = c.v;
  const heat = full ? null : rHeat(key, v);
  const col = heat ? heat.fg : v>0 ? "var(--pos)" : "var(--neg)";
  const sig = (w.p_value!==null && w.p_value<0.05) ? "sig" : "";
  const [xs, ys] = PAIR_STATS[key];
  const leg = (st, X) => X.L ? `${STAT_LABEL[st]} ${X.line} (Pinnacle o ${fmtAm(X.L.over)} / u ${fmtAm(X.L.under)})`
    : `${STAT_LABEL[st]} ${X.line} (this season's average ${num(p["_" + st], 1)}; over in ${Math.round(100 * X.p)}% of his games)`;
  const where = c.X ? `at ${leg(xs, c.X)} and ${leg(ys, c.Y)}` : "at median lines";
  const own = `his own r ${num(w.r,3)}${w.p_value!==null ? ` (p=${num(w.p_value,3)})` : ""}`;
  const why = ` title="devig r ${where}, from margin r ${num(m,3)}` +
    `${s ? ` (${own} pulled toward the role prior ${num(s.prior,3)}, ${Math.round(100*s.w)}% weight on his own r)` : `, ${own}`}` +
    `; an Over/Under mix is negative (the builder shows its exact value)"`;
  const lines = c.X ? `${c.X.L && c.Y.L ? "@" : "~"}${c.X.line}/${c.Y.line}` : "";
  const r = `<span class="r" style="color:${col}${heat ? `;background:${heat.bg}` : ""}"${why}>${rTxt(v)}</span>`;
  if (!full) {
    // Only the sorted column spells out its lines; the others keep them in
    // the tooltip, so the table is one number per cell.
    const at = key === SORT.key.split(".")[0] ? `<span class="at">${lines}</span>` : "";
    // Table cell: just the devig r and its lines. A "!" flags a player
    // whose own r is far from the margin r (thin or noisy sample: the role
    // prior is doing most of the work).
    const gap = Math.abs(w.r - m) >= R_GAP_FLAG;
    const flag = `<span class="rflag"${gap ? ` title="His own r (${num(w.r)}) is ${num(Math.abs(w.r - m))} from the margin r (${num(m)}): thin or noisy sample, lean on this one less."` : ""}>${gap ? "!" : ""}</span>`;
    return r + flag + at;
  }
  // Expanded row: devig r, its lines, the margin r and his own (underlined
  // when p < 0.05); p-value and prior are in the tooltip.
  return r + (lines ? `<span class="at">${lines}</span>` : "") + ` <span class="raw"${why}>` +
    `margin ${num(m)} · own <span class="${sig}">${num(w.r)}</span></span>`;
}

// Gap between a player's own r and the margin r that earns the "!" flag.
const R_GAP_FLAG = 0.15;

// Heat map for the table's r: each column is scaled to the players on screen.
// At the column's average the r is plain white; above it fades to green
// (full green 2 SD up), below it to red. COL_STATS is set in render().
let COL_STATS = {};
const HEAT_MID = [230, 237, 243], HEAT_HI = [63, 185, 80], HEAT_LO = [248, 81, 73];
function rHeat(key, v) {
  const st = COL_STATS[key];
  if (!st || !st.sd || v === null || v === undefined) return null;
  const t = Math.max(-1, Math.min(1, (v - st.mean) / (2 * st.sd)));
  const to = t >= 0 ? HEAT_HI : HEAT_LO, a = Math.abs(t);
  const fg = HEAT_MID.map((c, i) => Math.round(c + (to[i] - c) * a));
  return { fg: `rgb(${fg})`, bg: `rgba(${to},${(0.22 * a * a).toFixed(3)})` };
}
function setColStats(rows) {
  COL_STATS = {};
  for (const c of COLS) {
    if (!c.k.endsWith(".shrunk")) continue;
    const key = c.k.split(".")[0];
    const vs = rows.map(p => rShown(p, key)).filter(v => v !== null && Number.isFinite(v));
    if (vs.length < 3) continue;
    const mean = vs.reduce((a, b) => a + b, 0) / vs.length;
    const sd = Math.sqrt(vs.reduce((a, b) => a + (b - mean) ** 2, 0) / vs.length);
    COL_STATS[key] = { mean, sd };
  }
}

// One r value for the per-season sub-table (single season => unweighted).
function rMini(pair) {
  if (!pair || pair.r===null || pair.r===undefined) return '<span class="muted">—</span>';
  const col = pair.r>0 ? "var(--pos)" : "var(--neg)";
  const sig = (pair.p_value!==null && pair.p_value<0.05) ? "sig" : "";
  return `<span class="r ${sig}" style="color:${col}" title="p=${num(pair.p_value,3)}">${rTxt(pair.r)}</span>`;
}

// ---- Prop builder: two stats and their lines, priced as an SGP -------------
// Per-player builder settings survive re-renders. yStat is the second stat.
const PROPS = new Map();
const STAT_LABEL = { pts:"PTS", reb:"REB", ast:"AST", tpm:"3PM", tot:"Game total", tm:"Team score", op:"Opp score" };
const STAT_NAME = { pts:"Points", reb:"Rebounds", ast:"Assists", tpm:"3PM", tot:"Game total", tm:"Team score", op:"Opp score" };
const X_STATS = ["pts", "tot", "tm", "op"], Y_STATS = ["reb", "ast", "tpm", "pts"];
// 3rd leg: any box stat not already on the builder, or none.
const Z_STATS = ["pts", "reb", "ast", "tpm"];
const zOpts = st => `<option value="">None</option>` +
  Z_STATS.filter(k => k !== st.xStat && k !== st.yStat)
    .map(k => `<option value="${k}"${k === st.zStat ? " selected" : ""}>${STAT_NAME[k]}</option>`).join("");
const opts = (ks, cur) => ks.map(k => `<option value="${k}"${k===cur?" selected":""}>${STAT_NAME[k]}</option>`).join("");

// Default line = blended average pushed to the nearest half-point below the
// rounded mean (book-style .5 line, so no pushes out of the box).
const halfLine = m => Math.max(0.5, Math.round(m || 1) - 0.5);

// Sorted on a correlation column (or 3PM) -> the builder opens on that pair.
const SORT_PAIR = { "pts_reb.shrunk":["pts","reb"], "pts_ast.shrunk":["pts","ast"], "pts_3pm.shrunk":["pts","tpm"],
                    "_tpm":["pts","tpm"],  // sorted by 3PM a game -> PTS o / 3PM o
                    "tot_reb.shrunk":["tot","reb"], "tm_reb.shrunk":["tm","reb"], "op_reb.shrunk":["op","reb"] };

function propState(p) {
  if (!PROPS.has(p.athlete_id)) {
    const [x, y] = SORT_PAIR[SORT.key] || ["pts", "reb"];
    // auto: still on its defaults, so Pinnacle lines landing later may
    // replace it; any edit, Fetch FV or chip makes it the user's.
    const st = { xStat: x, yStat: y, auto: true };
    setLeg(st, "x", p, x);
    setLeg(st, "y", p, y);
    PROPS.set(p.athlete_id, st);
  }
  return PROPS.get(p.athlete_id);
}

// A leg's default: Pinnacle's main line with both its prices in the fair
// boxes (the pricer devigs them worst-case per side), else the half-point
// line under the blended mean and empty boxes.
function setLeg(st, a, p, stat) {
  const L = pinLeg(p, stat);
  st[a + "Line"] = L ? L.line : halfLine(p["_" + stat]);
  // Pinnacle's prices devigged worst-case: the boxes always hold fair values.
  const fv = L ? devigWorst(oddsProb(fmtAm(L.over)), oddsProb(fmtAm(L.under))) : null;
  st[a + "Fv"] = fv ? fairOdds(fv[0]) : "";
  st[a + "FvU"] = fv ? fairOdds(fv[1]) : "";
  st[a + "Pin"] = L;
  clearTyped(st, a);
}

// Which fair boxes the user typed in (vs filled by Pinnacle or Fetch FV).
// Typing one side of a leg clears the other side if it was filled, not typed:
// the side typed (say Vulture's fair Over) is then priced against its
// complement. Typing both sides devigs them as a pair, as before.
// PTS+AST prices Over and Under fair values separately (4 boxes); the other
// pairs take each leg's fair Over only (2 boxes).
const fourBoxes = st => [st.xStat, st.yStat].sort().join() === "ast,pts";

function clearTyped(st, a) {
  st.typed = st.typed || {};
  delete st.typed[a + "Fv"];
  delete st.typed[a + "FvU"];
}

// A new sort on a pair moves every builder showing another pair onto it
// (fresh lines, fair odds and prices cleared); one already on it is kept.
function syncPropsToSort() {
  const pair = SORT_PAIR[SORT.key];
  if (!pair) return;
  for (const [id, st] of PROPS) if (st.xStat !== pair[0] || st.yStat !== pair[1]) PROPS.delete(id);
}

// ---- SGP pricer: Gaussian copula on the shrunk r ---------------------------
// Devig r: the r the devig tool needs to return joint j. It scales r to the
// Frechet bound, joint = ab + r(min(a, b) - ab) (lower bound ab - max(0, a+b-1)
// for a negative r), not the phi formula the plug-in r is for.
function devigR(j, a, b) {
  const room = j >= a * b ? Math.min(a, b) - a * b : a * b - Math.max(0, a + b - 1);
  return room > 0 ? (j - a * b) / room : 0;

// The r columns are margin correlations (whole stat lines). A same-game
// parlay only cares whether each leg clears its line, so the joint price
// comes from a bivariate normal at the two legs' quantiles: the binary
// correlation that implies shrinks as the lines move off the median. Plugging
// a margin r straight into the binary formula overstates it ~1.5x.
const PAIR_KEY = { "pts|reb":"pts_reb", "pts|ast":"pts_ast", "pts|tpm":"pts_3pm",
                   "tot|reb":"tot_reb", "tm|reb":"tm_reb", "op|reb":"op_reb" };

// Normal CDF from erf (Abramowitz-Stegun 7.1.26, error < 1.5e-7).
function ncdf(x) {
  const t = 1 / (1 + 0.3275911 * Math.abs(x) / Math.SQRT2);
  const e = t * (0.254829592 + t * (-0.284496736 + t * (1.421413741 +
            t * (-1.453152027 + t * 1.061405429)))) * Math.exp(-x * x / 2);
  return x >= 0 ? 1 - e / 2 : e / 2;
}
function nppf(pr) {
  let lo = -10, hi = 10;
  for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (ncdf(m) < pr) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
// P(U below its a-quantile and V below its b-quantile) for standard normals
// with correlation r: Plackett's identity, Simpson's rule over rho in [0, r].
function copulaJoint(r, a, b) {
  const x = nppf(a), y = nppf(b), n = 200, h = r / n;

  for (let i = 0; i <= n; i++) {
    const rho = i * h, q = 1 - rho * rho;
    const f = Math.exp(-(x * x - 2 * rho * x * y + y * y) / (2 * q)) / (2 * Math.PI * Math.sqrt(q));
    tot += f * (i === 0 || i === n ? 1 : i % 2 ? 4 : 2);
  }
  return a * b + tot * h / 3;
}
// Points and threes: k made threes are 3k points, so a 3PM Over line can force
// the PTS Over (4 threes clear PTS 11.5). The copula doesn't know that and
// leaves a PTS-under/3PM-over chance; forced, the joint sits on the bound
// (O/O = the smaller leg, PTS-under/3PM-over = 0). a, b: the two sides' probs;
// same: both Over or both Under.
const tpmForcesPts = (xs, xl, ys, yl) => {
  const [P, T] = xs === "pts" && ys === "tpm" ? [xl, yl] : xs === "tpm" && ys === "pts" ? [yl, xl] : [null, null];
  return P !== null && T !== null && 3 * (Math.floor(T) + 1) > P;
};
function pairJoint(xs, xl, ys, yl, r, a, b, same) {
  if (tpmForcesPts(xs, xl, ys, yl)) return same ? Math.min(a, b) : Math.max(0, a + b - 1);
  return copulaJoint(same ? r : -r, a, b);
}
// A two-way price (implied po + pu) -> [fair over, fair under], each side the
// worst (lowest) of the multiplicative, additive, power and Shin devigs, like
// Vulture's Fair column: +132/-173 -> +153/-147. A pair at or under 100% is
// already fair and kept. Same as devig_worst in .claude/skills/nba-ast-pts-sgp/sgp.py.
function devigWorst(po, pu) {
  const s = po + pu;
  if (s <= 1 + 1e-9) return [po, pu];
  const c = [[po / s, pu / s], [po - (s - 1) / 2, pu - (s - 1) / 2]];
  let lo = 1, hi = 20, k = 1;
  for (let i = 0; i < 100; i++) { k = (lo + hi) / 2; if (po ** k + pu ** k > 1) lo = k; else hi = k; }
  c.push([po ** k, pu ** k]);
  const shin = (z, q) => (Math.sqrt(z * z + 4 * (1 - z) * q * q / s) - z) / (2 * (1 - z));
  let zl = 0, zh = 0.5, z = 0;
  for (let i = 0; i < 100; i++) { z = (zl + zh) / 2; if (shin(z, po) + shin(z, pu) > 1) zl = z; else zh = z; }
  c.push([shin(z, po), shin(z, pu)]);
  return [Math.min(...c.map(x => x[0])), Math.min(...c.map(x => x[1]))];
}

// "+117" / "117" / "-133" -> implied probability; null if not American odds.
function oddsProb(txt) {
  const o = parseFloat(String(txt || "").replace(/\s/g, ""));
  if (!Number.isFinite(o) || Math.abs(o) < 100) return null;
  return o > 0 ? 100 / (o + 100) : -o / (-o + 100);
}

// p (probability) -> fair American odds string.
function fairOdds(pr) {
  if (pr <= 0 || pr >= 1) return "—";
  return pr >= 0.5 ? `-${Math.round(100 * pr / (1 - pr))}`
                   : `+${Math.round(100 * (1 - pr) / pr)}`;
}

// Redraw the builder's output (the SGP pricer) for its current stats and lines.
function drawProp(pb, p) {
  const st = propState(p);
  // Score stats can be missing on a game ESPN didn't score; skip those.
  drawPricer(pb, p, logOf(p).filter(g => g[st.xStat] != null && g[st.yStat] != null));
}
