<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NBA PTS Correlations</title>
<style>
  :root {
    --bg:#0f1419; --panel:#1a2129; --line:#2a333d; --txt:#e6edf3;
    --muted:#8b98a5; --accent:#f5a623; --pos:#3fb950; --neg:#f85149;
    --prev:#5f7489;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:18px 22px 10px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:19px; }
  .sub { color:var(--muted); font-size:12.5px; }
  .controls { display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    padding:12px 22px; border-bottom:1px solid var(--line); position:sticky;
    top:0; background:var(--bg); z-index:5; }
  .toggle { display:inline-flex; border:1px solid var(--line); border-radius:8px;
    overflow:hidden; }
  .toggle button { background:transparent; color:var(--muted); border:0;
    padding:7px 14px; font-size:13px; cursor:pointer; }
  .toggle button.on { background:var(--accent); color:#1a1a1a; font-weight:600; }
  input[type=search], input[type=number] { background:var(--panel); border:1px solid var(--line);
    color:var(--txt); border-radius:8px; padding:7px 10px; font-size:13px; }
  input[type=search] { width:180px; }
  label.muted input { margin-left:4px; }
  select { background:var(--panel); border:1px solid var(--line); color:var(--txt);
    border-radius:8px; padding:7px 8px; font-size:13px; }
  .count { color:var(--muted); font-size:12.5px; margin-left:auto; }
  .sched { padding:8px 22px; border-bottom:1px solid var(--line); color:var(--muted);
    font-size:12px; display:flex; flex-wrap:wrap; gap:8px 14px; }
  .sched .g { white-space:nowrap; }
  .sched b { color:var(--txt); }
  .wrap { overflow-x:auto; padding:0 12px 60px; }
  table { border-collapse:collapse; width:100%; min-width:1240px; }
  th,td { padding:7px 9px; text-align:right; white-space:nowrap; }
  th { position:sticky; top:0; background:var(--panel); color:var(--muted);
    font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;
    cursor:pointer; border-bottom:1px solid var(--line); user-select:none; }
  th:hover { color:var(--txt); }
  th.sorted::after { content:" \25BC"; font-size:9px; }
  th.sorted.asc::after { content:" \25B2"; }
  td.l, th.l { text-align:left; }
  tbody tr { border-bottom:1px solid #20272f; }
  tbody tr:hover { background:#161d24; }
  .name { font-weight:600; }
  .team { color:var(--muted); font-size:12px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--pos); margin-right:6px; vertical-align:middle; }
  .r { font-weight:600; }
  .raw { color:var(--muted); font-size:11.5px; }
  .sig { text-decoration:underline; text-decoration-color:var(--accent);
    text-underline-offset:2px; }
  .muted { color:var(--muted); }
  .err { color:var(--neg); padding:20px 22px; }
  .care { display:inline-block; width:12px; color:var(--muted); }
  tbody tr.prow { cursor:pointer; }
  tbody tr.prow:hover .care { color:var(--accent); }
  tbody tr.drow td { padding:0; background:#10161c; }
  .detail-wrap { padding:10px 16px 14px; text-align:left; white-space:normal; }
  .detail-h { font-size:12px; color:var(--muted); margin-bottom:8px; }
  table.sub { width:auto; min-width:0; border-collapse:collapse; }
  table.sub th { position:static; top:auto; background:transparent; cursor:default;
    border-bottom:1px solid var(--line); font-size:10.5px; padding:4px 12px; }
  table.sub td { padding:4px 12px; border-bottom:1px solid #20272f; white-space:nowrap; }
  table.sub tr.pool td { border-top:1px solid var(--line); }

  /* --- prop builder (last season + this season scatter) --- */
  .pb { border:1px solid var(--line); border-radius:10px; background:var(--panel);
    padding:12px 14px 14px; margin-bottom:14px; }
  .pb-title { font-size:13px; font-weight:600; margin-bottom:2px; }
  .pb-sub { color:var(--muted); font-size:11.5px; margin-bottom:10px; }
  .pb-legend { display:flex; flex-wrap:wrap; gap:6px 16px; color:var(--muted);
    font-size:11.5px; margin-bottom:10px; }
  .pb-legend i { display:inline-block; width:9px; height:9px; border-radius:50%;
    margin-right:6px; vertical-align:-1px; }
  .pb-controls { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center;
    margin-bottom:12px; }
  .pb-controls label { color:var(--muted); font-size:12px; }
  .pb-controls input[type=number] { width:70px; margin-left:6px; }
  .pb-controls select { margin-left:6px; }
  .pb-body { display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start; }
  .pb-chart { position:relative; }
  .pb-chart svg { display:block; }
  .quads { display:grid; grid-template-columns:repeat(2, minmax(150px, 1fr));
    gap:8px; min-width:310px; flex:1; max-width:420px; }
  .quad { border:1px solid var(--line); border-radius:8px; padding:9px 11px;
    background:#10161c; }
  .quad .q-h { color:var(--muted); font-size:11px; line-height:1.35; }
  .quad .q-h b { color:var(--txt); }
  .quad .q-v { font-size:20px; font-weight:600; margin:3px 0 1px; }
  .quad .q-s { color:var(--muted); font-size:11px; }
  .pb-note { color:var(--muted); font-size:11px; margin-top:8px; grid-column:1/-1; }
  .pb-tip { position:absolute; pointer-events:none; display:none; z-index:10;
    background:#0b0f14; border:1px solid var(--line); border-radius:7px;
    padding:6px 9px; font-size:11.5px; line-height:1.4; white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.45); }
  .pb-tip b { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>NBA Points Correlations <span class="muted" style="font-size:13px">— PTS·REB, PTS·AST, PTS·3PM &amp; game score·REB</span></h1>
  <div class="sub" id="meta">Loading…</div>
</header>

<div class="controls">
  <div class="toggle" id="toggle">
    <button data-mode="today" class="on">Playing today</button>
    <button data-mode="all">All players</button>
  </div>
  <input type="search" id="search" placeholder="Filter by name…" />
  <label class="muted" title="Set to 0 to show everyone (incl. low-minute players).">Min mpg
    <input type="number" id="minmpg" value="20" min="0" step="1" style="width:56px" />
  </label>
  <label class="muted" title="Optional. 0 = show everyone (small samples included).">Min G
    <input type="number" id="ming" value="0" min="0" step="1" style="width:56px" />
  </label>
  <label class="muted" title="Games under 60% of a player's median minutes that season (injury exits, blowout rest). Always left out of the r values; this only shows them in the box stats and prop builder.">
    <input type="checkbox" id="shortg" /> Show short-min games
  </label>
  <label class="muted">Sort:
    <select id="sortsel">
      <option value="pts_reb.weighted">PTS·REB r (weighted)</option>
      <option value="pts_ast.weighted">PTS·AST r (weighted)</option>
      <option value="pts_3pm.weighted">PTS·3PM r (weighted)</option>
      <option value="pts_reb.unweighted">PTS·REB r (raw)</option>
      <option value="pts_ast.unweighted">PTS·AST r (raw)</option>
      <option value="pts_3pm.unweighted">PTS·3PM r (raw)</option>
      <option value="tot_reb.weighted">Game total·REB r (weighted)</option>
      <option value="tm_reb.weighted">Team score·REB r (weighted)</option>
      <option value="op_reb.weighted">Opp score·REB r (weighted)</option>
    </select>
  </label>
  <span class="count" id="count"></span>
</div>

<div class="sched" id="sched"></div>
<div class="wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
<div class="err" id="err" style="display:none"></div>

<script>
const SCOREBOARD = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard";
let DATA = null;        // full payload
let TODAY_IDS = null;   // Set<string> of team_ids playing today (live)
let MODE = "today";
let SORT = { key: "pts_reb.weighted", dir: -1 };
let BLEND = [];         // [last season, this season] — blended by box stats + prop builder
let SW = {};            // per-game season weights (recency tilt), from the data file
const gw = g => SW[g.s] || 0;
let SHOW_SHORT = false;  // include games flagged `short` (low minutes) in box stats + prop builder
const logOf = p => (p.recent_games || []).filter(g => SHOW_SHORT || !g.short);
const nShortHidden = p => SHOW_SHORT ? 0 : (p.recent_games || []).filter(g => g.short).length;

const num = (v, d=2) => (v===null||v===undefined||Number.isNaN(v)) ? "—" : v.toFixed(d);
const get = (o, path) => path.split(".").reduce((a,k)=> (a==null?a:a[k]), o);

async function liveTodayIds() {
  // Use the browser's local date so the toggle is correct on any day.
  const d = new Date();
  const ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  try {
    const r = await fetch(`${SCOREBOARD}?dates=${ymd}`);
    if (!r.ok) throw 0;
    const j = await r.json();
    const ids = new Set(), games = [];
    for (const e of (j.events||[])) {
      const comp = e.competitions?.[0]?.competitors || [];
      const pair = comp.map(c => ({id:String(c.team.id), ab:c.team.abbreviation}));
      pair.forEach(p => ids.add(p.id));
      const st = e.status?.type?.shortDetail || e.status?.type?.state || "";
      games.push({ matchup: pair.map(p=>p.ab).reverse().join(" @ "), st });
    }
    return { ids, games, date: ymd, live:true };
  } catch (_) {
    return null; // caller falls back to baked snapshot
  }
}

function renderSched(games, live) {
  const el = document.getElementById("sched");
  if (!games || !games.length) { el.textContent = "No NBA games today."; return; }
  el.innerHTML = `<span class="muted">${live?"Today’s slate (live)":"Today’s slate"}:</span> ` +
    games.map(g => `<span class="g"><b>${g.matchup}</b>${g.st?` <span class="muted">${g.st}</span>`:""}</span>`).join("");
}

// Box-score columns (G..3PM) blend last season and this season (BLEND), each
// game weighted by its season, via the _g/_min/... fields precomputed in
// init(). The correlation columns remain pooled + recency-weighted across
// every season; expand a row for the per-season history.
const COLS = [
  { k:"name", h:"Player", l:true,  v:p=>`<span class="care" >${EXPANDED.has(p.athlete_id)?"▾":"▸"}</span>${TODAY_IDS&&TODAY_IDS.has(p.team_id)?'<span class="dot"></span>':''}<span class="name">${p.name}</span>` },
  { k:"team_abbr", h:"Tm", l:true, v:p=>`<span class="team">${p.team_abbr||"—"}</span>` },
  { k:"position", h:"Pos", l:true, v:p=>p.position||"—" },
  { k:"_g", h:"G", ht:"Games last season + this season", v:p=>p._g },
  { k:"effective_n", h:"nEff", ht:"Effective sample size of the pooled weighted correlation", v:p=>num(p.effective_n,1) },
  { k:"_min", h:"Min", v:p=>num(p._min,1) },
  { k:"_pts", h:"Pts", v:p=>num(p._pts,1) },
  { k:"_reb", h:"Reb", v:p=>num(p._reb,1) },
  { k:"_ast", h:"Ast", v:p=>num(p._ast,1) },
  { k:"_tpm", h:"3PM", v:p=>num(p._tpm,1) },
  { k:"pts_reb.weighted", h:"PTS·REB r", v:p=>rCell(p.pts_reb) },
  { k:"pts_ast.weighted", h:"PTS·AST r", v:p=>rCell(p.pts_ast) },
  { k:"pts_3pm.weighted", h:"PTS·3PM r", v:p=>rCell(p.pts_3pm) },
  { k:"tot_reb.weighted", h:"TOT·REB r", ht:"Final game total (both teams) vs his rebounds. Negative = more boards in low-scoring games (pairs with game Under + REB Over)", v:p=>rCell(p.tot_reb) },
  { k:"tm_reb.weighted", h:"TM·REB r", ht:"His team's final score vs his rebounds", v:p=>rCell(p.tm_reb) },
  { k:"op_reb.weighted", h:"OPP·REB r", ht:"Opponent's final score vs his rebounds", v:p=>rCell(p.op_reb) },
];
const EXPANDED = new Set();

function rCell(pair) {
  if (!pair) return "—";
  const w = pair.weighted, u = pair.unweighted;
  if (w.r===null) return "—";
  const col = w.r>0 ? "var(--pos)" : "var(--neg)";
  const sig = (w.p_value!==null && w.p_value<0.05) ? "sig" : "";
  return `<span class="r ${sig}" style="color:${col}">${num(w.r)}</span>` +
         ` <span class="raw">p=${num(w.p_value,3)} · raw ${num(u.r)}</span>`;
}

// One r value for the per-season sub-table (single season => unweighted).
function rMini(pair) {
  if (!pair || pair.r===null || pair.r===undefined) return '<span class="muted">—</span>';
  const col = pair.r>0 ? "var(--pos)" : "var(--neg)";
  const sig = (pair.p_value!==null && pair.p_value<0.05) ? "sig" : "";
  return `<span class="r ${sig}" style="color:${col}">${num(pair.r)}</span>` +
         ` <span class="raw">p=${num(pair.p_value,3)}</span>`;
}

// ---- Prop builder: last season + this season two-stat scatter, weighted -----
// Per-player builder settings survive re-renders. yStat is the second stat.
const PROPS = new Map();
const STAT_LABEL = { pts:"PTS", reb:"REB", ast:"AST", tpm:"3PM", tot:"Game total", tm:"Team score", op:"Opp score" };
const STAT_NAME = { pts:"Points", reb:"Rebounds", ast:"Assists", tpm:"3PM", tot:"Game total", tm:"Team score", op:"Opp score" };
const X_STATS = ["pts", "tot", "tm", "op"], Y_STATS = ["reb", "ast", "tpm", "pts"];
const opts = (ks, cur) => ks.map(k => `<option value="${k}"${k===cur?" selected":""}>${STAT_NAME[k]}</option>`).join("");

// Default line = blended average pushed to the nearest half-point below the
// rounded mean (book-style .5 line, so no pushes out of the box).
const halfLine = m => Math.max(0.5, Math.round(m || 1) - 0.5);

function propState(p) {
  if (!PROPS.has(p.athlete_id)) {
    PROPS.set(p.athlete_id, {
      xStat: "pts",
      xLine: halfLine(p._pts),
      yStat: "reb",
      yLine: halfLine(p._reb),
    });
  }
  return PROPS.get(p.athlete_id);
}

// p (probability) -> fair American odds string.
function fairOdds(pr) {
  if (pr <= 0 || pr >= 1) return "—";
  return pr >= 0.5 ? `-${Math.round(100 * pr / (1 - pr))}`
                   : `+${Math.round(100 * (1 - pr) / pr)}`;
}

function niceStep(span, target = 7) {
  const raw = span / target;
  for (const s of [1, 2, 5, 10, 20]) if (s >= raw) return s;
  return 50;
}

// Build the SVG scatter + quadrant tiles inside the given .pb container.
function drawProp(pb, p) {
  const st = propState(p);
  const yKey = st.yStat, yLab = STAT_LABEL[yKey];
  const xKey = st.xStat, xLab = STAT_LABEL[xKey];
  // Score stats can be missing on a game ESPN didn't score; skip those.
  const games = logOf(p).filter(g => g[xKey] != null && g[yKey] != null);
  const chartEl = pb.querySelector(".pb-chart");
  const quadEl = pb.querySelector(".quads");
  if (!games.length) {
    chartEl.innerHTML = `<div class="muted" style="padding:20px 0">No ${BLEND.join(" or ")} games for this player.</div>`;
    quadEl.innerHTML = "";
    return;
  }

  // Quadrant hit rates, each game weighted by its season (gw). Over = strictly
  // greater; a game landing exactly on an integer line is a push and is
  // excluded from all four buckets. Each bucket holds [games, weight].
  const q = { oo:[0,0], ou:[0,0], uo:[0,0], uu:[0,0] };
  let push = 0, wn = 0;
  for (const g of games) {
    const x = g[xKey], y = g[yKey];
    if (x === st.xLine || y === st.yLine) { push++; continue; }
    const b = q[(x > st.xLine ? "o" : "u") + (y > st.yLine ? "o" : "u")];
    b[0]++; b[1] += gw(g); wn += gw(g);
  }
  const n = games.length - push;
  const tile = (label, [c, w]) => {
    const pr = wn ? w / wn : 0;
    return `<div class="quad"><div class="q-h">${label}</div>` +
      `<div class="q-v">${wn ? Math.round(pr * 100) : "—"}%</div>` +
      `<div class="q-s">${c}/${n} games · fair ${wn ? fairOdds(pr) : "—"}</div></div>`;
  };
  // Tiles mirror the chart's quadrants: over/over top-right, under/over
  // top-left, under/under bottom-left, over/under bottom-right.
  const oP = `${xLab} <b>o${st.xLine}</b>`, uP = `${xLab} <b>u${st.xLine}</b>`;
  const oY = `${yLab} <b>o${st.yLine}</b>`, uY = `${yLab} <b>u${st.yLine}</b>`;
  quadEl.innerHTML =
    tile(`${uP} &amp; ${oY}`, q.uo) + tile(`${oP} &amp; ${oY}`, q.oo) +
    tile(`${uP} &amp; ${uY}`, q.uu) + tile(`${oP} &amp; ${uY}`, q.ou) +
    (push ? `<div class="pb-note">${push} push${push>1?"es":""} (exactly on a line) excluded.</div>` : "");

  // Scales — pad the domain so the red lines and edge dots never clip.
  const W = 520, H = 400, ML = 46, MR = 16, MT = 14, MB = 42;
  const xs = games.map(g => g[xKey]), ys = games.map(g => g[yKey]);
  const xmax = Math.max(...xs, st.xLine) + 2;
  const xmin = Math.max(0, Math.min(...xs, st.xLine) - 2);
  const ymax = Math.max(...ys, st.yLine) + 1.5;
  const ymin = Math.max(0, Math.min(...ys, st.yLine) - 1.5);
  const X = v => ML + (v - xmin) / (xmax - xmin) * (W - ML - MR);
  const Y = v => H - MB - (v - ymin) / (ymax - ymin) * (H - MT - MB);

  // Duplicate (x,y) games collapse into one bigger dot: a muted dot sized by
  // every game at that point, with an accent dot on top sized by this
  // season's games there (so a muted ring = last-season games too).
  const cells = new Map();
  for (const g of games) {
    const k = `${g[xKey]},${g[yKey]}`;
    if (!cells.has(k)) cells.set(k, []);
    cells.get(k).push(g);
  }

  const xStep = niceStep(xmax - xmin), yStep = niceStep(ymax - ymin);
  let grid = "", labels = "";
  for (let v = Math.ceil(xmin / xStep) * xStep; v <= xmax; v += xStep) {
    grid += `<line x1="${X(v)}" y1="${MT}" x2="${X(v)}" y2="${H-MB}"/>`;
    labels += `<text x="${X(v)}" y="${H-MB+16}" text-anchor="middle">${v}</text>`;
  }
  for (let v = Math.ceil(ymin / yStep) * yStep; v <= ymax; v += yStep) {
    grid += `<line x1="${ML}" y1="${Y(v)}" x2="${W-MR}" y2="${Y(v)}"/>`;
    labels += `<text x="${ML-8}" y="${Y(v)+3.5}" text-anchor="end">${v}</text>`;
  }

  const cur = BLEND[BLEND.length - 1];
  const dot = (k, m) => {
    const [gx, gy] = k.split(",").map(Number);
    return `<circle cx="${X(gx)}" cy="${Y(gy)}" r="${5 + 2.2 * Math.sqrt(m - 1)}" data-k="${k}"/>`;
  };
  let prevDots = "", curDots = "";
  for (const [k, gs] of cells) {
    const m = gs.filter(g => g.s === cur).length;
    if (m < gs.length) prevDots += dot(k, gs.length);
    if (m) curDots += dot(k, m);
  }

  chartEl.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
       aria-label="${p.name}: ${BLEND.join(" + ")} games, ${xLab} vs ${yLab}">
      <g stroke="#2a333d" stroke-width="1">${grid}</g>
      <g fill="#8b98a5" font-size="11">${labels}</g>
      <g stroke="var(--neg)" stroke-width="1.5">
        <line x1="${X(st.xLine)}" y1="${MT}" x2="${X(st.xLine)}" y2="${H-MB}"/>
        <line x1="${ML}" y1="${Y(st.yLine)}" x2="${W-MR}" y2="${Y(st.yLine)}"/>
      </g>
      <g fill="var(--neg)" font-size="10.5">
        <text x="${Math.min(X(st.xLine)+4, W-MR-24)}" y="${MT+11}">${st.xLine}</text>
        <text x="${W-MR-4}" y="${Y(st.yLine)-5}" text-anchor="end">${st.yLine}</text>
      </g>
      <g fill="var(--prev)" stroke="#10161c" stroke-width="2">${prevDots}</g>
      <g fill="var(--accent)" stroke="#10161c" stroke-width="2">${curDots}</g>
      <text x="${(ML+W-MR)/2}" y="${H-6}" text-anchor="middle" fill="#8b98a5" font-size="12">${xLab}</text>
      <text x="12" y="${(MT+H-MB)/2}" text-anchor="middle" fill="#8b98a5" font-size="12"
        transform="rotate(-90 12 ${(MT+H-MB)/2})">${yLab}</text>
    </svg><div class="pb-tip"></div>`;

  // Hover tooltip: date · opp · result · stat line for each game on the dot.
  const tip = chartEl.querySelector(".pb-tip");
  chartEl.querySelectorAll("circle").forEach(c => {
    c.style.cursor = "pointer";
    c.onmouseenter = e => {
      const gs = cells.get(c.dataset.k);
      tip.innerHTML = gs.map(g =>
        `${g.d} ${g.loc} ${g.opp} (${g.res}${g.tm!=null?` ${g.tm}-${g.op}`:""}) — <b>${g.pts} pts, ${g.reb} reb, ${g.ast} ast, ${g.tpm} 3pm</b>`
      ).join("<br>");
      tip.style.display = "block";
      const bb = chartEl.getBoundingClientRect(), cb = c.getBoundingClientRect();
      let tx = cb.left - bb.left + 14, ty = cb.top - bb.top - 8;
      tip.style.left = "0px"; tip.style.top = "0px";
      const tw = tip.offsetWidth;
      if (tx + tw > W - 4) tx = cb.left - bb.left - tw - 14;
      tip.style.left = tx + "px"; tip.style.top = ty + "px";
    };
    c.onmouseleave = () => { tip.style.display = "none"; };
  });
}

// Static shell for the builder; drawProp fills in the chart + tiles.
function propHTML(p) {
  const st = propState(p);
  const g = logOf(p).filter(x => x[st.xStat] != null);
  const hid = nShortHidden(p);
  const [last, cur] = BLEND;
  const nCur = g.filter(x => x.s === cur).length, nLast = g.length - nCur;
  const wAll = nLast * SW[last] + nCur * SW[cur];
  const share = wAll ? Math.round(100 * nCur * SW[cur] / wAll) : 0;
  return `<div class="pb" data-id="${p.athlete_id}">
    <div class="pb-title">Prop builder — last season + this season, weighted</div>
    <div class="pb-sub">${g.length} game${g.length===1?"":"s"}: ${nLast} last season (${last}) + ${nCur} this
      season (${cur}). Every dot is one game (bigger dot = same score in multiple games). Set your
      lines; the tiles show how often each over/under combo hit, with the fair odds that hit rate
      implies. Hit rates are weighted: a ${cur} game counts ${(SW[cur] / SW[last]).toFixed(1)}× a ${last}
      game (the same recency weights as the r columns), so this season is ${share}% of the weight for now.${hid ?
      ` ${hid} short-minute game${hid===1?"":"s"} hidden (under 60% of his usual minutes).` : ""}</div>
    <div class="pb-legend"><span><i style="background:var(--accent)"></i>${cur} · this season</span>
      <span><i style="background:var(--prev)"></i>${last} · last season</span></div>
    <div class="pb-controls">
      <label>1st stat<select data-f="xStat">${opts(X_STATS, st.xStat)}</select></label>
      <label>${STAT_LABEL[st.xStat]} line<input type="number" step="0.5" min="0" value="${st.xLine}" data-f="xLine"></label>
      <label>2nd stat<select data-f="yStat">${opts(Y_STATS, st.yStat)}</select></label>
      <label>${STAT_LABEL[st.yStat]} line<input type="number" step="0.5" min="0" value="${st.yLine}" data-f="yLine"></label>
    </div>
    <div class="pb-body"><div class="pb-chart"></div><div class="quads"></div></div>
  </div>`;
}

// Bind builder controls + first draw. Input changes redraw only this builder
// (no full table re-render, so typing keeps focus).
function initProp(pb) {
  const p = DATA.players.find(x => x.athlete_id === pb.dataset.id);
  if (!p) return;
  pb.querySelectorAll("[data-f]").forEach(el => {
    const f = el.dataset.f;
    const h = () => {
      const st = propState(p);
      if (f === "xStat" || f === "yStat") {
        // New stat -> reset its line to the blended mean, relabel the input.
        const a = f[0];
        st[f] = el.value;
        st[a + "Line"] = halfLine(p["_" + el.value]);
        const inp = pb.querySelector(`[data-f="${a}Line"]`);
        inp.value = st[a + "Line"];
        inp.parentElement.firstChild.textContent = STAT_LABEL[el.value] + " line";
        // Game counts in the subtitle depend on which games have a score.
        if (f === "xStat") {
          pb.outerHTML = propHTML(p);
          initProp(document.querySelector(`.pb[data-id="${p.athlete_id}"]`));
          return;
        }
      } else {
        const v = parseFloat(el.value);
        if (!Number.isFinite(v) || v < 0) return;
        st[f] = v;
      }
      drawProp(pb, p);
    };
    el.tagName === "SELECT" ? el.onchange = h : el.oninput = h;
  });
  drawProp(pb, p);
}

// Expanded per-season history block (rendered in a full-width detail row).
function detailHTML(p) {
  const yrs = Object.keys(p.by_season||{}).sort();
  let body = yrs.map(y => {
    const s = p.by_season[y];
    const sg = s.short_games ? ` <span class="muted" title="short-minute games left out">(−${s.short_games})</span>` : "";
    return `<tr><td class="l"><b>${y}</b></td><td>${s.games}${sg}</td><td>${num(s.min_mean,1)}</td>`+
           `<td>${num(s.pts_mean,1)}</td><td>${num(s.reb_mean,1)}</td><td>${num(s.ast_mean,1)}</td><td>${num(s.tpm_mean,1)}</td>`+
           `<td class="l">${rMini(s.pts_reb)}</td><td class="l">${rMini(s.pts_ast)}</td><td class="l">${rMini(s.pts_3pm)}</td>`+
           `<td class="l">${rMini(s.tot_reb)}</td><td class="l">${rMini(s.tm_reb)}</td><td class="l">${rMini(s.op_reb)}</td></tr>`;
  }).join("");
  // Pooled (all seasons, recency-weighted) reference row.
  body += `<tr class="pool"><td class="l"><b>Pooled</b> <span class="muted">(wtd)</span></td>`+
          `<td>${p.n_games}</td><td>${num(p.min_mean,1)}</td>`+
          `<td>${num(p.pts_mean,1)}</td><td>${num(p.reb_mean,1)}</td><td>${num(p.ast_mean,1)}</td><td>${num(p.tpm_mean,1)}</td>`+
          `<td class="l">${rCell(p.pts_reb)}</td><td class="l">${rCell(p.pts_ast)}</td><td class="l">${rCell(p.pts_3pm)}</td>`+
          `<td class="l">${rCell(p.tot_reb)}</td><td class="l">${rCell(p.tm_reb)}</td><td class="l">${rCell(p.op_reb)}</td></tr>`;
  return `<div class="detail-wrap">${propHTML(p)}<div class="detail-h">Per-season history — box stats &amp; within-season correlations`+
         ` <span class="muted">(left columns above blend ${BLEND.join(" + ")}, weighted like the prop builder; r columns pool every season, recency-weighted)</span></div>`+
         `<table class="sub"><thead><tr><th class="l">Season</th><th>G</th><th>Min</th><th>Pts</th><th>Reb</th><th>Ast</th><th>3PM</th>`+
         `<th class="l">PTS·REB</th><th class="l">PTS·AST</th><th class="l">PTS·3PM</th>`+
         `<th class="l">TOT·REB</th><th class="l">TM·REB</th><th class="l">OPP·REB</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

function sortKey(p, key) {
  if (key.includes(".")) { const v = get(p, key)?.r; return v===null||v===undefined?-Infinity:v; }
  const v = get(p, key); return (typeof v==="string") ? v.toLowerCase() : (v??-Infinity);
}

function render() {
  if (!DATA) return;
  const q = document.getElementById("search").value.trim().toLowerCase();
  const minMpg = +document.getElementById("minmpg").value || 0;
  const minG = +document.getElementById("ming").value || 0;
  // No baked-in filtering: show everyone (negative correlations included).
  // The two inputs are optional, off by default (0). Filter on the blended
  // last + this season figures that the left columns display.
  let rows = DATA.players.filter(p => p._g >= minG && (p._min||0) >= minMpg);
  if (MODE === "today") {
    const ids = TODAY_IDS || new Set(DATA.schedule_today.team_ids);
    rows = rows.filter(p => p.team_id && ids.has(p.team_id));
  }
  if (q) rows = rows.filter(p => p.name.toLowerCase().includes(q));

  rows.sort((a,b) => {
    const av = sortKey(a, SORT.key), bv = sortKey(b, SORT.key);
    if (av < bv) return SORT.dir; if (av > bv) return -SORT.dir; return 0;
  });

  const thead = document.querySelector("#tbl thead");
  thead.innerHTML = "<tr>" + COLS.map(c => {
    const on = c.k === SORT.key ? "sorted " + (SORT.dir>0?"asc":"") : "";
    return `<th class="${c.l?'l ':''}${on}" data-k="${c.k}"${c.ht?` title="${c.ht}"`:""}>${c.h}</th>`;
  }).join("") + "</tr>";
  thead.querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (SORT.key === k) SORT.dir *= -1;
    else SORT = { key:k, dir: k.includes(".")||["_g","effective_n","_min","_pts","_reb","_ast","_tpm"].includes(k) ? -1 : 1 };
    const sel = document.getElementById("sortsel");
    if ([...sel.options].some(o => o.value === k)) sel.value = k;
    render();
  });

  const tbody = document.querySelector("#tbl tbody");
  tbody.innerHTML = rows.map(p => {
    const main = `<tr class="prow" data-id="${p.athlete_id}">` +
      COLS.map(c => `<td class="${c.l?'l':''}">${c.v(p)}</td>`).join("") + "</tr>";
    const det = EXPANDED.has(p.athlete_id)
      ? `<tr class="drow"><td colspan="${COLS.length}">${detailHTML(p)}</td></tr>` : "";
    return main + det;
  }).join("");
  tbody.querySelectorAll("tr.prow").forEach(tr => tr.onclick = () => {
    const id = tr.dataset.id;
    if (EXPANDED.has(id)) EXPANDED.delete(id); else EXPANDED.add(id);
    render();
  });
  tbody.querySelectorAll(".pb").forEach(initProp);

  document.getElementById("count").textContent =
    `${rows.length} player${rows.length===1?"":"s"}` + (MODE==="today" ? " playing today" : "");
}

function setMode(m) {
  MODE = m;
  document.querySelectorAll("#toggle button").forEach(b =>
    b.classList.toggle("on", b.dataset.mode === m));
  render();
}

// Box stats shown in the left columns: last season + this season, each game
// weighted by its season (the same per-game recency weights as the pooled r).
// Re-run when the short-minute toggle changes. No games -> "—".
function blendBox() {
  DATA.players.forEach(p => {
    const gs = logOf(p);
    // Per-field weight totals: game scores can be missing on a few games.
    const sum = { min:0, pts:0, reb:0, ast:0, tpm:0, tot:0, tm:0, op:0 };
    const w = { ...sum };
    for (const g of gs) {
      const k = gw(g);
      for (const f in sum) if (g[f] != null) { sum[f] += k * g[f]; w[f] += k; }
    }
    p._g = gs.length;
    for (const f in sum) p["_" + f] = w[f] ? sum[f] / w[f] : null;
  });
}

async function init() {
  try {
    const r = await fetch("./data/nba_correlations.json");
    if (!r.ok) throw new Error("could not load data/nba_correlations.json");
    DATA = await r.json();
  } catch (e) {
    document.getElementById("err").style.display = "block";
    document.getElementById("err").textContent = "Error: " + e.message +
      " — run scripts/nba_fetch_correlations.py first.";
    return;
  }

  SW = DATA.weighting?.per_game_season_weights || {};
  BLEND = DATA.recent_seasons || [];
  blendBox();

  const wtxt = Object.entries(SW).map(([k,v])=>`${k}: ${v}`).join(", ");
  document.getElementById("meta").innerHTML =
    `Seasons ${DATA.seasons.join("–")} · regular season, short-minute games (&lt;60% of usual) excluded from r · recency weights (${wtxt}) · ` +
    `${DATA.players.length} players · box stats + prop builder = ${BLEND.join(" + ")} weighted · r = all seasons pooled/weighted · ` +
    `click a player for the prop builder + per-season history · generated ${new Date(DATA.generated_at).toLocaleString()}`;

  // Live schedule for the toggle; fall back to the baked snapshot.
  const live = await liveTodayIds();
  if (live) { TODAY_IDS = live.ids; renderSched(live.games, true); }
  else {
    TODAY_IDS = new Set(DATA.schedule_today.team_ids);
    renderSched(DATA.schedule_today.games.map(g=>({matchup:g.matchup, st:g.state})), false);
  }

  document.querySelectorAll("#toggle button").forEach(b =>
    b.onclick = () => setMode(b.dataset.mode));
  document.getElementById("search").oninput = render;
  document.getElementById("minmpg").oninput = render;
  document.getElementById("ming").oninput = render;
  document.getElementById("shortg").onchange = e => {
    SHOW_SHORT = e.target.checked; blendBox(); render();
  };
  document.getElementById("sortsel").onchange = e => {
    SORT = { key: e.target.value, dir: -1 }; render();
  };
  render();
}
init();
</script>
</body>
</html>
