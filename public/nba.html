<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NBA PTS Correlations</title>
<style>
  :root {
    --bg:#0f1419; --panel:#1a2129; --line:#2a333d; --txt:#e6edf3;
    --muted:#8b98a5; --accent:#f5a623; --pos:#3fb950; --neg:#f85149;
    --prev:#6f9fd0; --old:#4e5965;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:18px 22px 10px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:19px; }
  .sub { color:var(--muted); font-size:12.5px; }
  .controls { display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    padding:12px 22px; border-bottom:1px solid var(--line); position:sticky;
    top:0; background:var(--bg); z-index:5; }
  .toggle { display:inline-flex; border:1px solid var(--line); border-radius:8px;
    overflow:hidden; }
  .toggle button { background:transparent; color:var(--muted); border:0;
    padding:7px 14px; font-size:13px; cursor:pointer; }
  .toggle button.on { background:var(--accent); color:#1a1a1a; font-weight:600; }
  input[type=search], input[type=number] { background:var(--panel); border:1px solid var(--line);
    color:var(--txt); border-radius:8px; padding:7px 10px; font-size:13px; }
  input[type=search] { width:180px; }
  label.muted input { margin-left:4px; }
  select { background:var(--panel); border:1px solid var(--line); color:var(--txt);
    border-radius:8px; padding:7px 8px; font-size:13px; }
  .count { color:var(--muted); font-size:12.5px; margin-left:auto; }
  .sched { padding:8px 22px; border-bottom:1px solid var(--line); color:var(--muted);
    font-size:12px; display:flex; flex-wrap:wrap; gap:8px 14px; }
  .sched .g { white-space:nowrap; }
  .sched b { color:var(--txt); }
  .wrap { overflow-x:auto; padding:0 12px 60px; }
  table { border-collapse:collapse; width:100%; min-width:1240px; }
  th,td { padding:7px 9px; text-align:right; white-space:nowrap; }
  th { position:sticky; top:0; background:var(--panel); color:var(--muted);
    font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;
    cursor:pointer; border-bottom:1px solid var(--line); user-select:none; }
  th:hover { color:var(--txt); }
  th.sorted::after { content:" \25BC"; font-size:9px; }
  th.sorted.asc::after { content:" \25B2"; }
  td.l, th.l { text-align:left; }
  tbody tr { border-bottom:1px solid #20272f; }
  tbody tr:hover { background:#161d24; }
  .name { font-weight:600; }
  .inj { display:inline-flex; align-items:center; gap:4px; margin-left:7px; font-size:10.5px;
    font-weight:700; letter-spacing:.03em; cursor:help; color:var(--txt); }
  .inj i { width:7px; height:7px; border-radius:50%; background:#f4c430; }
  .inj.out i { background:var(--neg); }
  .team { color:var(--muted); font-size:12px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--pos); margin-right:6px; vertical-align:middle; }
  .r { font-weight:600; }
  .raw { color:var(--muted); font-size:11.5px; }
  .sig { text-decoration:underline; text-decoration-color:var(--accent);
    text-underline-offset:2px; }
  .muted { color:var(--muted); }
  .err { color:var(--neg); padding:20px 22px; }
  .care { display:inline-block; width:12px; color:var(--muted); }
  tbody tr.prow { cursor:pointer; }
  tbody tr.prow:hover .care { color:var(--accent); }
  tbody tr.drow > td { padding:0; background:#10161c; }
  /* contain: the panel's content can't widen the table; its own scroll
     wrappers (.sub-scroll, .pr-out) take any overflow instead. */
  .detail-wrap { padding:10px 16px 14px; text-align:left; white-space:normal; contain:inline-size; }
  .detail-h { font-size:12px; color:var(--muted); margin-bottom:8px; }
  table.sub { width:auto; min-width:0; border-collapse:collapse; }
  table.sub th { position:static; top:auto; background:transparent; cursor:default;
    border-bottom:1px solid var(--line); font-size:10.5px; padding:4px 12px; }
  table.sub td { padding:4px 12px; border-bottom:1px solid #20272f; white-space:nowrap; }
  table.sub tr.pool td { border-top:1px solid var(--line); }

  /* --- prop builder (every pulled season, scatter) --- */
  .pb { border:1px solid var(--line); border-radius:10px; background:var(--panel);
    padding:12px 14px 14px; margin-bottom:14px; }
  .pb-title { font-size:13px; font-weight:600; margin-bottom:2px; }
  .pb-sub { color:var(--muted); font-size:11.5px; margin-bottom:10px; }
  .pb-legend { display:flex; flex-wrap:wrap; gap:6px 16px; color:var(--muted);
    font-size:11.5px; margin-bottom:10px; }
  .pb-legend i { display:inline-block; width:9px; height:9px; border-radius:50%;
    margin-right:6px; vertical-align:-1px; }
  .pb-controls { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center;
    margin-bottom:12px; }
  .pb-controls label { color:var(--muted); font-size:12px; }
  .pb-controls input[type=number] { width:70px; margin-left:6px; }
  .pb-controls select { margin-left:6px; }
  .pb-body { display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start; }
  .pb-chart { position:relative; }
  .pb-chart svg { display:block; }
  .quads { display:grid; grid-template-columns:repeat(2, minmax(150px, 1fr));
    gap:8px; min-width:310px; flex:1; max-width:420px; }
  .quad { border:1px solid var(--line); border-radius:8px; padding:9px 11px;
    background:#10161c; }
  .quad .q-h { color:var(--muted); font-size:11px; line-height:1.35; }
  .quad .q-h b { color:var(--txt); }
  .quad .q-v { font-size:20px; font-weight:600; margin:3px 0 1px; }
  .quad .q-s { color:var(--muted); font-size:11px; }
  .pb-note { color:var(--muted); font-size:11px; margin-top:8px; grid-column:1/-1; }
  .pb-tip { position:absolute; pointer-events:none; display:none; z-index:10;
    background:#0b0f14; border:1px solid var(--line); border-radius:7px;
    padding:6px 9px; font-size:11.5px; line-height:1.4; white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.45); }
  .pb-tip b { color:var(--accent); }

  /* --- SGP pricer (copula on the shrunk r) --- */
  /* Third item of .pb-body: beside the tiles when the screen has room, below
     the chart (full width) when it doesn't. min-width:0 lets its table
     scroll instead of widening the panel. */
  .pr { flex:1 1 560px; min-width:0; }
  .pr-sub { color:var(--muted); font-size:11.5px; margin-bottom:10px; max-width:900px; }
  .pr .pb-controls input[type=text] { width:74px; margin-left:6px; background:var(--panel);
    border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:7px 10px; font-size:13px; }
  .pr .pb-controls input[type=number] { width:74px; }
  .payin { width:92px; background:var(--panel); border:1px solid var(--line); color:var(--txt);
    border-radius:7px; padding:4px 7px; font-size:12.5px; text-align:right; }
  .pr table.sub td.fv { font-weight:600; color:var(--accent); }
  .fvw { display:inline-flex; align-items:center; gap:6px; }
  .sortw { display:inline-flex; align-items:center; gap:6px; }
  .sgn { background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:8px;
    min-width:34px; padding:6px 8px; font-size:14px; font-weight:600; cursor:pointer; }
  .plug { margin-left:auto; border:1px solid var(--accent); color:var(--accent); border-radius:8px;
    padding:6px 11px; font-size:12.5px; }
  .plug b { font-size:14px; }
  .pr-out, .sub-scroll { overflow-x:auto; }
  .nvbtn { font-size:12.5px; border-color:var(--accent); color:var(--accent); }
  .nvbtn:disabled { opacity:.5; cursor:wait; }
  .nv-out { color:var(--muted); font-size:11.5px; margin-top:8px; line-height:1.9; }
  .nv-out:empty { display:none; }
  .nv-chip { background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:7px;
    padding:2px 7px; margin:0 3px; font-size:11.5px; cursor:pointer; white-space:nowrap; }
  .nv-chip:hover { border-color:var(--accent); }
  .nv-chip.on { border-color:var(--accent); color:var(--accent); }
  .nv-chip.wide { border-style:dashed; color:var(--muted); }
  .nv-chip.wide.on { color:var(--accent); }
  .nv-chip small { font-size:10px; opacity:.8; }

  /* The player panel sits in a table row as wide as the table (~1780px), so
     on a narrower screen it ran off the right edge (and the SGP pricer with
     it). Pin it to the visible width; --vw is the page's width without the
     scrollbar, set from JS. */
  .detail-wrap { position:sticky; left:0; width:min(100%, calc(var(--vw, 100vw) - 24px)); }
  @media (max-width: 900px) {
    .pb-chart svg { max-width:100%; height:auto; }
  }

  /* Phones: each player is a card (name / box stats / r values) instead of a
     16-column row; the Sort menu stands in for the hidden header. 16px
     inputs stop iOS zooming in on focus. */
  @media (max-width: 700px) {
    header { padding:12px 14px 8px; }
    h1 { font-size:17px; }
    h1 .h1sub { display:block; font-size:12px !important; margin-top:2px; }
    #meta { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
      overflow:hidden; cursor:pointer; }
    #meta.open { display:block; }
    .controls { position:static; padding:10px 14px; gap:8px 10px; }
    .toggle { flex:1 1 auto; }
    .toggle button { flex:1; padding:9px 8px; white-space:nowrap; }
    input[type=search] { flex:1 1 100%; width:auto; }
    input[type=search], input[type=number], input[type=text], select { font-size:16px; }
    #sortsel { max-width:60vw; }
    .count { margin-left:0; width:100%; }
    .sched { padding:8px 14px; }
    .wrap { padding:0 8px 60px; overflow-x:visible; }
    #tbl, #tbl > tbody { display:block; min-width:0; width:auto; }
    #tbl > thead { display:none; }
    #tbl > tbody > tr.prow { display:grid; grid-template-columns:repeat(21, minmax(0,1fr));
      row-gap:6px; padding:10px 4px; }
    #tbl > tbody > tr.prow > td { padding:0 2px; text-align:left; min-width:0; }
    #tbl td.c-name { grid-column:span 15; font-size:15px; overflow:hidden; text-overflow:ellipsis; }
    #tbl td.c-tag { grid-column:span 3; text-align:right; color:var(--muted); font-size:12px; align-self:center; }
    #tbl td.c-stat { grid-column:span 3; text-align:center; font-variant-numeric:tabular-nums; }
    #tbl td.c-r { grid-column:span 7; text-align:center; font-size:15px; }
    #tbl td[data-label]::before { content:attr(data-label); display:block; font-size:10px;
      color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
    #tbl td.srt::before { color:var(--accent) !important; font-weight:700; }
    #tbl tr.prow .raw { display:none; }
    #tbl > tbody > tr.drow, #tbl > tbody > tr.drow > td { display:block; }
    .detail-wrap { position:static; width:auto; padding:6px 2px 14px; }
    .pb { padding:10px 10px 12px; }
    .quads { min-width:0; grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .pr .pb-controls input[type=text] { width:84px; }
  }
</style>
</head>
<body>
<header>
  <h1>NBA Points Correlations <span class="muted h1sub" style="font-size:13px">— PTS·REB, PTS·AST, PTS·3PM &amp; game score·REB</span></h1>
  <div class="sub" id="meta">Loading…</div>
</header>

<div class="controls">
  <div class="toggle" id="toggle">
    <button data-mode="today" class="on">Playing today</button>
    <button data-mode="all">All players</button>
  </div>
  <input type="search" id="search" placeholder="Filter by name…" />
  <label class="muted" title="Set to 0 to show everyone (incl. low-minute players).">Min mpg
    <input type="number" id="minmpg" value="20" min="0" step="1" style="width:56px" />
  </label>
  <label class="muted" title="Optional. 0 = show everyone (small samples included).">Min G
    <input type="number" id="ming" value="0" min="0" step="1" style="width:56px" />
  </label>
  <span class="muted" id="outn" title="Players ESPN's injury report lists as Out (or suspended) are always left off. Day-to-day / questionable players stay, with a badge."></span>
  <label class="muted" title="Games under 60% of a player's median minutes that season (injury exits, blowout rest). Always left out of the r values; this only shows them in the box stats and prop builder.">
    <input type="checkbox" id="shortg" /> Show short-min games
  </label>
  <span class="sortw"><label class="muted">Sort:
    <select id="sortsel">
      <option value="pts_reb.shrunk">PTS·REB r</option>
      <option value="pts_ast.shrunk">PTS·AST r</option>
      <option value="pts_3pm.shrunk">PTS·3PM r</option>
      <option value="tot_reb.shrunk">Game total·REB r</option>
      <option value="tm_reb.shrunk">Team score·REB r</option>
      <option value="op_reb.shrunk">Opp score·REB r</option>
      <option value="_pts">Points</option>
      <option value="_reb">Rebounds</option>
      <option value="_ast">Assists</option>
      <option value="_tpm">3PM</option>
      <option value="_min">Minutes</option>
    </select>
  </label><button type="button" class="sgn" id="sortdir" title="Flip the sort order"></button></span>
  <span class="count" id="count"></span>
</div>

<div class="sched" id="sched"></div>
<div class="wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
<div class="err" id="err" style="display:none"></div>

<script>
const SCOREBOARD = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard";
const INJURIES = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/injuries";
let INJ = new Map();    // athlete_id -> {status, out, note, ret} from ESPN's injury report
let DATA = null;        // full payload
let TODAY_IDS = null;   // Set<string> of team_ids playing today (live)
let MODE = "today";
let SORT = { key: "pts_reb.shrunk", dir: -1 };  // dir -1 = high first, 1 = low first (A–Z)
let BLEND = [];         // seasons, oldest first — blended by box stats + prop builder
let SW = {};            // per-game season weights (recency tilt), from the data file
const gw = g => SW[g.s] || 0;
let SHOW_SHORT = false;  // include games flagged `short` (low minutes) in box stats + prop builder
const logOf = p => (p.recent_games || []).filter(g => SHOW_SHORT || !g.short);
const nShortHidden = p => SHOW_SHORT ? 0 : (p.recent_games || []).filter(g => g.short).length;

const num = (v, d=2) => (v===null||v===undefined||Number.isNaN(v)) ? "—" : v.toFixed(d);
const get = (o, path) => path.split(".").reduce((a,k)=> (a==null?a:a[k]), o);

async function liveTodayIds() {
  // Use the browser's local date so the toggle is correct on any day.
  const d = new Date();
  const ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  try {
    const r = await fetch(`${SCOREBOARD}?dates=${ymd}`);
    if (!r.ok) throw 0;
    const j = await r.json();
    const ids = new Set(), games = [];
    for (const e of (j.events||[])) {
      const comp = e.competitions?.[0]?.competitors || [];
      const pair = comp.map(c => ({id:String(c.team.id), ab:c.team.abbreviation}));
      pair.forEach(p => ids.add(p.id));
      const st = e.status?.type?.shortDetail || e.status?.type?.state || "";
      games.push({ matchup: pair.map(p=>p.ab).reverse().join(" @ "), st });
    }
    return { ids, games, date: ymd, live:true };
  } catch (_) {
    return null; // caller falls back to baked snapshot
  }
}

// ESPN's league-wide injury report (CORS open). Keyed by the athlete id in
// each entry's player-card link, the same id as the data file's athlete_id.
async function loadInjuries() {
  try {
    const r = await fetch(INJURIES);
    if (!r.ok) return;
    const m = new Map();
    for (const t of (await r.json()).injuries || []) {
      for (const i of t.injuries || []) {
        const id = (i.athlete?.links?.[0]?.href || "").match(/\/id\/(\d+)/)?.[1];
        if (!id) continue;
        // The label on ESPN's player page (GTD / OUT / OFS = out for the
        // season) is details.fantasyStatus. It's the current one: a player
        // ruled out of last night's game keeps status "Out" but shows GTD
        // for the next. The status word is only a fallback.
        const status = i.status || "";
        const lab = (i.details?.fantasyStatus?.abbreviation ||
                     INJ_ABBR[status.toLowerCase()] || status).toUpperCase();
        m.set(id, { lab, status, out: /^(OUT|OFS|SUSP)/.test(lab), note: i.shortComment || "",
                    ret: i.details?.returnDate || "" });
      }
    }
    INJ = m;
  } catch (_) { /* no report: nobody hidden, no badges */ }
}

const INJ_ABBR = { "day-to-day":"GTD", "questionable":"GTD", "doubtful":"GTD", "probable":"GTD",
                   "out":"OUT", "suspension":"SUSP" };
// ESPN-style status: colored dot + ESPN's label (yellow GTD, red OUT).
function injBadge(p) {
  const i = INJ.get(p.athlete_id);
  if (!i) return "";
  const tip = `${i.lab} (${i.status})${i.ret ? ` · est. return ${i.ret}` : ""}${i.note ? ` — ${i.note}` : ""}`;
  return `<span class="inj${i.out ? " out" : ""}" title="${tip.replace(/"/g, "&quot;")}"><i></i>${i.lab}</span>`;
}

function renderSched(games, live) {
  const el = document.getElementById("sched");
  if (!games || !games.length) { el.textContent = "No NBA games today."; return; }
  el.innerHTML = `<span class="muted">${live?"Today’s slate (live)":"Today’s slate"}:</span> ` +
    games.map(g => `<span class="g"><b>${g.matchup}</b>${g.st?` <span class="muted">${g.st}</span>`:""}</span>`).join("");
}

const SHRUNK_HT = "Plug-in r = the binary correlation to put in a devig calculator " +
  "(joint = pA·pB + r·√(pA(1−pA)·pB(1−pB))) for an Over+Over or Under+Under on lines near the median; " +
  "flip its sign for an Over/Under mix. Expand the player for the exact value at any lines. " +
  "Margin r = correlation of the whole stat lines: the player's own recency-weighted r pulled toward the " +
  "typical r of rotation players in a similar role, more so the noisier the sample (one player's r " +
  "carries about 0.10 of noise). Plug-in r comes from it through a Gaussian copula.";

// Binary correlation that a margin r implies when both legs sit at their
// median (Gaussian copula; the arcsine law). Lines off the median shrink it.
const plugR = r => 2 / Math.PI * Math.asin(r);

// Box-score columns (G..3PM) blend every pulled season (BLEND), each
// game weighted by its season, via the _g/_min/... fields precomputed in
// init(). The correlation columns remain pooled + recency-weighted across
// every season; expand a row for the per-season history.
const COLS = [
  { k:"name", h:"Player", l:true,  v:p=>`<span class="care" >${EXPANDED.has(p.athlete_id)?"▾":"▸"}</span>${TODAY_IDS&&TODAY_IDS.has(p.team_id)?'<span class="dot"></span>':''}<span class="name">${p.name}</span>${injBadge(p)}` },
  { k:"team_abbr", h:"Tm", l:true, v:p=>`<span class="team">${p.team_abbr||"—"}</span>` },
  { k:"position", h:"Pos", l:true, v:p=>p.position||"—" },
  { k:"_g", h:"G", ht:"Games across the pulled seasons (short-minute games hidden unless toggled)", v:p=>p._g },
  { k:"effective_n", h:"nEff", ht:"Effective sample size of the pooled weighted correlation (r columns are within-season: each season centered on its own average, then pooled)", v:p=>num(p.effective_n,1) },
  { k:"_min", h:"Min", v:p=>num(p._min,1) },
  { k:"_pts", h:"Pts", v:p=>num(p._pts,1) },
  { k:"_reb", h:"Reb", v:p=>num(p._reb,1) },
  { k:"_ast", h:"Ast", v:p=>num(p._ast,1) },
  { k:"_tpm", h:"3PM", v:p=>num(p._tpm,1) },
  { k:"pts_reb.shrunk", h:"PTS·REB r", ht:SHRUNK_HT, v:p=>rCell(p.pts_reb) },
  { k:"pts_ast.shrunk", h:"PTS·AST r", ht:SHRUNK_HT, v:p=>rCell(p.pts_ast) },
  { k:"pts_3pm.shrunk", h:"PTS·3PM r", ht:SHRUNK_HT, v:p=>rCell(p.pts_3pm) },
  { k:"tot_reb.shrunk", h:"TOT·REB r", ht:"Final game total (both teams) vs his rebounds. Negative = more boards in low-scoring games (pairs with game Under + REB Over). " + SHRUNK_HT, v:p=>rCell(p.tot_reb) },
  { k:"tm_reb.shrunk", h:"TM·REB r", ht:"His team's final score vs his rebounds. " + SHRUNK_HT, v:p=>rCell(p.tm_reb) },
  { k:"op_reb.shrunk", h:"OPP·REB r", ht:"Opponent's final score vs his rebounds. " + SHRUNK_HT, v:p=>rCell(p.op_reb) },
];
const EXPANDED = new Set();

// Headline = plug-in r from the shrunk margin r; files without a shrunk r
// fall back to the data r. Small text = the margin r plus the player's own
// weighted r, underlined when p < 0.05.
function rCell(pair, full) {
  if (!pair) return "—";
  const w = pair.weighted, s = pair.shrunk;
  if (w.r===null) return "—";
  const m = s ? s.r : w.r, v = plugR(m);
  const col = v>0 ? "var(--pos)" : "var(--neg)";
  const sig = (w.p_value!==null && w.p_value<0.05) ? "sig" : "";
  const why = ` title="binary correlation at median lines from margin r ${num(m,3)}` +
    `${s ? ` (role prior ${num(s.prior,3)}, ${Math.round(100*s.w)}% weight on the player's own r)` : ""}; flip the sign for an Over/Under mix"`;
  return `<span class="r" style="color:${col}"${why}>${num(v)}</span> <span class="raw">` +
    `margin ${num(m)} · data <span class="${sig}">${num(w.r)}</span>${full ? ` · p=${num(w.p_value,3)}` : ""}` +
    `${full && s ? ` · prior ${num(s.prior)}` : ""}</span>`;
}

// One r value for the per-season sub-table (single season => unweighted).
function rMini(pair) {
  if (!pair || pair.r===null || pair.r===undefined) return '<span class="muted">—</span>';
  const col = pair.r>0 ? "var(--pos)" : "var(--neg)";
  const sig = (pair.p_value!==null && pair.p_value<0.05) ? "sig" : "";
  return `<span class="r ${sig}" style="color:${col}">${num(pair.r)}</span>` +
         ` <span class="raw">p=${num(pair.p_value,3)}</span>`;
}

// ---- Prop builder: two-stat scatter over every pulled season, weighted -----
// Per-player builder settings survive re-renders. yStat is the second stat.
const PROPS = new Map();
const STAT_LABEL = { pts:"PTS", reb:"REB", ast:"AST", tpm:"3PM", tot:"Game total", tm:"Team score", op:"Opp score" };
const STAT_NAME = { pts:"Points", reb:"Rebounds", ast:"Assists", tpm:"3PM", tot:"Game total", tm:"Team score", op:"Opp score" };
const X_STATS = ["pts", "tot", "tm", "op"], Y_STATS = ["reb", "ast", "tpm", "pts"];
const opts = (ks, cur) => ks.map(k => `<option value="${k}"${k===cur?" selected":""}>${STAT_NAME[k]}</option>`).join("");

// Default line = blended average pushed to the nearest half-point below the
// rounded mean (book-style .5 line, so no pushes out of the box).
const halfLine = m => Math.max(0.5, Math.round(m || 1) - 0.5);

function propState(p) {
  if (!PROPS.has(p.athlete_id)) {
    PROPS.set(p.athlete_id, {
      xStat: "pts",
      xLine: halfLine(p._pts),
      yStat: "reb",
      yLine: halfLine(p._reb),
    });
  }
  return PROPS.get(p.athlete_id);
}

// ---- SGP pricer: Gaussian copula on the shrunk r ---------------------------
// The r columns are margin correlations (whole stat lines). A same-game
// parlay only cares whether each leg clears its line, so the joint price
// comes from a bivariate normal at the two legs' quantiles: the binary
// correlation that implies shrinks as the lines move off the median. Plugging
// a margin r straight into the binary formula overstates it ~1.5x.
const PAIR_KEY = { "pts|reb":"pts_reb", "pts|ast":"pts_ast", "pts|tpm":"pts_3pm",
                   "tot|reb":"tot_reb", "tm|reb":"tm_reb", "op|reb":"op_reb" };

// Normal CDF from erf (Abramowitz-Stegun 7.1.26, error < 1.5e-7).
function ncdf(x) {
  const t = 1 / (1 + 0.3275911 * Math.abs(x) / Math.SQRT2);
  const e = t * (0.254829592 + t * (-0.284496736 + t * (1.421413741 +
            t * (-1.453152027 + t * 1.061405429)))) * Math.exp(-x * x / 2);
  return x >= 0 ? 1 - e / 2 : e / 2;
}
function nppf(pr) {
  let lo = -10, hi = 10;
  for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (ncdf(m) < pr) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
// P(U below its a-quantile and V below its b-quantile) for standard normals
// with correlation r: Plackett's identity, Simpson's rule over rho in [0, r].
function copulaJoint(r, a, b) {
  const x = nppf(a), y = nppf(b), n = 200, h = r / n;
  let tot = 0;
  for (let i = 0; i <= n; i++) {
    const rho = i * h, q = 1 - rho * rho;
    const f = Math.exp(-(x * x - 2 * rho * x * y + y * y) / (2 * q)) / (2 * Math.PI * Math.sqrt(q));
    tot += f * (i === 0 || i === n ? 1 : i % 2 ? 4 : 2);
  }
  return a * b + tot * h / 3;
}
// "+117" / "117" / "-133" -> implied probability; null if not American odds.
function oddsProb(txt) {
  const o = parseFloat(String(txt || "").replace(/\s/g, ""));
  if (!Number.isFinite(o) || Math.abs(o) < 100) return null;
  return o > 0 ? 100 / (o + 100) : -o / (-o + 100);
}

// p (probability) -> fair American odds string.
function fairOdds(pr) {
  if (pr <= 0 || pr >= 1) return "—";
  return pr >= 0.5 ? `-${Math.round(100 * pr / (1 - pr))}`
                   : `+${Math.round(100 * (1 - pr) / pr)}`;
}

function niceStep(span, target = 7) {
  const raw = span / target;
  for (const s of [1, 2, 5, 10, 20]) if (s >= raw) return s;
  return 50;
}

// Build the SVG scatter + quadrant tiles inside the given .pb container.
function drawProp(pb, p) {
  const st = propState(p);
  const yKey = st.yStat, yLab = STAT_LABEL[yKey];
  const xKey = st.xStat, xLab = STAT_LABEL[xKey];
  // Score stats can be missing on a game ESPN didn't score; skip those.
  const games = logOf(p).filter(g => g[xKey] != null && g[yKey] != null);
  const chartEl = pb.querySelector(".pb-chart");
  const quadEl = pb.querySelector(".quads");
  drawPricer(pb, p, games);
  if (!games.length) {
    chartEl.innerHTML = `<div class="muted" style="padding:20px 0">No ${BLEND.join(" or ")} games for this player.</div>`;
    quadEl.innerHTML = "";
    return;
  }

  // Quadrant hit rates, each game weighted by its season (gw). Over = strictly
  // greater; a game landing exactly on an integer line is a push and is
  // excluded from all four buckets. Each bucket holds [games, weight].
  const q = { oo:[0,0], ou:[0,0], uo:[0,0], uu:[0,0] };
  let push = 0, wn = 0;
  for (const g of games) {
    const x = g[xKey], y = g[yKey];
    if (x === st.xLine || y === st.yLine) { push++; continue; }
    const b = q[(x > st.xLine ? "o" : "u") + (y > st.yLine ? "o" : "u")];
    b[0]++; b[1] += gw(g); wn += gw(g);
  }
  const n = games.length - push;
  const tile = (label, [c, w]) => {
    const pr = wn ? w / wn : 0;
    return `<div class="quad"><div class="q-h">${label}</div>` +
      `<div class="q-v">${wn ? Math.round(pr * 100) : "—"}%</div>` +
      `<div class="q-s">${c}/${n} games · fair ${wn ? fairOdds(pr) : "—"}</div></div>`;
  };
  // Tiles mirror the chart's quadrants: over/over top-right, under/over
  // top-left, under/under bottom-left, over/under bottom-right.
  const oP = `${xLab} <b>o${st.xLine}</b>`, uP = `${xLab} <b>u${st.xLine}</b>`;
  const oY = `${yLab} <b>o${st.yLine}</b>`, uY = `${yLab} <b>u${st.yLine}</b>`;
  quadEl.innerHTML =
    tile(`${uP} &amp; ${oY}`, q.uo) + tile(`${oP} &amp; ${oY}`, q.oo) +
    tile(`${uP} &amp; ${uY}`, q.uu) + tile(`${oP} &amp; ${uY}`, q.ou) +
    (push ? `<div class="pb-note">${push} push${push>1?"es":""} (exactly on a line) excluded.</div>` : "");

  // Scales — pad the domain so the red lines and edge dots never clip.
  const W = 520, H = 400, ML = 46, MR = 16, MT = 14, MB = 42;
  const xs = games.map(g => g[xKey]), ys = games.map(g => g[yKey]);
  const xmax = Math.max(...xs, st.xLine) + 2;
  const xmin = Math.max(0, Math.min(...xs, st.xLine) - 2);
  const ymax = Math.max(...ys, st.yLine) + 1.5;
  const ymin = Math.max(0, Math.min(...ys, st.yLine) - 1.5);
  const X = v => ML + (v - xmin) / (xmax - xmin) * (W - ML - MR);
  const Y = v => H - MB - (v - ymin) / (ymax - ymin) * (H - MT - MB);

  // Duplicate (x,y) games collapse into one bigger dot: a muted dot sized by
  // every game at that point, with an accent dot on top sized by this
  // season's games there (so a muted ring = last-season games too).
  const cells = new Map();
  for (const g of games) {
    const k = `${g[xKey]},${g[yKey]}`;
    if (!cells.has(k)) cells.set(k, []);
    cells.get(k).push(g);
  }

  const xStep = niceStep(xmax - xmin), yStep = niceStep(ymax - ymin);
  let grid = "", labels = "";
  for (let v = Math.ceil(xmin / xStep) * xStep; v <= xmax; v += xStep) {
    grid += `<line x1="${X(v)}" y1="${MT}" x2="${X(v)}" y2="${H-MB}"/>`;
    labels += `<text x="${X(v)}" y="${H-MB+16}" text-anchor="middle">${v}</text>`;
  }
  for (let v = Math.ceil(ymin / yStep) * yStep; v <= ymax; v += yStep) {
    grid += `<line x1="${ML}" y1="${Y(v)}" x2="${W-MR}" y2="${Y(v)}"/>`;
    labels += `<text x="${ML-8}" y="${Y(v)+3.5}" text-anchor="end">${v}</text>`;
  }

  // One layer per season, oldest first: each layer's dot is sized by games
  // from that season onward, so older seasons show as rings around newer.
  const dot = (k, m) => {
    const [gx, gy] = k.split(",").map(Number);
    return `<circle cx="${X(gx)}" cy="${Y(gy)}" r="${5 + 2.2 * Math.sqrt(m - 1)}" data-k="${k}"/>`;
  };
  const layers = BLEND.map((yr, i) => {
    let d = "";
    for (const [k, gs] of cells) {
      if (!gs.some(g => g.s === yr)) continue;
      d += dot(k, gs.filter(g => g.s >= yr).length);
    }
    return `<g fill="${seasonColor(i)}" stroke="#10161c" stroke-width="2">${d}</g>`;
  }).join("");

  chartEl.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
       aria-label="${p.name}: ${BLEND.join(" + ")} games, ${xLab} vs ${yLab}">
      <g stroke="#2a333d" stroke-width="1">${grid}</g>
      <g fill="#8b98a5" font-size="11">${labels}</g>
      <g stroke="var(--neg)" stroke-width="1.5">
        <line x1="${X(st.xLine)}" y1="${MT}" x2="${X(st.xLine)}" y2="${H-MB}"/>
        <line x1="${ML}" y1="${Y(st.yLine)}" x2="${W-MR}" y2="${Y(st.yLine)}"/>
      </g>
      <g fill="var(--neg)" font-size="10.5">
        <text x="${Math.min(X(st.xLine)+4, W-MR-24)}" y="${MT+11}">${st.xLine}</text>
        <text x="${W-MR-4}" y="${Y(st.yLine)-5}" text-anchor="end">${st.yLine}</text>
      </g>
      ${layers}
      <text x="${(ML+W-MR)/2}" y="${H-6}" text-anchor="middle" fill="#8b98a5" font-size="12">${xLab}</text>
      <text x="12" y="${(MT+H-MB)/2}" text-anchor="middle" fill="#8b98a5" font-size="12"
        transform="rotate(-90 12 ${(MT+H-MB)/2})">${yLab}</text>
    </svg><div class="pb-tip"></div>`;

  // Hover tooltip: date · opp · result · stat line for each game on the dot.
  const tip = chartEl.querySelector(".pb-tip");
  chartEl.querySelectorAll("circle").forEach(c => {
    c.style.cursor = "pointer";
    c.onmouseenter = e => {
      const gs = cells.get(c.dataset.k);
      tip.innerHTML = gs.map(g =>
        `${g.d} ${g.loc} ${g.opp} (${g.res}${g.tm!=null?` ${g.tm}-${g.op}`:""}) — <b>${g.pts} pts, ${g.reb} reb, ${g.ast} ast, ${g.tpm} 3pm</b>`
      ).join("<br>");
      tip.style.display = "block";
      const bb = chartEl.getBoundingClientRect(), cb = c.getBoundingClientRect();
      let tx = cb.left - bb.left + 14, ty = cb.top - bb.top - 8;
      tip.style.left = "0px"; tip.style.top = "0px";
      const tw = tip.offsetWidth;
      if (tx + tw > W - 4) tx = cb.left - bb.left - tw - 14;
      tip.style.left = tx + "px"; tip.style.top = ty + "px";
    };
    c.onmouseleave = () => { tip.style.display = "none"; };
  });
}

// Static shell for the builder; drawProp fills in the chart + tiles.
// Dot color per BLEND index: newest = accent, then progressively dimmer.
const seasonColor = i => ["var(--accent)", "var(--prev)", "var(--old)"][BLEND.length - 1 - i] || "var(--old)";

function propHTML(p) {
  const st = propState(p);
  const g = logOf(p).filter(x => x[st.xStat] != null);
  const hid = nShortHidden(p);
  const cur = BLEND[BLEND.length - 1];
  const nBy = BLEND.map(yr => g.filter(x => x.s === yr).length);
  const wAll = BLEND.reduce((a, yr, i) => a + nBy[i] * SW[yr], 0);
  const share = wAll ? Math.round(100 * nBy[nBy.length - 1] * SW[cur] / wAll) : 0;
  const ratios = BLEND.slice(0, -1).map(yr => `${(SW[cur] / SW[yr]).toFixed(1)}× a ${yr} game`).join(", ");
  return `<div class="pb" data-id="${p.athlete_id}">
    <div class="pb-title">Prop builder — ${BLEND.join(" + ")}, weighted</div>
    <div class="pb-sub">${g.length} game${g.length===1?"":"s"}: ${BLEND.map((yr, i) => `${nBy[i]} in ${yr}`).join(" + ")}.
      Every dot is one game (bigger dot = same score in multiple games). Set your
      lines; the tiles show how often each over/under combo hit, with the fair odds that hit rate
      implies. Hit rates are weighted: a ${cur} game counts ${ratios}
      (the same recency weights as the r columns), so this season is ${share}% of the weight for now.${hid ?
      ` ${hid} short-minute game${hid===1?"":"s"} hidden (under 60% of his usual minutes).` : ""}</div>
    <div class="pb-legend">${BLEND.slice().reverse().map((yr, j) =>
      `<span><i style="background:${seasonColor(BLEND.length - 1 - j)}"></i>${yr}${j===0?" · this season":j===1?" · last season":""}</span>`).join("")}</div>
    <div class="pb-controls">
      <label>1st stat<select data-f="xStat">${opts(X_STATS, st.xStat)}</select></label>
      <label>${STAT_LABEL[st.xStat]} line<input type="number" step="0.5" min="0" value="${st.xLine}" data-f="xLine"></label>
      <label>2nd stat<select data-f="yStat">${opts(Y_STATS, st.yStat)}</select></label>
      <label>${STAT_LABEL[st.yStat]} line<input type="number" step="0.5" min="0" value="${st.yLine}" data-f="yLine"></label>
      <span class="plug" data-plug title="Binary correlation for a devig calculator at these lines (the SGP pricer below). Same size for every over/under combo; positive for Over+Over and Under+Under, negative for an Over/Under mix."></span>
    </div>
    <div class="pb-body"><div class="pb-chart"></div><div class="quads"></div>
    <div class="pr">
      <div class="pb-title">SGP pricer</div>
      <div class="pr-sub"></div>
      <div class="pb-controls">
        <span class="fvw"><label><span data-lab="x"></span> fair odds<input type="text" inputmode="numeric" placeholder="e.g. -110" value="${st.xFv||""}" data-f="xFv"></label><button type="button" class="sgn" data-sgn="xFv" title="Flip the sign (phone number pads have no minus key)">±</button></span>
        <span class="fvw"><label><span data-lab="y"></span> fair odds<input type="text" inputmode="numeric" placeholder="e.g. +120" value="${st.yFv||""}" data-f="yFv"></label><button type="button" class="sgn" data-sgn="yFv" title="Flip the sign (phone number pads have no minus key)">±</button></span>
        <button type="button" class="sgn nvbtn" data-novig title="Fill both legs' fair odds from Novig's exchange: the mid of bid and ask at each line (pregame, books up to ${NV_MAX_SPREAD * 100}¢ wide)">Fetch FV</button>
      </div>
      <div class="nv-out"></div>
      <div class="pr-out"></div>
    </div>
    </div>
  </div>`;
}

// Price the four over/under combos of the builder's two lines. Leg odds are
// the Over's fair odds (e.g. Vulture's Fair column; Under = the complement); a leg
// left blank uses the player's weighted game-log hit rate instead.
function drawPricer(pb, p, games) {
  const el = pb.querySelector(".pr");
  if (!el) return;
  const st = propState(p);
  const xL = STAT_LABEL[st.xStat], yL = STAT_LABEL[st.yStat];
  el.querySelector('[data-lab="x"]').textContent = `${xL} o${st.xLine}`;
  el.querySelector('[data-lab="y"]').textContent = `${yL} o${st.yLine}`;
  const sub = el.querySelector(".pr-sub"), out = el.querySelector(".pr-out");
  const plugEl = pb.querySelector("[data-plug]");
  plugEl.innerHTML = "Plug-in r: —";
  const pair = p[PAIR_KEY[`${st.xStat}|${st.yStat}`]];
  if (!pair || pair.weighted.r === null) {
    sub.textContent = `No ${xL}·${yL} correlation is computed, so these lines can't be priced together here.`;
    out.innerHTML = "";
    return;
  }
  const s = pair.shrunk, r = s ? s.r : pair.weighted.r;
  const leg = (stat, line, txt) => {
    const fv = oddsProb(txt);
    if (fv !== null) return { p: fv, fv: true };
    let w = 0, wo = 0;
    for (const g of games) {
      if (g[stat] === line) continue;
      w += gw(g); if (g[stat] > line) wo += gw(g);
    }
    return { p: w ? wo / w : null, fv: false };
  };
  const X = leg(st.xStat, st.xLine, st.xFv), Y = leg(st.yStat, st.yLine, st.yFv);
  const src = X.fv && Y.fv ? "both legs from the fair odds entered"
    : !X.fv && !Y.fv ? "legs from the game-log hit rates until fair odds are entered"
    : `${X.fv ? yL : xL} leg from the game-log hit rate until its fair odds are entered`;
  sub.innerHTML = `Joint priced with a Gaussian copula on the shrunk ${xL}·${yL} r <b>${num(r, 3)}</b>` +
    (s ? ` (own data ${num(pair.weighted.r, 3)}, prior for the role ${num(s.prior, 3)}, ${Math.round(100 * s.w)}% weight on own data)` : "") +
    `; ${src}. Corr = the binary correlation that r implies for the combo at these lines.`;
  if (X.p === null || Y.p === null || X.p <= 0 || X.p >= 1 || Y.p <= 0 || Y.p >= 1) {
    out.innerHTML = `<div class="pb-note">Not enough games on both sides of a line to price it; enter fair odds.</div>`;
    return;
  }
  const jo = copulaJoint(r, X.p, Y.p);
  const plug = (jo - X.p * Y.p) / Math.sqrt(X.p * (1 - X.p) * Y.p * (1 - Y.p));
  const sgn = v => `${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(3)}`;
  plugEl.innerHTML = `Plug-in r at these lines: <b>${sgn(plug)}</b> <span class="muted">(${sgn(-plug)} for an Over/Under mix)</span>`;
  // Each combo has its own SGP price (a book prices O/O and O/U separately).
  const pays = st.pays ||= {};
  const pct = v => `${(100 * v).toFixed(1)}%`;
  const row = (xo, yo) => {
    const k = (xo ? "o" : "u") + (yo ? "o" : "u");
    const a = xo ? X.p : 1 - X.p, b = yo ? Y.p : 1 - Y.p;
    const rr = xo === yo ? r : -r;  // an Over/Under combo flips the sign
    const j = copulaJoint(rr, a, b);
    const corr = (j - a * b) / Math.sqrt(a * (1 - a) * b * (1 - b));
    return `<tr data-j="${j}"><td class="l">${xL} <b>${xo ? "o" : "u"}${st.xLine}</b> &amp; ${yL} <b>${yo ? "o" : "u"}${st.yLine}</b></td>` +
      `<td class="fv">${fairOdds(j)}</td>` +
      `<td><input type="text" inputmode="decimal" class="payin" placeholder="4.14x" value="${pays[k] || ""}" data-pay="${k}"></td>` +
      `<td data-ev>${evCell(j, pays[k])}</td><td>${(1 / j).toFixed(2)}x</td>` +
      `<td>${pct(j)}</td><td>${corr >= 0 ? "+" : ""}${corr.toFixed(3)}</td><td>${pct(a)} · ${pct(b)}</td></tr>`;
  };
  out.innerHTML = `<table class="sub"><thead><tr><th class="l">Combo</th><th>Fair odds</th>` +
    `<th>SGP odds</th><th>EV</th><th>Fair x</th><th>Fair %</th><th>Corr</th><th>Legs</th></tr></thead><tbody>` +
    row(true, true) + row(false, false) + row(true, false) + row(false, true) + `</tbody></table>`;
  // Typing a price updates that row's EV only, so the input keeps focus.
  out.querySelectorAll("[data-pay]").forEach(inp => inp.oninput = () => {
    pays[inp.dataset.pay] = inp.value.trim();
    const tr = inp.closest("tr");
    tr.querySelector("[data-ev]").innerHTML = evCell(+tr.dataset.j, pays[inp.dataset.pay]);
  });
}

// A slip price -> decimal: "4.14" / "4.14x" as decimal, "+314" / "-120" (or
// any |v| >= 100) as American. null if it isn't a price.
function payDecimal(txt) {
  const t = String(txt || "").replace(/\s|x$/gi, "");
  const v = parseFloat(t);
  if (!Number.isFinite(v)) return null;
  if (/^[+-]/.test(t) || Math.abs(v) >= 100) {
    if (Math.abs(v) < 100) return null;
    return v > 0 ? 1 + v / 100 : 1 + 100 / -v;
  }
  return v > 1 ? v : null;
}

// EV at the slip's price for a combo with fair probability j.
function evCell(j, txt) {
  const d = payDecimal(txt);
  if (d === null) return "—";
  const ev = d * j - 1;
  return `<span style="color:${ev >= 0 ? "var(--pos)" : "var(--neg)"}">${ev >= 0 ? "+" : ""}${(100 * ev).toFixed(1)}%</span>`;
}

// ---- Novig fair values -------------------------------------------------------
// Novig's public catalog (official API, no key, CORS open): every open pregame
// NBA prop with each outcome's best bid. An exchange has no vig to strip: the
// Over ask is 1 - the Under bid and the fair value is the mid. Its app shows
// asks (O 91% / U 15% = 106%), never fair values. Pregame game markets charge
// no taker fee. Wide books (thin alts, some out of order with the ladder) are
// not priced from; same rule as .claude/skills/nba-sgp-fv/novig.py.
const NV_URL = "https://api.novig.com/v3/public/catalog/markets";
const NV_TYPES = { pts:"POINTS", reb:"REBOUNDS", ast:"ASSISTS", tpm:"THREE_POINTERS_MADE" };
const NV_MAX_SPREAD = 0.04;
let NV_CACHE = null;  // { t, items }: one slate pull serves every player for a minute

async function novigMarkets() {
  if (NV_CACHE && Date.now() - NV_CACHE.t < 60e3) return NV_CACHE.items;
  const items = [];
  let after = null;
  for (let i = 0; i < 20; i++) {
    const q = new URLSearchParams({ league:"NBA", marketType:Object.values(NV_TYPES).join(","),
                                    eventStatus:"OPEN_PREGAME", limit:"5000" });
    if (after) q.set("after", after);
    const res = await fetch(`${NV_URL}?${q}`);
    if (!res.ok) throw new Error(`Novig answered ${res.status}`);
    const page = await res.json();
    items.push(...(page.items || []));
    after = page.next;
    if (!after) break;
  }
  NV_CACHE = { t: Date.now(), items };
  return items;
}

// "Darius Acuff Jr." / "Nikola Jokić" -> "darius acuff" / "nikola jokic"
const nvNorm = s => s.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
  .replace(/'/g, "").replace(/[^a-z0-9 ]/g, " ").split(/\s+/)
  .filter(w => w && !["jr", "sr", "ii", "iii", "iv", "v"].includes(w)).join(" ");

// { stat: [{line, bid, ask, mid, spread, vol}] } for the player, or null.
function novigLadder(items, name) {
  const want = nvNorm(name);
  const who = m => m.description.split(" ").slice(0, -2).join(" ");
  const names = [...new Set(items.map(who))];
  let hit = names.filter(n => nvNorm(n) === want);
  if (!hit.length) hit = names.filter(n => nvNorm(n).includes(want));
  if (hit.length !== 1) return null;
  const stat = Object.fromEntries(Object.entries(NV_TYPES).map(([k, v]) => [v, k]));
  const out = {};
  for (const m of items) {
    if (who(m) !== hit[0] || !stat[m.marketType]) continue;
    const side = Object.fromEntries(m.outcomes.map(o => [o.name.split(" ")[0].toLowerCase(), o]));
    const bid = side.over?.bid ? +side.over.bid.price : null;
    const ask = side.under?.bid ? 1 - side.under.bid.price : null;
    const two = bid !== null && ask !== null;
    (out[stat[m.marketType]] ||= []).push({ line: +m.strike, bid, ask, vol: m.volume,
      mid: two ? (bid + ask) / 2 : null, spread: two ? ask - bid : null });
  }
  for (const v of Object.values(out)) v.sort((a, b) => a.line - b.line);
  return out;
}

const nvTight = r => r.spread !== null && r.spread <= NV_MAX_SPREAD + 1e-9;

// Fill each leg's Over fair odds from Novig at its line. A leg whose line is
// missing or too wide is left alone, with Novig's tight lines as chips: a
// click moves the line there and fills its fair odds.
async function fetchNovig(pb, p) {
  const btn = pb.querySelector("[data-novig]"), msg = pb.querySelector(".nv-out");
  btn.disabled = true;
  msg.textContent = "Fetching Novig…";
  let lad;
  try {
    lad = novigLadder(await novigMarkets(), p.name);
  } catch (e) {
    msg.textContent = `Couldn't reach Novig (${e.message}).`;
    btn.disabled = false;
    return;
  }
  btn.disabled = false;
  if (!lad) {
    msg.textContent = `${p.name} isn't on Novig's open pregame props right now.`;
    return;
  }
  const st = propState(p);
  const time = new Date().toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
  const lines = ["x", "y"].map(a => {
    const stat = st[a + "Stat"], line = st[a + "Line"], lab = `${STAT_LABEL[stat]} o${line}`;
    if (!NV_TYPES[stat]) return `${lab}: Novig doesn't list ${STAT_LABEL[stat].toLowerCase()} props.`;
    const rows = lad[stat] || [], at = rows.find(r => r.line === line);
    if (at && nvTight(at)) {
      st[a + "Fv"] = fairOdds(at.mid);
      pb.querySelector(`[data-f="${a}Fv"]`).value = st[a + "Fv"];
      return `${lab}: <b>${st[a + "Fv"]}</b> (mid ${(100 * at.mid).toFixed(1)}%, ` +
             `${(100 * at.bid).toFixed(1)}–${(100 * at.ask).toFixed(1)}, ${(100 * at.spread).toFixed(1)}¢ wide)`;
    }
    const why = !at ? `no Novig line at ${line}`
      : at.mid === null ? `Novig's ${line} is one-sided`
      : `Novig's ${line} is ${(100 * at.spread).toFixed(1)}¢ wide, not used`;
    // Wide books stay pickable, dimmed and with their spread: the mid is shaky
    // but sometimes it's the only line near the slip's.
    const two = rows.filter(r => r.mid !== null);
    const chips = two.map(r => {
      const w = !nvTight(r), sp = `${(100 * r.spread).toFixed(1)}¢`;
      return `<button type="button" class="nv-chip${w ? " wide" : ""}" data-nv="${a}|${r.line}|${fairOdds(r.mid)}"` +
        ` title="${(100 * r.bid).toFixed(1)}–${(100 * r.ask).toFixed(1)}, ${sp} wide${w ? " (mid is rough)" : ""} · vol ${r.vol.toLocaleString()}">` +
        `${r.line} ${fairOdds(r.mid)}${w ? ` <small>${sp}</small>` : ""}</button>`;
    }).join("");
    return `${lab}: ${why}. ${two.length ? `Novig's lines: ${chips}` : "Novig has no two-sided line for this stat."}`;
  });
  msg.innerHTML = `Novig · ${time}<br>` + lines.join("<br>");
  msg.querySelectorAll("[data-nv]").forEach(c => c.onclick = () => {
    const [a, line, fv] = c.dataset.nv.split("|");
    st[a + "Line"] = +line;
    st[a + "Fv"] = fv;
    pb.querySelector(`[data-f="${a}Line"]`).value = line;
    pb.querySelector(`[data-f="${a}Fv"]`).value = fv;
    msg.querySelectorAll(`[data-nv^="${a}|"]`).forEach(o => o.classList.toggle("on", o === c));
    drawProp(pb, p);
  });
  drawPricer(pb, p, logOf(p).filter(g => g[st.xStat] != null && g[st.yStat] != null));
}

// Bind builder controls + first draw. Input changes redraw only this builder
// (no full table re-render, so typing keeps focus).
function initProp(pb) {
  const p = DATA.players.find(x => x.athlete_id === pb.dataset.id);
  if (!p) return;
  pb.querySelectorAll("[data-f]").forEach(el => {
    const f = el.dataset.f;
    const h = () => {
      const st = propState(p);
      if (f === "xFv" || f === "yFv") {
        // Pricer inputs: keep the raw text (odds can be negative), reprice only.
        st[f] = el.value.trim();
        drawPricer(pb, p, logOf(p).filter(g => g[st.xStat] != null && g[st.yStat] != null));
        return;
      }
      // A new stat or line makes that leg's entered fair odds and the
      // combos' SGP prices stale.
      const a = f[0];
      st[a + "Fv"] = "";
      st.pays = {};
      const fvIn = pb.querySelector(`[data-f="${a}Fv"]`);
      if (fvIn) fvIn.value = "";
      if (f === "xStat" || f === "yStat") {
        // New stat -> reset its line to the blended mean, relabel the input.
        st[f] = el.value;
        st[a + "Line"] = halfLine(p["_" + el.value]);
        const inp = pb.querySelector(`[data-f="${a}Line"]`);
        inp.value = st[a + "Line"];
        inp.parentElement.firstChild.textContent = STAT_LABEL[el.value] + " line";
        // Game counts in the subtitle depend on which games have a score.
        if (f === "xStat") {
          pb.outerHTML = propHTML(p);
          initProp(document.querySelector(`.pb[data-id="${p.athlete_id}"]`));
          return;
        }
      } else {
        const v = parseFloat(el.value);
        if (!Number.isFinite(v) || v < 0) return;
        st[f] = v;
      }
      drawProp(pb, p);
    };
    el.tagName === "SELECT" ? el.onchange = h : el.oninput = h;
  });
  // ± flips an odds box between + and −: phone number pads have no minus key.
  pb.querySelectorAll(".sgn").forEach(btn => btn.onclick = () => {
    const inp = pb.querySelector(`[data-f="${btn.dataset.sgn}"]`);
    const v = inp.value.trim().replace(/^\+/, "");
    inp.value = v.startsWith("-") ? v.slice(1) : "-" + v;
    inp.dispatchEvent(new Event("input"));
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
  });
  pb.querySelector("[data-novig]").onclick = () => fetchNovig(pb, p);
  drawProp(pb, p);
}

// Expanded per-season history block (rendered in a full-width detail row).
function detailHTML(p) {
  const yrs = Object.keys(p.by_season||{}).sort();
  let body = yrs.map(y => {
    const s = p.by_season[y];
    const sg = s.short_games ? ` <span class="muted" title="short-minute games left out">(−${s.short_games})</span>` : "";
    return `<tr><td class="l"><b>${y}</b></td><td>${s.games}${sg}</td><td>${num(s.min_mean,1)}</td>`+
           `<td>${num(s.pts_mean,1)}</td><td>${num(s.reb_mean,1)}</td><td>${num(s.ast_mean,1)}</td><td>${num(s.tpm_mean,1)}</td>`+
           `<td class="l">${rMini(s.pts_reb)}</td><td class="l">${rMini(s.pts_ast)}</td><td class="l">${rMini(s.pts_3pm)}</td>`+
           `<td class="l">${rMini(s.tot_reb)}</td><td class="l">${rMini(s.tm_reb)}</td><td class="l">${rMini(s.op_reb)}</td></tr>`;
  }).join("");
  // Pooled (all seasons, recency-weighted) reference row.
  body += `<tr class="pool"><td class="l" title="Each season is centered on its own average before pooling, so a season where his role moved every stat up or down together can't fake a correlation"><b>Pooled</b> <span class="muted">(wtd, within-season)</span></td>`+
          `<td>${p.n_games}</td><td>${num(p.min_mean,1)}</td>`+
          `<td>${num(p.pts_mean,1)}</td><td>${num(p.reb_mean,1)}</td><td>${num(p.ast_mean,1)}</td><td>${num(p.tpm_mean,1)}</td>`+
          `<td class="l">${rCell(p.pts_reb,1)}</td><td class="l">${rCell(p.pts_ast,1)}</td><td class="l">${rCell(p.pts_3pm,1)}</td>`+
          `<td class="l">${rCell(p.tot_reb,1)}</td><td class="l">${rCell(p.tm_reb,1)}</td><td class="l">${rCell(p.op_reb,1)}</td></tr>`;
  return `<div class="detail-wrap">${propHTML(p)}<div class="detail-h">Per-season history — box stats &amp; within-season correlations`+
         ` <span class="muted">(left columns above blend ${BLEND.join(" + ")}, weighted like the prop builder; r columns pool every season's game-to-game swings around that season's average, recency-weighted)</span></div>`+
         `<div class="sub-scroll"><table class="sub"><thead><tr><th class="l">Season</th><th>G</th><th>Min</th><th>Pts</th><th>Reb</th><th>Ast</th><th>3PM</th>`+
         `<th class="l">PTS·REB</th><th class="l">PTS·AST</th><th class="l">PTS·3PM</th>`+
         `<th class="l">TOT·REB</th><th class="l">TM·REB</th><th class="l">OPP·REB</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
}

function sortKey(p, key) {
  if (key.includes(".")) { const v = get(p, key)?.r; return v===null||v===undefined?-Infinity:v; }
  const v = get(p, key); return (typeof v==="string") ? v.toLowerCase() : (v??-Infinity);
}

function render() {
  if (!DATA) return;
  const q = document.getElementById("search").value.trim().toLowerCase();
  const minMpg = +document.getElementById("minmpg").value || 0;
  const minG = +document.getElementById("ming").value || 0;
  // No baked-in filtering: show everyone (negative correlations included).
  // The two inputs are optional, off by default (0). Filter on the blended
  // blended multi-season figures that the left columns display.
  let rows = DATA.players.filter(p => p._g >= minG && (p._min||0) >= minMpg);
  if (MODE === "today") {
    const ids = TODAY_IDS || new Set(DATA.schedule_today.team_ids);
    rows = rows.filter(p => p.team_id && ids.has(p.team_id));
  }
  if (q) rows = rows.filter(p => p.name.toLowerCase().includes(q));
  // Out players are always left off; counted after the other filters, so
  // the note says how many would otherwise show.
  const nOut = rows.filter(p => INJ.get(p.athlete_id)?.out).length;
  document.getElementById("outn").textContent = nOut ? `${nOut} OUT hidden` : "";
  rows = rows.filter(p => !INJ.get(p.athlete_id)?.out);

  rows.sort((a,b) => {
    const av = sortKey(a, SORT.key), bv = sortKey(b, SORT.key);
    if (av === -Infinity || bv === -Infinity) return (av === -Infinity) - (bv === -Infinity);
    if (av < bv) return -SORT.dir; if (av > bv) return SORT.dir; return 0;
  });

  const thead = document.querySelector("#tbl thead");
  thead.innerHTML = "<tr>" + COLS.map(c => {
    const on = c.k === SORT.key ? "sorted " + (SORT.dir>0?"asc":"") : "";
    return `<th class="${c.l?'l ':''}${on}" data-k="${c.k}"${c.ht?` title="${c.ht}"`:""}>${c.h}</th>`;
  }).join("") + "</tr>";
  thead.querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (SORT.key === k) SORT.dir *= -1;
    else SORT = { key:k, dir: ["name","team_abbr","position"].includes(k) ? 1 : -1 };
    const sel = document.getElementById("sortsel");
    if ([...sel.options].some(o => o.value === k)) sel.value = k;
    render();
  });

  const tbody = document.querySelector("#tbl tbody");
  tbody.innerHTML = rows.map(p => {
    const main = `<tr class="prow" data-id="${p.athlete_id}">` +
      COLS.map(c => {
        const kind = c.k === "name" ? "c-name" : c.l ? "c-tag" : c.k.includes(".") ? "c-r" : "c-stat";
        const lab = kind === "c-stat" || kind === "c-r" ? ` data-label="${c.h.replace(/ r$/, "")}"` : "";
        return `<td class="${c.l?'l ':''}${kind}${c.k===SORT.key?' srt':''}"${lab}>${c.v(p)}</td>`;
      }).join("") + "</tr>";
    const det = EXPANDED.has(p.athlete_id)
      ? `<tr class="drow"><td colspan="${COLS.length}">${detailHTML(p)}</td></tr>` : "";
    return main + det;
  }).join("");
  tbody.querySelectorAll("tr.prow").forEach(tr => tr.onclick = () => {
    const id = tr.dataset.id;
    if (EXPANDED.has(id)) EXPANDED.delete(id); else EXPANDED.add(id);
    render();
  });
  tbody.querySelectorAll(".pb").forEach(initProp);

  document.getElementById("sortdir").textContent = SORT.dir < 0 ? "↓ High first" : "↑ Low first";
  document.getElementById("count").textContent =
    `${rows.length} player${rows.length===1?"":"s"}` + (MODE==="today" ? " playing today" : "");
}

function setMode(m) {
  MODE = m;
  document.querySelectorAll("#toggle button").forEach(b =>
    b.classList.toggle("on", b.dataset.mode === m));
  render();
}

// Box stats shown in the left columns: every pulled season, each game
// weighted by its season (the same per-game recency weights as the pooled r).
// Re-run when the short-minute toggle changes. No games -> "—".
function blendBox() {
  DATA.players.forEach(p => {
    const gs = logOf(p);
    // Per-field weight totals: game scores can be missing on a few games.
    const sum = { min:0, pts:0, reb:0, ast:0, tpm:0, tot:0, tm:0, op:0 };
    const w = { ...sum };
    for (const g of gs) {
      const k = gw(g);
      for (const f in sum) if (g[f] != null) { sum[f] += k * g[f]; w[f] += k; }
    }
    p._g = gs.length;
    for (const f in sum) p["_" + f] = w[f] ? sum[f] / w[f] : null;
  });
}

async function init() {
  try {
    const r = await fetch("./data/nba_correlations.json");
    if (!r.ok) throw new Error("could not load data/nba_correlations.json");
    DATA = await r.json();
  } catch (e) {
    document.getElementById("err").style.display = "block";
    document.getElementById("err").textContent = "Error: " + e.message +
      " — run scripts/nba_fetch_correlations.py first.";
    return;
  }

  SW = DATA.weighting?.per_game_season_weights || {};
  BLEND = DATA.recent_seasons || [];
  blendBox();

  const wtxt = Object.entries(SW).map(([k,v])=>`${k}: ${v}`).join(", ");
  document.getElementById("meta").innerHTML =
    `Seasons ${DATA.seasons.join("–")} · regular season, short-minute games (&lt;60% of usual) excluded from r · recency weights (${wtxt}) · ` +
    `${DATA.players.length} players · box stats + prop builder = ${BLEND.join(" + ")} weighted · r = all seasons pooled/weighted, ` +
    `${DATA.shrinkage ? "shrunk toward players in a similar role, shown as the plug-in r for a devig calculator (hover a header) · " : ""}` +
    `click a player for the prop builder + per-season history · generated ${new Date(DATA.generated_at).toLocaleString()}`;

  // Live schedule for the toggle; fall back to the baked snapshot.
  const live = await liveTodayIds();
  if (live) { TODAY_IDS = live.ids; renderSched(live.games, true); }
  else {
    TODAY_IDS = new Set(DATA.schedule_today.team_ids);
    renderSched(DATA.schedule_today.games.map(g=>({matchup:g.matchup, st:g.state})), false);
  }

  document.querySelectorAll("#toggle button").forEach(b =>
    b.onclick = () => setMode(b.dataset.mode));
  document.getElementById("meta").onclick = e => e.currentTarget.classList.toggle("open");
  document.getElementById("search").oninput = render;
  document.getElementById("minmpg").oninput = render;
  document.getElementById("ming").oninput = render;
  document.getElementById("shortg").onchange = e => {
    SHOW_SHORT = e.target.checked; blendBox(); render();
  };
  document.getElementById("sortsel").onchange = e => {
    SORT = { key: e.target.value, dir: -1 }; render();
  };
  document.getElementById("sortdir").onclick = () => { SORT.dir *= -1; render(); };
  render();
  // The injury report lands after the first paint, then filters and badges.
  loadInjuries().then(render);
}
// The visible page width (no scrollbar), for .detail-wrap.
const setVw = () => document.documentElement.style.setProperty("--vw", document.documentElement.clientWidth + "px");
setVw();
addEventListener("resize", setVw);
init();
</script>
