<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NBA Teammate Correlations</title>
<style>
  :root {
    --bg:#0f1419; --panel:#1a2129; --line:#2a333d; --txt:#e6edf3;
    --muted:#8b98a5; --accent:#f5a623; --pos:#3fb950; --neg:#f85149;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:18px 22px 10px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:19px; }
  h1 a { color:var(--muted); font-size:12.5px; font-weight:400; margin-left:10px; text-decoration:none; }
  h1 a:hover { color:var(--accent); }
  .sub { color:var(--muted); font-size:12.5px; }
  .controls { display:flex; flex-wrap:wrap; gap:12px 14px; align-items:center;
    padding:12px 22px; border-bottom:1px solid var(--line); position:sticky;
    top:0; background:var(--bg); z-index:5; }
  .toggle { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex-wrap:wrap; }
  .toggle button { background:transparent; color:var(--muted); border:0;
    padding:7px 13px; font-size:13px; cursor:pointer; }
  .toggle button.on { background:var(--accent); color:#1a1a1a; font-weight:600; }
  input[type=search], input[type=number], select { background:var(--panel); border:1px solid var(--line);
    color:var(--txt); border-radius:8px; padding:7px 10px; font-size:13px; }
  input[type=search] { width:170px; }
  label.muted input { margin-left:4px; }
  .muted { color:var(--muted); }
  .count { color:var(--muted); font-size:12.5px; margin-left:auto; }
  .note { padding:10px 22px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12.5px; }
  .note b { color:var(--txt); font-weight:600; }
  .priors { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:6px; font-size:12px; }
  .priors span b { font-weight:600; }
  .wrap { overflow-x:auto; padding:0 12px 60px; }
  table { border-collapse:collapse; width:100%; min-width:1060px; }
  th,td { padding:7px 9px; text-align:right; white-space:nowrap; }
  th { position:sticky; top:0; background:var(--panel); color:var(--muted);
    font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;
    cursor:pointer; border-bottom:1px solid var(--line); user-select:none; }
  th:hover { color:var(--txt); }
  th.sorted::after { content:" \25BC"; font-size:9px; }
  th.sorted.asc::after { content:" \25B2"; }
  td.l, th.l { text-align:left; }
  tbody tr { border-bottom:1px solid #20272f; }
  tbody tr:hover { background:#161d24; }
  .name { font-weight:600; }
  .role { display:inline-block; min-width:16px; text-align:center; font-size:10px; font-weight:700;
    border:1px solid var(--line); border-radius:4px; color:var(--muted); margin-left:6px; padding:0 3px; }
  .ln { color:var(--muted); font-size:11.5px; margin-left:5px; }
  .moved { color:var(--accent); font-size:10.5px; margin-left:5px; cursor:help; }
  .r { font-weight:600; border-radius:4px; padding:1px 5px; }
  .raw { color:var(--muted); font-size:12px; }
  .bar { display:inline-block; height:7px; border-radius:3px; background:var(--accent); vertical-align:middle; margin-right:6px; opacity:.8; }
  .err { color:var(--neg); padding:20px 22px; }
  @media (max-width:640px) {
    header, .controls, .note { padding-left:14px; padding-right:14px; }
    input[type=search] { width:130px; }
    .count { margin-left:0; }
  }
</style>
</head>
<body>
<header>
  <h1>NBA Teammate Correlations <a href="nba.html">&larr; Player correlations</a></h1>
  <div class="sub" id="meta">Loading…</div>
</header>

<div class="controls">
  <div class="toggle" id="mode">
    <button data-mode="ast_pts" class="on">AST → PTS</button>
    <button data-mode="ast_3pm">AST → 3PM</button>
    <button data-mode="reb_reb">REB · REB</button>
    <button data-mode="net">Assist network</button>
  </div>
  <select id="team"><option value="">All teams</option></select>
  <input type="search" id="qa" placeholder="Player A / passer…" />
  <input type="search" id="qb" placeholder="Player B / scorer…" />
  <label class="muted" title="Both players must average at least this many minutes. Set to 0 to include deep bench.">Min mpg
    <input type="number" id="minmpg" value="20" min="0" step="1" style="width:56px" />
  </label>
  <label class="muted" title="Minimum games the two played together.">Min G
    <input type="number" id="ming" value="25" min="0" step="1" style="width:56px" />
  </label>
  <label class="muted" title="Hide pairs where either player is no longer on that team (ESPN's current rosters).">
    <input type="checkbox" id="cur" checked /> Still teammates
  </label>
  <span class="count" id="count"></span>
</div>

<div class="note" id="note"></div>
<div class="wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
<div class="err" id="err" style="display:none"></div>

<script>
let DATA = null, P = new Map(), MODE = "ast_pts";
let SORT = { key: "shrunk", dir: -1 };
const ROLE_TXT = { S: "starter (28+ mpg)", R: "rotation (18–28 mpg)", B: "bench (<18 mpg)" };
const STAT_TXT = { pts: "PTS", ast: "AST", tpm: "3PM", reb: "REB" };
const MODE_STATS = { ast_pts: ["ast", "pts"], ast_3pm: ["ast", "tpm"], reb_reb: ["reb", "reb"] };
const num = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : v.toFixed(d);
const sgn = (v, d = 3) => (v === null || v === undefined) ? "—" : (v > 0 ? "+" : "") + v.toFixed(d);
const pct = v => (v === null || v === undefined) ? "—" : (100 * v).toFixed(0) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pl = (pr, k) => P.get(pr.team_id + ":" + pr[k]);

// Heat around zero: full colour at 2 SD of the visible column.
let SD = {};
function heat(col, v) {
  const sd = SD[col];
  if (!sd || v === null || v === undefined) return "";
  const t = Math.max(-1, Math.min(1, v / (2 * sd))), a = Math.abs(t);
  const to = t >= 0 ? [63, 185, 80] : [248, 81, 73], mid = [230, 237, 243];
  const fg = mid.map((c, i) => Math.round(c + (to[i] - c) * a));
  return `color:rgb(${fg});background:rgba(${to},${(0.22 * a * a).toFixed(3)})`;
}

function playerCell(p, stat) {
  const moved = p.current_team && p.current_team !== p.team_abbr
    ? `<span class="moved" title="Now on ${esc(p.current_team)}">→${esc(p.current_team)}</span>` : "";
  const ln = stat ? `<span class="ln">${STAT_TXT[stat]} ${num(p[stat + "_mean"], 1)} · line ${p.lines[stat]}</span>` : "";
  return `<span class="name">${esc(p.name)}</span><span class="role" title="${ROLE_TXT[p.role]}, ${p.mpg} mpg">${p.role}</span>${moved}${ln}`;
}

// Column definitions per mode. v(pr) gives the sort/display value.
function cols() {
  const teamCol = { k: "team", t: "Team", l: 1, v: pr => pl(pr, "a").team_abbr };
  if (MODE === "net") {
    return [
      teamCol,
      { k: "a", t: "Passer", l: 1, v: pr => pl(pr, "a").name, h: pr => playerCell(pl(pr, "a"), "ast") },
      { k: "b", t: "Scorer", l: 1, v: pr => pl(pr, "b").name, h: pr => playerCell(pl(pr, "b"), "pts") },
      { k: "n", t: "G", v: pr => pr.n },
      { k: "pg", t: "Ast→B /g", v: pr => pr.assists.per_game,
        h: pr => `<span class="bar" style="width:${Math.min(60, pr.assists.per_game * 20)}px"></span>${num(pr.assists.per_game)}` },
      { k: "tpg", t: "3PT ast /g", v: pr => pr.assists.threes_per_game, h: pr => num(pr.assists.threes_per_game) },
      { k: "sa", t: "% of A's ast", v: pr => pr.assists.share_of_a_ast, h: pr => pct(pr.assists.share_of_a_ast) },
      { k: "sb", t: "% of B's FGM", v: pr => pr.assists.share_of_b_fgm, h: pr => pct(pr.assists.share_of_b_fgm) },
      { k: "s3", t: "% of B's 3PM", v: pr => pr.assists.share_of_b_3pm, h: pr => pct(pr.assists.share_of_b_3pm) },
      { k: "mx", t: "Max /g", v: pr => pr.assists.max_game },
      { k: "ap", t: "AST·PTS", heat: 1, v: pr => pr.ast_pts?.shrunk ?? null, h: pr => rcell("ap", pr.ast_pts) },
      { k: "a3", t: "AST·3PM", heat: 1, v: pr => pr.ast_3pm?.shrunk ?? null, h: pr => rcell("a3", pr.ast_3pm) },
    ];
  }
  const [sa, sb] = MODE_STATS[MODE];
  const c = [
    teamCol,
    { k: "a", t: "Player A · " + STAT_TXT[sa], l: 1, v: pr => pl(pr, "a").name, h: pr => playerCell(pl(pr, "a"), sa) },
    { k: "b", t: "Player B · " + STAT_TXT[sb], l: 1, v: pr => pl(pr, "b").name, h: pr => playerCell(pl(pr, "b"), sb) },
    { k: "n", t: "G", v: pr => pr.n },
    { k: "shrunk", t: "Shrunk φ", heat: 1, v: pr => pr[MODE].shrunk ?? null, h: pr => rcell("shrunk", pr[MODE]) },
    { k: "phi", t: "Raw φ", heat: 1, v: pr => pr[MODE].phi, h: pr => `<span class="r" style="${heat("phi", pr[MODE].phi)}">${sgn(pr[MODE].phi, 2)}</span>` },
    { k: "r", t: "Raw r", v: pr => pr[MODE].r, h: pr => `<span class="raw">${sgn(pr[MODE].r, 2)}</span>` },
    { k: "rc", t: "r close", v: pr => pr[MODE].r_close, h: pr => `<span class="raw" title="${pr[MODE].n_close} games within 12 pts">${sgn(pr[MODE].r_close, 2)}</span>` },
    { k: "prior", t: "Role prior", v: pr => pr[MODE].prior ?? null, h: pr => `<span class="raw">${sgn(pr[MODE].prior ?? null, 3)}</span>` },
    { k: "both", t: "Both over", v: pr => pr[MODE].hit_both - pr[MODE].hit_a * pr[MODE].hit_b,
      h: pr => { const s = pr[MODE]; const ind = s.hit_a * s.hit_b;
        return `${pct(s.hit_both)} <span class="raw" title="If independent: ${pct(s.hit_a)} × ${pct(s.hit_b)}">vs ${pct(ind)}</span>`; } },
  ];
  if (MODE !== "reb_reb") {
    c.push({ k: "pg", t: "A→B ast /g", v: pr => pr.assists.per_game,
      h: pr => `${num(pr.assists.per_game)} <span class="raw">(${pct(pr.assists.share_of_a_ast)})</span>` });
  }
  return c;
}
function rcell(col, s) {
  if (!s || s.shrunk === undefined) return '<span class="raw">—</span>';
  return `<span class="r" style="${heat(col, s.shrunk)}" title="raw φ ${sgn(s.phi, 2)} · r ${sgn(s.r, 2)} · prior ${sgn(s.prior, 3)} · weight ${num(s.w, 2)}">${sgn(s.shrunk)}</span>`;
}

function rows() {
  const team = document.getElementById("team").value;
  const qa = document.getElementById("qa").value.trim().toLowerCase();
  const qb = document.getElementById("qb").value.trim().toLowerCase();
  const ming = +document.getElementById("ming").value || 0;
  const cur = document.getElementById("cur").checked;
  const minmpg = +document.getElementById("minmpg").value || 0;
  return DATA.pairs.filter(pr => {
    if (MODE !== "net" && !pr[MODE]) return false;  // REB·REB stored once per unordered pair
    if (MODE === "net" && pr.assists.per_game <= 0) return false;
    if (pr.n < ming || (team && pr.team_id !== team)) return false;
    const a = pl(pr, "a"), b = pl(pr, "b");
    if (a.mpg < minmpg || b.mpg < minmpg) return false;
    if (cur && (a.current_team !== a.team_abbr || b.current_team !== b.team_abbr)) return false;
    if (MODE === "reb_reb" && (qa || qb)) {   // symmetric: either name in either slot
      const na = a.name.toLowerCase(), nb = b.name.toLowerCase();
      const ok = (x, y) => (!qa || x.includes(qa)) && (!qb || y.includes(qb));
      return ok(na, nb) || ok(nb, na);
    }
    if (qa && !a.name.toLowerCase().includes(qa)) return false;
    if (qb && !b.name.toLowerCase().includes(qb)) return false;
    return true;
  });
}

function render() {
  const C = cols();
  let R = rows();
  SD = {};
  for (const c of C) if (c.heat) {
    const vs = R.map(c.v).filter(v => v !== null && Number.isFinite(v));
    if (vs.length > 2) SD[c.k] = Math.sqrt(vs.reduce((a, v) => a + v * v, 0) / vs.length);
  }
  if (MODE !== "net") { SD.phi = SD.phi || 0.2; }
  const sc = C.find(c => c.k === SORT.key) || C[4];
  const nil = v => v === null || v === undefined || Number.isNaN(v);
  R.sort((x, y) => {
    const a = sc.v(x), b = sc.v(y);
    if (nil(a) || nil(b)) return nil(a) - nil(b);   // blanks last either way
    return (typeof a === "string" ? a.localeCompare(b) : a - b) * SORT.dir;
  });
  const shown = R.slice(0, 400);
  const thead = document.querySelector("#tbl thead");
  thead.innerHTML = "<tr>" + C.map(c =>
    `<th data-k="${c.k}" class="${c.l ? "l " : ""}${c.k === sc.k ? "sorted" + (SORT.dir === 1 ? " asc" : "") : ""}">${c.t}</th>`).join("") + "</tr>";
  document.querySelector("#tbl tbody").innerHTML = shown.map(pr =>
    "<tr>" + C.map(c => `<td class="${c.l ? "l" : ""}">${c.h ? c.h(pr) : esc(c.v(pr))}</td>`).join("") + "</tr>").join("");
  document.getElementById("count").textContent =
    `${R.length} pair${R.length === 1 ? "" : "s"}` + (R.length > shown.length ? ` · top ${shown.length} shown` : "");
  renderNote();
}

function renderNote() {
  const el = document.getElementById("note");
  if (MODE === "net") {
    el.innerHTML = `Who sets up whom, from play-by-play. <b>Ast→B /g</b>: baskets by B that A assisted, per game together.
      <b>% of A's ast</b>: share of A's assists that went to B. <b>% of B's FGM / 3PM</b>: share of B's makes that came off A's passes.
      Shrunk AST·PTS / AST·3PM correlations alongside. Type a passer in the first box to see where his assists go, or a scorer in the second to see who feeds him.`;
    return;
  }
  const pr = DATA.priors[MODE], [sa, sb] = MODE_STATS[MODE];
  const what = MODE === "reb_reb" ? "two teammates' rebounds" : `A's ${STAT_TXT[sa]} and B's ${STAT_TXT[sb]}`;
  const cells = Object.entries(pr.by_role).map(([c, d]) =>
    `<span title="${ROLE_TXT[c[0]]} × ${ROLE_TXT[c[1]]}, ${d.pairs} pairs"><b>${c[0]}·${c[1]}</b> ${sgn(d.phi)}</span>`).join("");
  el.innerHTML = `Correlation between ${what} over the games both played. <b>φ</b> uses Over/Under hits at a proxy line
    (season mean rounded down + 0.5), the number the SGP math uses. <b>Shrunk φ</b> pulls each pair toward its role pairing's
    league average; one season of pairs is noisy (league spread τ ${pr.tau.toFixed(3)}), so the shrunk value is the one to price with.
    <b>Both over</b> is how often both went over, vs. what independence predicts.
    <div class="priors">League φ ${sgn(pr.league_phi)} · by role (A·B, S/R/B = starter/rotation/bench): ${cells}</div>`;
}

function init() {
  fetch("./data/nba_teammates.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
    DATA = d;
    for (const p of d.players) P.set(p.team_id + ":" + p.athlete_id, p);
    const teams = [...new Map(d.players.map(p => [p.team_id, p.team_abbr]))].sort((a, b) => a[1].localeCompare(b[1]));
    document.getElementById("team").innerHTML += teams.map(([id, ab]) => `<option value="${id}">${esc(ab)}</option>`).join("");
    document.getElementById("meta").textContent =
      `${d.season_label} regular season · ${d.n_games} games · ${d.n_assists_linked.toLocaleString()} assists linked from play-by-play · pairs with ${d.min_games_together}+ games together · updated ${d.generated_at.slice(0, 10)}`;
    render();
  }).catch(e => {
    const el = document.getElementById("err"); el.style.display = ""; el.textContent = "Couldn't load teammate data: " + e.message;
  });
  document.getElementById("mode").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    MODE = b.dataset.mode;
    document.querySelectorAll("#mode button").forEach(x => x.classList.toggle("on", x === b));
    SORT = { key: MODE === "net" ? "pg" : "shrunk", dir: -1 };
    render();
  });
  document.querySelector("#tbl thead").addEventListener("click", e => {
    const th = e.target.closest("th"); if (!th) return;
    if (SORT.key === th.dataset.k) SORT.dir *= -1;
    else SORT = { key: th.dataset.k, dir: ["team", "a", "b"].includes(th.dataset.k) ? 1 : -1 };
    render();
  });
  for (const id of ["team", "qa", "qb", "minmpg", "ming", "cur"]) document.getElementById(id).addEventListener("input", () => DATA && render());
}
init();
</script>
</body>
</html>
