# Railway/Nixpacks build config.
# Installs Node.js + Python 3 + curl_cffi so dk_api.py can call DraftKings
# with Chrome TLS fingerprint impersonation (bypasses Akamai bot protection).

# `chromium` is for the DK_COOKIE_BROWSER cookie minter (mints a validated
# Akamai _abck for calculateBets). It lands on PATH as `chromium`; dk_api.py's
# minter finds it via shutil.which and drives it with Playwright. Only used when
# DK_COOKIE_BROWSER is set — otherwise it just sits in the image unused.
[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip", "gcc", "chromium"]

[phases.install]
cmds = [
  "npm ci --omit=dev",
  "pip install --break-system-packages --no-cache-dir -r requirements.txt",
]

[start]
cmd = "node server.js"
